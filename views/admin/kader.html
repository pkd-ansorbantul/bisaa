<!-- ============================================================
     KADER VIEW — Fragment HTML
     Dimuat oleh: js/router.js
     Logic: views/admin/kader.js
     ============================================================ -->

<!-- Page Title -->
<h2 class="section-title">
  <i class="bi bi-people-fill me-2" aria-hidden="true"></i>Statistik & Data Kader
</h2>

<!-- Stats Row -->
<div class="row g-2 mb-3">
  <div class="col-6 col-md-3">
    <div class="stat-mini">
      <div class="num" id="statTotalKader">-</div>
      <div class="lbl">Total Kader</div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="stat-mini">
      <div class="num" id="statTotalPac">-</div>
      <div class="lbl">Jumlah PAC</div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="stat-mini">
      <div class="num" id="statTotalPendidikan">-</div>
      <div class="lbl">Jenjang Pendidikan</div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="stat-mini">
      <div class="num" id="statTotalPekerjaan">-</div>
      <div class="lbl">Jenis Pekerjaan</div>
    </div>
  </div>
</div>

<!-- Toolbar -->
<div class="row mb-3 g-2 align-items-center">
  <div class="col-lg-6">
    <div class="d-flex gap-2 flex-wrap align-items-center">
      <button type="button" class="btn btn-outline-success" id="exportKaderBtn" aria-label="Ekspor data kader">
        <i class="bi bi-download" aria-hidden="true"></i> Ekspor CSV
      </button>
      <button type="button" class="btn btn-outline-primary" id="refreshKaderBtn" aria-label="Segarkan data">
        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Segarkan
      </button>
      <span id="cacheStatus" class="cache-status" aria-live="polite">Memuat...</span>
    </div>
  </div>
  <div class="col-lg-6 d-flex gap-2 justify-content-lg-end flex-wrap">
    <div class="input-group" style="max-width: 250px;">
      <span class="input-group-text bg-white border-end-0">
        <i class="bi bi-search text-muted" aria-hidden="true"></i>
      </span>
      <input 
        type="text" 
        class="form-control border-start-0" 
        id="searchKaderInput" 
        placeholder="Cari nama atau PAC..." 
        autocomplete="off"
        aria-label="Cari kader"
      >
    </div>
    <select class="form-select" style="width: 180px;" id="filterPacKader" aria-label="Filter PAC">
      <option value="">Semua PAC</option>
    </select>
  </div>
</div>

<!-- Charts Row -->
<div class="row g-3 mb-4">
  <div class="col-lg-7">
    <div class="stat-card" style="text-align: left; padding: 1.2rem;">
      <h6 class="fw-bold mb-0">
        <i class="bi bi-bar-chart me-2" aria-hidden="true"></i>Sebaran Kader per PAC
      </h6>
      <div class="chart-container" style="height: 280px; margin-top: 15px;">
        <canvas id="chartPac" aria-label="Chart sebaran kader per PAC"></canvas>
      </div>
    </div>
  </div>
  <div class="col-lg-5">
    <div class="stat-card" style="text-align: left; padding: 1.2rem;">
      <h6 class="fw-bold mb-0">
        <i class="bi bi-pie-chart me-2" aria-hidden="true"></i>Sebaran Pendidikan
      </h6>
      <div class="chart-container" style="height: 280px; margin-top: 15px;">
        <canvas id="chartPendidikan" aria-label="Chart sebaran pendidikan kader"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- Table Container — diisi oleh kader.js -->
<div id="kaderTableContainer" class="table-container" aria-live="polite">
  <!-- Skeleton initial -->
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th style="width: 50px;"><div class="skeleton-box" style="height: 20px; width: 20px;"></div></th>
          <th><div class="skeleton-box" style="height: 20px; width: 100px;"></div></th>
          <th><div class="skeleton-box" style="height: 20px; width: 100px;"></div></th>
          <th><div class="skeleton-box" style="height: 20px; width: 100px;"></div></th>
          <th><div class="skeleton-box" style="height: 20px; width: 100px;"></div></th>
          <th><div class="skeleton-box" style="height: 20px; width: 100px;"></div></th>
          <th><div class="skeleton-box" style="height: 20px; width: 100px;"></div></th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="7" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Memuat data kader...</span>
            </div>
            <p class="mt-2 text-muted small">Memuat data kader...</p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- ============================================================
     MODAL: DETAIL KADER
     ============================================================ -->
<div class="modal fade" id="detailKaderModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-info text-white border-0 rounded-top-4">
        <h5 class="modal-title">
          <i class="bi bi-eye me-2" aria-hidden="true"></i>Detail Kader
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <div class="modal-body p-4" style="max-height: 75vh; overflow-y: auto;">
        <div id="detailKaderContent"></div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>
