<!-- views/admin/data-absensi.html — konten saja -->
<h2 class="section-title"><i class="bi bi-table me-2"></i>Manajemen Data Absensi</h2>

<!-- TOOLBAR FILTER -->
<div class="row g-2 mb-3 align-items-end">
  <div class="col-lg-4 col-md-6">
    <label class="form-label small fw-semibold mb-1">Filter Sesi</label>
    <select class="form-select" id="filterSesi">
      <option value="">Semua Sesi</option>
    </select>
  </div>
  <div class="col-lg-3 col-md-6">
    <label class="form-label small fw-semibold mb-1">Filter Tanggal</label>
    <input type="date" class="form-control" id="filterTanggal">
  </div>
  <div class="col-lg-5 col-md-12">
    <div class="d-flex gap-2 flex-wrap align-items-center">
      <button class="btn btn-primary" id="applyFilterBtn"><i class="bi bi-funnel"></i> Terapkan</button>
      <button class="btn btn-outline-secondary" id="resetFilterBtn"><i class="bi bi-x-circle"></i> Reset</button>
      <button class="btn btn-outline-success" id="exportDataBtn"><i class="bi bi-download"></i> Ekspor CSV</button>
      <button class="btn btn-outline-secondary" id="refreshDataBtn"><i class="bi bi-arrow-clockwise"></i> Segarkan</button>
      <span id="cacheStatus" class="cache-status">Memuat…</span>
    </div>
  </div>
</div>

<!-- SEARCH -->
<div class="row mb-3">
  <div class="col-md-6">
    <div class="input-group">
      <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
      <input type="text" class="form-control border-start-0" id="searchInput"
             placeholder="Cari nama peserta atau sesi…" autocomplete="off">
    </div>
  </div>
</div>

<!-- STATISTIK -->
<div class="row g-2 mb-4" id="statsRow">
  <div class="col-6 col-md-3"><div class="stat-mini" style="background:#fff;border-radius:16px;padding:1rem;text-align:center;border:1px solid #e2e8f0;">
    <div class="num" id="statTotal" style="font-size:1.8rem;font-weight:700;color:#2563eb;">-</div>
    <div class="lbl" style="font-size:0.72rem;color:#64748b;text-transform:uppercase;">Total Kehadiran</div>
  </div></div>
  <div class="col-6 col-md-3"><div class="stat-mini" style="background:#fff;border-radius:16px;padding:1rem;text-align:center;border:1px solid #e2e8f0;">
    <div class="num" id="statPeserta" style="font-size:1.8rem;font-weight:700;color:#16a34a;">-</div>
    <div class="lbl" style="font-size:0.72rem;color:#64748b;text-transform:uppercase;">Peserta Unik</div>
  </div></div>
  <div class="col-6 col-md-3"><div class="stat-mini" style="background:#fff;border-radius:16px;padding:1rem;text-align:center;border:1px solid #e2e8f0;">
    <div class="num" id="statSesi" style="font-size:1.8rem;font-weight:700;color:#f59e0b;">-</div>
    <div class="lbl" style="font-size:0.72rem;color:#64748b;text-transform:uppercase;">Sesi Terpakai</div>
  </div></div>
  <div class="col-6 col-md-3"><div class="stat-mini" style="background:#fff;border-radius:16px;padding:1rem;text-align:center;border:1px solid #e2e8f0;">
    <div class="num" id="statHariIni" style="font-size:1.8rem;font-weight:700;color:#8b5cf6;">-</div>
    <div class="lbl" style="font-size:0.72rem;color:#64748b;text-transform:uppercase;">Absen Hari Ini</div>
  </div></div>
</div>

<!-- TABLE -->
<div id="absensiTableContainer" class="table-container">
  <div class="text-center py-5">
    <div class="spinner-border text-primary"></div>
    <p class="mt-2 text-muted">Memuat data absensi…</p>
  </div>
</div>


<!-- ==================== MODAL DETAIL ==================== -->
<div class="modal fade" id="detailAbsensiModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-info text-white border-0 rounded-top-4">
        <h5 class="modal-title"><i class="bi bi-eye me-2"></i>Detail Absensi</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div id="detailAbsensiContent"></div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>


<!-- ==================== MODAL HAPUS ==================== -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-danger text-white border-0 rounded-top-4">
        <h5 class="modal-title"><i class="bi bi-trash me-2"></i>Konfirmasi Hapus</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4 text-center">
        <i class="bi bi-exclamation-triangle fs-1 text-warning mb-3 d-block"></i>
        <p>Apakah Anda yakin ingin menghapus data absensi ini?</p>
        <p class="text-muted small mb-0">Data akan dihapus permanen dari Google Sheet.</p>
        <input type="hidden" id="deleteAbsensiId">
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-danger rounded-pill px-4" id="confirmDeleteBtn">Hapus</button>
      </div>
    </div>
  </div>
</div>
