     views/admin/data-absensi.html — v28.2.0 FINAL EDITION

<h2 class="section-title">
  <i class="bi bi-table me-2" aria-hidden="true"></i>Manajemen Data Absensi
</h2>

<!-- ========================================================== -->
<!-- TOOLBAR — ROW 1: FILTER                                    -->
<!-- ========================================================== -->
<div class="row g-2 mb-3 align-items-end">
  <div class="col-lg-4 col-md-6">
    <label class="form-label small fw-semibold mb-1" for="filterSesi">Filter Sesi</label>
    <select class="form-select" id="filterSesi" aria-label="Filter sesi absen">
      <option value="">Semua Sesi</option>
    </select>
  </div>
  <div class="col-lg-3 col-md-6">
    <label class="form-label small fw-semibold mb-1" for="filterTanggal">Filter Tanggal</label>
    <input type="date" class="form-control" id="filterTanggal" aria-label="Filter tanggal absen">
  </div>
  <div class="col-lg-5 col-md-12">
    <label class="form-label small fw-semibold mb-1 d-none d-lg-block">&nbsp;</label>
    <div class="d-flex gap-2 flex-wrap align-items-center">
      <button type="button" class="btn btn-primary" id="applyFilterBtn" aria-label="Terapkan filter">
        <i class="bi bi-funnel" aria-hidden="true"></i> Terapkan
      </button>
      <button type="button" class="btn btn-outline-secondary" id="resetFilterBtn" aria-label="Reset filter">
        <i class="bi bi-x-circle" aria-hidden="true"></i> Reset
      </button>
    </div>
  </div>
</div>

<!-- ========================================================== -->
<!-- TOOLBAR — ROW 2: ACTIONS (Realtime, Refresh, Suara, Export) -->
<!-- ========================================================== -->
<div class="row g-2 mb-3">
  <div class="col-12">
    <div class="d-flex gap-2 flex-wrap align-items-center">

      <!-- Export CSV -->
      <button type="button" class="btn btn-outline-success" id="exportDataBtn" aria-label="Ekspor CSV">
        <i class="bi bi-download" aria-hidden="true"></i> Ekspor CSV
      </button>

      <!-- ⭐ REALTIME toggle -->
      <button type="button" class="btn btn-outline-info" id="toggleRealtimeBtn"
              title="Mode realtime — auto refresh tiap 10 detik"
              aria-label="Toggle realtime mode"
              aria-pressed="false">
        <i class="bi bi-broadcast" id="toggleRealtimeIcon" aria-hidden="true"></i>
        <span id="toggleRealtimeLabel" class="ms-1">Realtime OFF</span>
      </button>

      <!-- Refresh Manual -->
      <button type="button" class="btn btn-outline-secondary" id="refreshDataBtn"
              title="Segarkan data sekali"
              aria-label="Refresh data manual">
        <i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Refresh
      </button>

      <!-- ⭐ SUARA ON/OFF -->
      <button type="button" class="btn btn-success" id="toggleVoiceBtn"
              title="Notifikasi suara saat peserta absen"
              aria-label="Toggle notifikasi suara"
              aria-pressed="true">
        <i class="bi bi-volume-up-fill" id="toggleVoiceIcon" aria-hidden="true"></i>
        <span id="toggleVoiceLabel" class="ms-1">Suara ON</span>
      </button>

      <!-- Cache Status -->
      <span id="cacheStatus" class="cache-status ms-auto" aria-live="polite">Memuat…</span>
    </div>
  </div>
</div>

<!-- ========================================================== -->
<!-- SEARCH BAR                                                 -->
<!-- ========================================================== -->
<div class="row mb-3">
  <div class="col-md-6">
    <div class="input-group">
      <span class="input-group-text bg-white border-end-0">
        <i class="bi bi-search text-muted" aria-hidden="true"></i>
      </span>
      <input type="text" class="form-control border-start-0" id="searchInput"
             placeholder="Cari nama peserta atau sesi…" autocomplete="off"
             aria-label="Cari data absensi">
    </div>
  </div>
</div>

<!-- ========================================================== -->
<!-- STATISTIK ROW                                              -->
<!-- ========================================================== -->
<div class="row g-2 mb-4" id="statsRow" aria-live="polite">
  <div class="col-6 col-md-3">
    <div class="stat-mini" style="background:#fff;border-radius:16px;padding:1rem;text-align:center;border:1px solid #e2e8f0;">
      <div class="num" id="statTotal" style="font-size:1.8rem;font-weight:700;color:#2563eb;">-</div>
      <div class="lbl" style="font-size:0.72rem;color:#64748b;text-transform:uppercase;">Total Kehadiran</div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="stat-mini" style="background:#fff;border-radius:16px;padding:1rem;text-align:center;border:1px solid #e2e8f0;">
      <div class="num" id="statPeserta" style="font-size:1.8rem;font-weight:700;color:#16a34a;">-</div>
      <div class="lbl" style="font-size:0.72rem;color:#64748b;text-transform:uppercase;">Peserta Unik</div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="stat-mini" style="background:#fff;border-radius:16px;padding:1rem;text-align:center;border:1px solid #e2e8f0;">
      <div class="num" id="statSesi" style="font-size:1.8rem;font-weight:700;color:#f59e0b;">-</div>
      <div class="lbl" style="font-size:0.72rem;color:#64748b;text-transform:uppercase;">Sesi Terpakai</div>
    </div>
  </div>
  <div class="col-6 col-md-3">
    <div class="stat-mini" style="background:#fff;border-radius:16px;padding:1rem;text-align:center;border:1px solid #e2e8f0;">
      <div class="num" id="statHariIni" style="font-size:1.8rem;font-weight:700;color:#8b5cf6;">-</div>
      <div class="lbl" style="font-size:0.72rem;color:#64748b;text-transform:uppercase;">Absen Hari Ini</div>
    </div>
  </div>
</div>

<!-- ========================================================== -->
<!-- TABLE CONTAINER                                            -->
<!-- ========================================================== -->
<div id="absensiTableContainer" class="table-container" aria-live="polite">
  <!-- Skeleton initial -->
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th style="width:50px;">
            <div class="skeleton-box" style="height:20px;width:20px;"></div>
          </th>
          <th><div class="skeleton-box" style="height:20px;width:100px;"></div></th>
          <th><div class="skeleton-box" style="height:20px;width:100px;"></div></th>
          <th><div class="skeleton-box" style="height:20px;width:100px;"></div></th>
          <th><div class="skeleton-box" style="height:20px;width:100px;"></div></th>
          <th style="width:110px;">
            <div class="skeleton-box" style="height:20px;width:80px;"></div>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="6" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Memuat data absensi…</span>
            </div>
            <p class="mt-2 text-muted small mb-0">Memuat data absensi…</p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>


<!-- ========================================================== -->
<!-- MODAL: DETAIL ABSENSI                                      -->
<!-- ========================================================== -->
<div class="modal fade" id="detailAbsensiModal" tabindex="-1"
     aria-labelledby="detailAbsensiModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-info text-white border-0 rounded-top-4">
        <h5 class="modal-title" id="detailAbsensiModalLabel">
          <i class="bi bi-eye me-2" aria-hidden="true"></i>Detail Absensi
        </h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <div class="modal-body p-4" style="max-height:70vh;overflow-y:auto;">
        <div id="detailAbsensiContent"></div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary rounded-pill px-4"
                data-bs-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>


<!-- ========================================================== -->
<!-- MODAL: KONFIRMASI HAPUS                                    -->
<!-- ========================================================== -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1"
     data-bs-backdrop="static" aria-labelledby="deleteConfirmModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-danger text-white border-0 rounded-top-4">
        <h5 class="modal-title" id="deleteConfirmModalLabel">
          <i class="bi bi-trash me-2" aria-hidden="true"></i>Konfirmasi Hapus
        </h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <div class="modal-body p-4 text-center">
        <i class="bi bi-exclamation-triangle fs-1 text-warning mb-3 d-block" aria-hidden="true"></i>
        <p class="mb-2">Apakah Anda yakin ingin menghapus data absensi ini?</p>
        <p class="text-muted small mb-0">Data akan dihapus permanen dari Google Sheet.</p>
        <input type="hidden" id="deleteAbsensiId">
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button type="button" class="btn btn-secondary rounded-pill px-4"
                data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-danger rounded-pill px-4" id="confirmDeleteBtn">
          <i class="bi bi-trash me-1" aria-hidden="true"></i>Hapus
        </button>
      </div>
    </div>
  </div>
</div>
