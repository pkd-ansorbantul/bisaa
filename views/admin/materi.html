<!-- views/admin/materi.html — konten saja -->

<h2 class="section-title"><i class="bi bi-file-earmark-pdf me-2"></i>Manajemen Materi</h2>

<!-- ========================================================== -->
<!-- TOOLBAR                                                     -->
<!-- ========================================================== -->
<div class="row mb-3 g-2">
  <div class="col-md-6">
    <button class="btn btn-primary rounded-pill" id="addMateriBtn">
      <i class="bi bi-plus-circle me-1"></i> Tambah Materi
    </button>
    <button class="btn btn-outline-success rounded-pill ms-2" id="exportDataBtn">
      <i class="bi bi-download me-1"></i> Ekspor
    </button>
    <button class="btn btn-outline-secondary rounded-pill ms-2" id="refreshDataBtn">
      <i class="bi bi-arrow-clockwise me-1"></i> Segarkan
    </button>
    <span id="cacheStatus" class="cache-status ms-2">Memuat…</span>
  </div>
  <div class="col-md-6 text-md-end">
    <div class="input-group" style="max-width:280px;display:inline-flex;">
      <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
      <input type="text" class="form-control border-start-0" id="searchInput"
             placeholder="Cari judul materi…" autocomplete="off">
    </div>
    <select class="form-select d-inline-block ms-2" style="width:auto;display:inline-block !important;" id="filterKategori">
      <option value="">Semua Kategori</option>
      <option value="Umum">Umum</option>
      <option value="Kaderisasi">Kaderisasi</option>
      <option value="Keagamaan">Keagamaan</option>
      <option value="Kepemimpinan">Kepemimpinan</option>
      <option value="Lainnya">Lainnya</option>
    </select>
  </div>
</div>

<!-- ========================================================== -->
<!-- TABLE                                                       -->
<!-- ========================================================== -->
<div id="materiTableContainer" class="table-container">
  <div class="text-center py-5">
    <div class="spinner-border text-primary"></div>
    <p class="mt-2 text-muted">Memuat data materi…</p>
  </div>
</div>


<!-- ==================== MODAL FORM (TAMBAH/EDIT) ==================== -->
<div class="modal fade" id="materiFormModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-primary text-white border-0 rounded-top-4">
        <h5 class="modal-title">
          <i class="bi bi-file-earmark-pdf me-2"></i>
          <span id="formModalTitle">Tambah Materi</span>
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <input type="hidden" id="editMateriId">

        <div class="mb-3">
          <label class="form-label fw-semibold">Judul Materi <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="materiJudul"
                 placeholder="Contoh: Materi Kepemimpinan Dasar" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Deskripsi</label>
          <textarea class="form-control" id="materiDeskripsi" rows="3"
                    placeholder="Deskripsi materi (opsional)"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Kategori</label>
          <select class="form-select" id="materiKategori">
            <option value="Umum">Umum</option>
            <option value="Kaderisasi">Kaderisasi</option>
            <option value="Keagamaan">Keagamaan</option>
            <option value="Kepemimpinan">Kepemimpinan</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Upload File <span class="text-danger">*</span></label>
          <div class="input-group">
            <input type="file" class="form-control" id="materiFile"
                   accept=".pdf,.ppt,.pptx,.doc,.docx,.jpg,.jpeg,.png,.webp">
            <button class="btn btn-outline-secondary" type="button" id="clearFileBtn" title="Reset file">
              <i class="bi bi-x-circle"></i>
            </button>
          </div>
          <div class="form-text text-muted">
            Format: PDF, PPT, DOC, JPG, PNG, WEBP (Maks 10MB)
          </div>
        </div>

        <div id="filePreviewContainer" class="mt-2 text-center" style="display:none;">
          <img id="filePreviewImage" src="#" alt="Preview"
               class="img-thumbnail" style="max-height:100px;">
          <p id="filePreviewName" class="small text-muted mt-1 mb-0"></p>
        </div>

        <div id="uploadProgressContainer" style="display:none;" class="mt-3">
          <div class="progress" style="height:8px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
                 id="uploadProgressBar" style="width:0%"></div>
          </div>
          <div class="small text-muted mt-1 text-center" id="uploadProgressText">0%</div>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary rounded-pill px-4" id="saveMateriBtn">
          <i class="bi bi-save me-1"></i> Simpan
        </button>
      </div>
    </div>
  </div>
</div>


<!-- ==================== MODAL DETAIL ==================== -->
<div class="modal fade" id="detailMateriModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-info text-white border-0 rounded-top-4">
        <h5 class="modal-title"><i class="bi bi-eye me-2"></i>Detail Materi</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <div id="detailContent">
          <div class="text-center"><div class="spinner-border text-primary"></div></div>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Tutup</button>
      </div>
    </div>
  </div>
</div>


<!-- ==================== MODAL HAPUS ==================== -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-danger text-white border-0 rounded-top-4">
        <h5 class="modal-title"><i class="bi bi-trash me-2"></i>Konfirmasi Hapus</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4 text-center">
        <i class="bi bi-exclamation-triangle fs-1 text-warning mb-3 d-block"></i>
        <p>Apakah Anda yakin ingin menghapus materi ini?</p>
        <p class="fw-bold" id="deleteTargetName">—</p>
        <p class="text-muted small mb-0">Tindakan ini tidak dapat dibatalkan.</p>
        <input type="hidden" id="deleteMateriId">
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-danger rounded-pill px-4" id="confirmDeleteBtn">
          <i class="bi bi-trash me-1"></i> Hapus
        </button>
      </div>
    </div>
  </div>
</div>
