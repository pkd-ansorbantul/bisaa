<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Verifikasi Tanda Tangan Digital · PKD GP Ansor Bantul</title>

  <!-- Favicon & Font -->
  <link rel="icon" type="image/png" href="/bisaa/LOGO%20ANSOR.webp">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- JsBarcode untuk generate barcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <style>
    /* ===== UNIVERSAL PREMIUM (GLASSMORPHISM) ===== */
    * { font-family: 'Inter', system-ui, sans-serif; box-sizing: border-box; }
    body {
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- HEADER MINIMALIS ELEGAN --- */
    .header-minimal {
      background: rgba(255, 255, 255, 0.72) !important;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 1030;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.04);
      padding-top: 0 !important;
      padding-bottom: 0 !important;
    }
    .header-minimal .container {
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
    }
    .btn-back {
      background: rgba(37, 99, 235, 0.08);
      color: #2563eb;
      border: 1px solid rgba(37, 99, 235, 0.2);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-back:hover {
      background: #2563eb;
      color: white;
      transform: translateX(-3px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .brand-logo-mini { height: 40px; width: auto; margin-right: 14px; transition: transform 0.2s; }
    .brand-logo-mini:hover { transform: scale(1.05); }
    .brand-title-mini { font-weight: 700; color: #0a3d62; font-size: 1.3rem; line-height: 1.2; letter-spacing: -0.02em; }
    .brand-sub-mini { font-size: 0.8rem; color: #64748b; display: block; margin-top: 0px; letter-spacing: 0.02em; }

    #navbarUserMenu { display: flex; align-items: center; gap: 8px; }
    .user-menu-area .dropdown-toggle { border-radius: 50px; padding: 0.3rem 1rem; font-size: 0.9rem; }
    .user-menu-area .btn-outline-primary { border-radius: 50px; padding: 0.3rem 1.2rem; font-size: 0.9rem; }

    /* --- GLASS CARD --- */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      padding: 2rem;
      max-width: 800px;
      margin: 2rem auto;
    }
    .glass-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 50px rgba(37, 99, 235, 0.08);
      border-color: rgba(37, 99, 235, 0.2);
    }

    /* --- SECTION TITLE --- */
    .section-title {
      font-weight: 650;
      font-size: 1.75rem;
      color: #0f172a;
      border-left: 6px solid #2563eb;
      padding-left: 1.2rem;
      margin-bottom: 1.5rem;
    }

    /* --- RESULT CARD --- */
    .result-card {
      background: #f0fdf4;
      border-left: 6px solid #22c55e;
      border-radius: 20px;
      padding: 1.5rem;
      display: none;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .result-card.danger {
      background: #fef2f2;
      border-left-color: #ef4444;
    }
    .result-card .badge-valid { background: #22c55e; color: white; padding: 6px 20px; border-radius: 50px; font-size: 0.9rem; display: inline-block; margin-bottom: 1rem; }
    .result-row { display: flex; flex-wrap: wrap; gap: 1.5rem; }
    .result-item { flex: 1; min-width: 200px; }
    .result-item strong { display: block; font-size: 0.85rem; color: #475569; margin-bottom: 4px; }
    .result-item span { font-weight: 600; font-size: 1rem; color: #0f172a; }

    /* --- SIGNATURE IMAGE --- */
    .signature-img {
      max-width: 250px;
      max-height: 150px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      padding: 8px;
      background: white;
      object-fit: contain;
    }

    /* --- BARCODE --- */
    .barcode-container {
      display: inline-block;
      background: white;
      padding: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    /* --- SKELETON LOADING --- */
    .skeleton-box {
      background: #e2e8f0;
      border-radius: 8px;
      animation: pulse 1.5s infinite ease-in-out;
      display: inline-block;
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    .loading-state {
      text-align: center;
      padding: 2rem 1rem;
    }
    .loading-state .spinner-border { width: 3rem; height: 3rem; color: #2563eb; }

    /* --- ANIMASI --- */
    .fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .delay-1 { animation-delay: 0.05s; }

    /* --- FOOTER --- */
    .footer-modern {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: auto;
      text-align: center;
      padding: 1.5rem 0;
      border-top: 1px solid #e2e8f0;
      background: white;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 576px) {
      .glass-card { border-radius: 16px; padding: 1.5rem !important; }
      .header-minimal .container { padding: 0 0.5rem; }
      .btn-back { font-size: 0.8rem; padding: 0.2rem 0.8rem; }
      .brand-title-mini { display: none; }
      .brand-sub-mini { display: none; }
      .section-title { font-size: 1.3rem; }
      .result-row { flex-direction: column; gap: 0.5rem; }
      .signature-img { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- ================= HEADER ELEGAN ================= -->
  <header class="header-minimal sticky-top shadow-sm">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <div class="d-flex align-items-center gap-2">
        <a href="/bisaa/index.html" class="btn btn-back rounded-pill">
          <i class="bi bi-arrow-left me-1"></i> Kembali
        </a>
        <a href="/bisaa/index.html" class="brand-minimal text-decoration-none d-flex align-items-center ms-1">
          <img src="/bisaa/LOGO%20ANSOR.webp" alt="GP Ansor" class="brand-logo-mini">
          <div>
            <div class="brand-title-mini">PKD GP Ansor</div>
            <span class="brand-sub-mini">Kabupaten Bantul</span>
          </div>
        </a>
      </div>
      <!-- Area User Role (diisi oleh api.js) -->
      <div id="navbarUserMenu" class="user-menu-area"></div>
    </div>
  </header>

  <!-- ================= KONTEN UTAMA ================= -->
  <div class="container">
    <div class="glass-card fade-up">
      <div class="d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-shield-check-fill text-success fs-4"></i>
        <h2 class="section-title mb-0">Verifikasi Tanda Tangan Digital</h2>
      </div>
      <p class="text-muted small mb-3">Memverifikasi keaslian tanda tangan digital Ketua PC / Sekretaris / Instruktur PKD.</p>

      <!-- Loading State -->
      <div id="loadingIndicator" class="loading-state" style="display:block;">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Memverifikasi...</span>
        </div>
        <p class="mt-2 text-muted">Memverifikasi tanda tangan digital...</p>
      </div>

      <!-- Result Content -->
      <div id="resultContainer" class="result-card" style="display:none;">
        <!-- Akan diisi oleh JS -->
      </div>

      <div class="text-center mt-3">
        <a href="/bisaa/index.html" class="btn btn-outline-secondary rounded-pill px-4">
          <i class="bi bi-arrow-left me-1"></i> Kembali
        </a>
      </div>
    </div>
  </div>

  <!-- ================= FOOTER ================= -->
  <footer class="footer-modern container">
    <i class="bi bi-c-circle"></i> 2026 · Tim Instruktur GP Ansor Kabupaten Bantul
  </footer>

  <!-- ================= SCRIPTS ================= -->
  <!-- Library Eksternal (tetap sebagai script biasa) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Modul ES Khusus Halaman Ini -->
  <script type="module">
    // ==========================================================
    //   IMPOR DARI CORE API (ES Modules)
    // ==========================================================
    import {
      callApi,
      escapeHtml,
      updateNavbarMenu
    } from './js/core/api.js';

    // ==========================================================
    //   AMBIL PARAMETER DARI URL
    // ==========================================================
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // ==========================================================
    //   VERIFIKASI UTAMA
    // ==========================================================
    async function verifySignature() {
      const role = getQueryParam('role');
      const driveId = getQueryParam('driveId');

      const loading = document.getElementById('loadingIndicator');
      const resultContainer = document.getElementById('resultContainer');

      if (!role) {
        // Role tidak ada
        loading.style.display = 'none';
        resultContainer.style.display = 'block';
        resultContainer.className = 'result-card danger';
        resultContainer.innerHTML = `
          <div class="text-danger text-center w-100">
            <i class="bi bi-exclamation-circle-fill fs-2"></i>
            <h5 class="mt-2">Parameter tidak valid</h5>
            <p class="small">Parameter "role" tidak ditemukan. Silakan gunakan link verifikasi yang benar.</p>
          </div>
        `;
        return;
      }

      // Jika driveId tidak ada, coba ambil dari server
      if (!driveId) {
        try {
          const res = await callApi('getDigitalApproval', { role }, 'GET');
          if (res.success && res.data && res.data.driveId) {
            // Redirect ke halaman yang sama dengan driveId
            window.location.href = `verify_signature.html?role=${role}&driveId=${res.data.driveId}`;
            return;
          } else {
            loading.style.display = 'none';
            resultContainer.style.display = 'block';
            resultContainer.className = 'result-card danger';
            const roleLabels = { 'ketua_pc': 'Ketua PC', 'sekretaris': 'Sekretaris', 'instruktur': 'Instruktur' };
            resultContainer.innerHTML = `
              <div class="text-danger text-center w-100">
                <i class="bi bi-exclamation-circle-fill fs-2"></i>
                <h5 class="mt-2">Tanda tangan tidak ditemukan</h5>
                <p class="small">Tanda tangan untuk <strong>${roleLabels[role] || role}</strong> belum tersedia.</p>
              </div>
            `;
            return;
          }
        } catch (err) {
          loading.style.display = 'none';
          resultContainer.style.display = 'block';
          resultContainer.className = 'result-card danger';
          resultContainer.innerHTML = `
            <div class="text-danger text-center w-100">
              <i class="bi bi-exclamation-circle-fill fs-2"></i>
              <h5 class="mt-2">Terjadi kesalahan</h5>
              <p class="small">${escapeHtml(err.message)}</p>
            </div>
          `;
          return;
        }
      }

      // Verifikasi dengan driveId yang diberikan
      try {
        const res = await callApi('getDigitalApproval', { role }, 'GET');
        if (res.success && res.data && res.data.driveId === driveId) {
          renderVerificationResult(res.data, role, driveId);
        } else {
          loading.style.display = 'none';
          resultContainer.style.display = 'block';
          resultContainer.className = 'result-card danger';
          resultContainer.innerHTML = `
            <div class="text-danger text-center w-100">
              <i class="bi bi-exclamation-circle-fill fs-2"></i>
              <h5 class="mt-2">Tanda tangan tidak valid</h5>
              <p class="small">Tanda tangan tidak valid atau telah diubah.</p>
            </div>
          `;
        }
      } catch (err) {
        loading.style.display = 'none';
        resultContainer.style.display = 'block';
        resultContainer.className = 'result-card danger';
        resultContainer.innerHTML = `
          <div class="text-danger text-center w-100">
            <i class="bi bi-exclamation-circle-fill fs-2"></i>
            <h5 class="mt-2">Terjadi kesalahan</h5>
            <p class="small">${escapeHtml(err.message)}</p>
          </div>
        `;
      }
    }

    // ==========================================================
    //   RENDER HASIL VERIFIKASI
    // ==========================================================
    function renderVerificationResult(data, role, driveId) {
      const loading = document.getElementById('loadingIndicator');
      const resultContainer = document.getElementById('resultContainer');

      const roleLabels = {
        'ketua_pc': 'Ketua PC GP Ansor Kabupaten Bantul',
        'sekretaris': 'Sekretaris PC GP Ansor Kabupaten Bantul',
        'instruktur': 'Instruktur PKD GP Ansor Kabupaten Bantul'
      };
      const roleLabel = roleLabels[role] || role;

      // Format timestamp
      let timestampDisplay = 'Tidak tersedia';
      if (data.timestamp) {
        try {
          const date = new Date(data.timestamp);
          timestampDisplay = date.toLocaleString('id-ID', {
            day: 'numeric', month: 'long', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          });
        } catch (e) {
          timestampDisplay = data.timestamp;
        }
      }

      const kegunaan = data.kegunaan || 'Tidak ada keterangan';
      const pesertaNama = data.peserta_nama || '-';
      const imgUrl = driveId ? `https://drive.google.com/thumbnail?id=${driveId}&sz=w400` : '';

      // Data untuk barcode
      const barcodeData = JSON.stringify({
        role: role,
        nama: data.nama,
        driveId: driveId,
        timestamp: data.timestamp,
        kegunaan: kegunaan
      });
      const barcodeId = 'barcode-' + Date.now();

      let html = `
        <div class="badge-valid"><i class="bi bi-check-circle-fill me-1"></i> Tanda tangan digital VALID</div>
        <hr class="my-3">
        <div class="result-row">
          <div class="result-item">
            <strong>Role</strong>
            <span>${roleLabel}</span>
          </div>
          <div class="result-item">
            <strong>Nama Penanda Tangan</strong>
            <span class="fw-bold">${escapeHtml(data.nama || 'Tidak diketahui')}</span>
          </div>
          <div class="result-item">
            <strong>Kegunaan</strong>
            <span>${escapeHtml(kegunaan)}</span>
          </div>
          <div class="result-item">
            <strong>Untuk Peserta</strong>
            <span>${escapeHtml(pesertaNama)}</span>
          </div>
          <div class="result-item">
            <strong>Waktu Persetujuan</strong>
            <span class="text-muted">${escapeHtml(timestampDisplay)}</span>
          </div>
          <div class="result-item">
            <strong>Drive ID</strong>
            <code style="font-size:0.75rem; word-break:break-all;">${escapeHtml(driveId || '-')}</code>
          </div>
        </div>

        <hr class="my-3">

        <div class="row align-items-center">
          <div class="col-md-5 text-center mb-3 mb-md-0">
            ${imgUrl ? `<img src="${imgUrl}" class="signature-img" alt="Tanda Tangan">` : '<div class="text-muted"><i class="bi bi-image fs-1"></i><br>Gambar tidak tersedia</div>'}
          </div>
          <div class="col-md-7 text-center">
            <h6 class="fw-bold">Barcode Verifikasi</h6>
            <div class="barcode-container" id="${barcodeId}"></div>
            <p class="small text-muted mt-2">Scan barcode ini untuk memverifikasi keaslian tanda tangan digital.</p>
          </div>
        </div>
      `;

      loading.style.display = 'none';
      resultContainer.style.display = 'block';
      resultContainer.className = 'result-card';
      resultContainer.innerHTML = html;

      // Generate barcode menggunakan JsBarcode (global)
      setTimeout(() => {
        try {
          if (typeof JsBarcode !== 'undefined') {
            JsBarcode(`#${barcodeId}`, barcodeData, {
              format: "CODE128",
              width: 2,
              height: 60,
              displayValue: true,
              fontSize: 10,
              margin: 10
            });
          } else {
            console.warn('JsBarcode tidak tersedia, fallback ke teks');
            const barcodeEl = document.getElementById(barcodeId);
            if (barcodeEl) {
              barcodeEl.innerHTML = `<div style="font-size:0.5rem; word-break:break-all;">${barcodeData}</div>`;
            }
          }
        } catch (e) {
          console.warn('Barcode gagal digenerate, fallback ke teks:', e);
          const barcodeEl = document.getElementById(barcodeId);
          if (barcodeEl) {
            barcodeEl.innerHTML = `<div style="font-size:0.5rem; word-break:break-all;">${barcodeData}</div>`;
          }
        }
      }, 100);
    }

    // ==========================================================
    //   BOOT
    // ==========================================================
    (function boot() {
      // Update navbar user
      updateNavbarMenu();

      // Jalankan verifikasi
      verifySignature();
    })();
  </script>
</body>
</html>
