  <script type="module">
    // ==========================================================
    //   IMPORTS (v26.1.8 GITHUB PAGES: /bisaa/js/core/api.js)
    // ==========================================================
    import {
      guardPublicAccess,
      getSkriningQuestions,
      submitSkrining,
      showToast,
      updateNavbarMenu,
      escapeHtml,
    } from '/bisaa/js/core/api.js';

    const STATE = {
      questions: [],
      sigPad: null,
      isSubmitting: false,
      currentStep: 0,
      currentMode: 'wizard',
      previewParams: null,
    };
    const FORM_STATE_KEY = 'pkd_skrining_draft_v2';
    const CACHE_KEY = 'pkd_cache_skrining_qs_v2';
    const CACHE_AGE = 30; // menit

    const listeners = [];

    function on(el, ev, handler) {
      if (!el) return;
      el.addEventListener(ev, handler);
      listeners.push({ el, ev, handler });
    }

    function generateFieldName(teks) {
      return String(teks || '').toLowerCase()
        .replace(/[^a-z0-9\s]/g, '')
        .replace(/\s+/g, '_')
        .substring(0, 50);
    }

    function isLongText(teks) {
      const keywords = ['alamat', 'pengetahuan', 'alasan', 'catatan', 'deskripsi', 'riwayat'];
      return keywords.some(k => String(teks || '').toLowerCase().includes(k));
    }

    function getPlaceholder(teks) {
      const lower = String(teks || '').toLowerCase();
      if (lower.includes('nama lengkap')) return 'Contoh: Ulinnuha atau Ahmad Fauzi';
      if (lower.includes('alamat')) return 'Contoh: Jl. Imogiri Timur KM 10, Bantul, D.I.Yogyakarta';
      if (lower.includes('info')) return 'Contoh: Instagram / WhatsApp / Teman / Website resmi';
      if (lower.includes('pengetahuan tentang ansor')) return 'Contoh: Sudah cukup paham / Baru tahu dari teman';
      if (lower.includes('riwayat penyakit')) return 'Contoh: Tidak ada / Asma ringan / Hipertensi';
      if (lower.includes('alasan')) return 'Contoh: Ingin menjadi kader yang bermanfaat bagi masyarakat & NU';
      if (lower.includes('catatan')) return 'Contoh: Saya siap mengikuti seluruh rangkaian acara PKD.';
      return isLongText(teks) ? 'Tuliskan jawaban Anda secara lengkap…' : 'Masukkan jawaban Anda…';
    }

    function safeLocalStorage(fn) {
      try { return fn(); } catch (e) { return null; }
    }

    function saveFormState() {
      const form = document.getElementById('formSkriningDinamis');
      if (!form) return;
      const formData = new FormData(form);
      const data = {};
      formData.forEach((v, k) => data[k] = v);
      data.currentMode = STATE.currentMode;
      data.currentStep = STATE.currentStep;
      if (STATE.sigPad && !STATE.sigPad.isEmpty()) {
        try { data.signatureData = STATE.sigPad.toData(); } catch (e) {}
      }
      safeLocalStorage(() => localStorage.setItem(FORM_STATE_KEY, JSON.stringify(data)));
    }

    function restoreFormState() {
      const saved = safeLocalStorage(() => localStorage.getItem(FORM_STATE_KEY));
      if (!saved) return;
      try {
        const data = JSON.parse(saved);
        const form = document.getElementById('formSkriningDinamis');
        if (!form) return;

        if (data.currentMode) STATE.currentMode = data.currentMode;
        if (typeof data.currentStep === 'number') STATE.currentStep = data.currentStep;

        document.getElementById('modeWizardBtn')?.classList.toggle('active', STATE.currentMode === 'wizard');
        document.getElementById('modeAllBtn')?.classList.toggle('active', STATE.currentMode === 'all');

        Object.keys(data).forEach(key => {
          if (['signatureData', 'currentMode', 'currentStep'].includes(key)) return;
          const field = form.querySelector(`[name="${key}"]`);
          if (!field) return;
          if (field.type === 'radio') {
            const target = form.querySelector(`[name="${key}"][value="${CSS.escape(data[key])}"]`);
            if (target) target.checked = true;
          } else if (field.type === 'checkbox') {
            field.checked = !!data[key];
          } else {
            field.value = data[key];
          }
        });

        if (data.signatureData && STATE.sigPad && Array.isArray(data.signatureData)) {
          try { STATE.sigPad.fromData(data.signatureData); } catch (e) {}
        }
      } catch (e) { /* ignore */ }
    }

    function clearFormState() {
      safeLocalStorage(() => localStorage.removeItem(FORM_STATE_KEY));
    }

    function renderSkeletonForm() {
      const container = document.getElementById('skriningFormContainer');
      if (!container) return;
      container.innerHTML = `
        <h4 class="mb-4">📝 Memuat data skrining…</h4>
        <div class="glass-card" style="background:#f8fafc;padding:1.5rem;">
          ${Array(3).fill(0).map(() => `
            <div class="mb-3">
              <div class="skeleton-box" style="height:16px;width:140px;margin-bottom:6px;"></div>
              <div class="skeleton-box" style="height:40px;width:100%;border-radius:8px;"></div>
            </div>`).join('')}
          <div class="text-center mt-4">
            <div class="skeleton-box" style="height:48px;width:200px;border-radius:50px;"></div>
          </div>
        </div>`;
    }

    function renderFormWizard(sorted) {
      const container = document.getElementById('skriningFormContainer');

      const totalSteps = sorted.length + 1;

      let indicatorHtml = `<div class="wizard-indicator" id="wizardIndicatorContainer">`;
      for (let i = 0; i < totalSteps; i++) {
        const cls = i === STATE.currentStep ? 'active' : (i < STATE.currentStep ? 'completed' : '');
        indicatorHtml += `<button type="button" class="dot ${cls}" data-step-index="${i}"></button>`;
      }
      indicatorHtml += `</div>`;

      const stepsArray = [];
      let idx = 0;
      sorted.forEach(q => {
        const fieldName = generateFieldName(q.teks);
        const displayStyle = idx === STATE.currentStep ? 'block' : 'none';
        let stepHtml = `<div id="step-${idx}" class="skrining-step" style="display:${displayStyle};width:100%;position:relative;min-height:150px;margin-top:15px;">`;
        stepHtml += `<div class="form-section">`;
        stepHtml += `<label class="form-label"><span class="question-number">${idx + 1}</span>${escapeHtml(q.teks)}${q.jenis !== 'radio' ? ' <span class="text-danger">*</span>' : ''}</label>`;

        if (q.jenis === 'radio') {
          const options = (q.opsi || '').split(',').filter(s => s.trim() !== '');
          stepHtml += `<div class="radio-group">`;
          options.forEach((opt, i) => {
            stepHtml += `<div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="${fieldName}" value="${escapeHtml(opt.trim())}" id="${fieldName}_${i}" ${i === 0 ? 'checked' : ''}>
              <label class="form-check-label" for="${fieldName}_${i}">${escapeHtml(opt.trim())}</label>
            </div>`;
          });
          stepHtml += `</div>`;
        } else {
          const placeholder = getPlaceholder(q.teks);
          if (isLongText(q.teks)) {
            stepHtml += `<textarea class="form-control" name="${fieldName}" rows="3" placeholder="${escapeHtml(placeholder)}" required></textarea>`;
          } else {
            stepHtml += `<input type="text" class="form-control" name="${fieldName}" placeholder="${escapeHtml(placeholder)}" required>`;
          }
        }

        stepHtml += `<div class="mt-3 d-flex justify-content-between align-items-center">`;
        if (idx > 0) {
          stepHtml += `<button type="button" class="btn btn-outline-secondary btn-sm rounded-pill prev-step" data-step="${idx}">
            <i class="bi bi-arrow-left me-1"></i> Sebelumnya
          </button>`;
        } else {
          stepHtml += `<div></div>`;
        }
        stepHtml += `<button type="button" class="btn btn-primary btn-sm rounded-pill next-step" data-step="${idx}">
          Selanjutnya <i class="bi bi-arrow-right ms-1"></i>
        </button>`;
        stepHtml += `</div>`;
        stepHtml += `</div>`;
        stepHtml += `</div>`;
        stepsArray.push(stepHtml);
        idx++;
      });

      const sigDisplay = idx === STATE.currentStep ? 'block' : 'none';
      let sigHtml = `<div id="step-${idx}" class="skrining-step" style="display:${sigDisplay};width:100%;position:relative;min-height:150px;margin-top:15px;">`;
      sigHtml += `
        <div class="form-section">
          <label class="form-label fw-bold">
            <span class="question-number">${idx + 1}</span>✍️ Tanda Tangan Assessor
          </label>
          <div class="signature-area">
            <canvas id="signatureCanvasSkrining" width="300" height="150"></canvas>
          </div>
          <div class="mt-2 d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" id="clearSkriningSign">
              <i class="bi bi-eraser me-1"></i> Hapus
            </button>
            <button type="button" class="btn btn-outline-primary btn-sm" id="undoSkriningSign">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Undo
            </button>
          </div>
        </div>
        <div class="mt-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
          <button type="button" class="btn btn-outline-secondary btn-sm rounded-pill prev-step" data-step="${idx}">
            <i class="bi bi-arrow-left me-1"></i> Sebelumnya
          </button>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary rounded-pill px-4" id="previewAnswersBtn">
              <i class="bi bi-eye me-1"></i> Preview
            </button>
            <button type="submit" class="btn btn-success rounded-pill px-4">
              <i class="bi bi-send me-1"></i> Kirim Skrining
            </button>
          </div>
        </div>
      `;
      sigHtml += `</div>`;
      stepsArray.push(sigHtml);

      container.innerHTML = `${indicatorHtml}<form id="formSkriningDinamis" novalidate>${stepsArray.join('')}</form>`;
      container.classList.add('fade-up');

      initSignaturePad();
      bindWizardNavigation();
      bindPreviewButton();
      bindSubmitForm();

      container.querySelectorAll('.wizard-indicator .dot').forEach(dot => {
        dot.addEventListener('click', (e) => {
          e.preventDefault();
          jumpToStep(parseInt(dot.dataset.stepIndex));
        });
      });

      setTimeout(restoreFormState, 80);
    }

    function renderFormAll(sorted) {
      const container = document.getElementById('skriningFormContainer');

      let questionsHtml = '';
      let stepIndex = 0;
      sorted.forEach(q => {
        const fieldName = generateFieldName(q.teks);
        const placeholder = getPlaceholder(q.teks);
        questionsHtml += `<div class="form-section mb-4 pb-3 border-bottom border-light">`;
        questionsHtml += `<label class="form-label"><span class="question-number">${stepIndex + 1}</span>${escapeHtml(q.teks)}${q.jenis !== 'radio' ? ' <span class="text-danger">*</span>' : ''}</label>`;
        if (q.jenis === 'radio') {
          const options = (q.opsi || '').split(',').filter(s => s.trim() !== '');
          questionsHtml += `<div class="radio-group">`;
          options.forEach((opt, idx) => {
            questionsHtml += `<div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="${fieldName}" value="${escapeHtml(opt.trim())}" id="${fieldName}_${idx}" ${idx === 0 ? 'checked' : ''}>
              <label class="form-check-label" for="${fieldName}_${idx}">${escapeHtml(opt.trim())}</label>
            </div>`;
          });
          questionsHtml += `</div>`;
        } else {
          if (isLongText(q.teks)) {
            questionsHtml += `<textarea class="form-control" name="${fieldName}" rows="3" placeholder="${escapeHtml(placeholder)}" required></textarea>`;
          } else {
            questionsHtml += `<input type="text" class="form-control" name="${fieldName}" placeholder="${escapeHtml(placeholder)}" required>`;
          }
        }
        questionsHtml += `</div>`;
        stepIndex++;
      });

      const formHtml = `
        <form id="formSkriningDinamis" novalidate>
          ${questionsHtml}
          <div class="form-section mt-4">
            <label class="form-label fw-bold">✍️ Tanda Tangan Assessor</label>
            <div class="signature-area">
              <canvas id="signatureCanvasSkrining" width="300" height="150"></canvas>
            </div>
            <div class="mt-2 d-flex gap-2">
              <button type="button" class="btn btn-outline-secondary btn-sm" id="clearSkriningSign">
                <i class="bi bi-eraser me-1"></i> Hapus
              </button>
              <button type="button" class="btn btn-outline-primary btn-sm" id="undoSkriningSign">
                <i class="bi bi-arrow-counterclockwise me-1"></i> Undo
              </button>
            </div>
            <div class="mt-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
              <button type="button" class="btn btn-outline-primary rounded-pill px-4" id="previewAnswersBtn">
                <i class="bi bi-eye me-1"></i> Preview
              </button>
              <button type="submit" class="btn btn-success rounded-pill px-4">
                <i class="bi bi-send me-1"></i> Kirim Skrining
              </button>
            </div>
          </div>
        </form>
      `;

      container.innerHTML = formHtml;
      container.classList.add('fade-up');

      initSignaturePad();
      bindPreviewButton();
      bindSubmitForm();
      setTimeout(restoreFormState, 50);
    }

    function initSignaturePad() {
      const canvas = document.getElementById('signatureCanvasSkrining');
      if (!canvas) return;

      if (STATE.sigPad) {
        try { STATE.sigPad.off(); } catch (e) {}
        STATE.sigPad = null;
      }

      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      const rect = canvas.parentElement.getBoundingClientRect();
      const w = Math.max(rect.width - 24, 260);
      const h = 150;

      canvas.width = w * ratio;
      canvas.height = h * ratio;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      const ctx = canvas.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(ratio, ratio);

      STATE.sigPad = new SignaturePad(canvas, {
        backgroundColor: 'rgb(255,255,255)',
        penColor: '#0f172a',
        minWidth: 1.5,
        maxWidth: 3,
      });

      on(document.getElementById('clearSkriningSign'), 'click', () => {
        STATE.sigPad.clear();
        saveFormState();
      });
      on(document.getElementById('undoSkriningSign'), 'click', () => {
        const data = STATE.sigPad.toData();
        if (data && data.length > 0) {
          data.pop();
          STATE.sigPad.fromData(data);
          saveFormState();
        }
      });
      STATE.sigPad.addEventListener('endStroke', saveFormState);
    }

    function bindWizardNavigation() {
      const container = document.getElementById('skriningFormContainer');

      container.querySelectorAll('.next-step').forEach(btn => {
        btn.addEventListener('click', () => {
          const current = parseInt(btn.dataset.step);
          const currentStepDiv = document.getElementById('step-' + current);
          if (!currentStepDiv) return;

          const inputs = Array.from(currentStepDiv.querySelectorAll('input[required], textarea[required], select[required]'));
          let valid = true;
          let firstEmpty = null;

          inputs.forEach(inp => {
            let empty = false;
            if (inp.type === 'radio') {
              const checked = currentStepDiv.querySelector(`input[name="${inp.name}"]:checked`);
              if (!checked) empty = true;
            } else {
              if (!String(inp.value || '').trim()) empty = true;
            }
            if (empty) {
              valid = false;
              if (!firstEmpty) firstEmpty = inp;
            }
          });

          if (!valid) {
            if (firstEmpty) {
              firstEmpty.style.borderColor = '#dc3545';
              firstEmpty.focus();
              setTimeout(() => { firstEmpty.style.borderColor = ''; }, 2500);
            }
            showToast('Harap isi semua field wajib pada langkah ini', 'warning');
            return;
          }
          jumpToStep(current + 1);
        });
      });

      container.querySelectorAll('.prev-step').forEach(btn => {
        btn.addEventListener('click', () => {
          const current = parseInt(btn.dataset.step);
          if (current > 0) jumpToStep(current - 1);
        });
      });
    }

    function jumpToStep(targetStep) {
      const container = document.getElementById('skriningFormContainer');
      const allSteps = container.querySelectorAll('.skrining-step');
      if (targetStep < 0 || targetStep >= allSteps.length) return;

      STATE.currentStep = targetStep;
      saveFormState();

      allSteps.forEach(el => {
        el.style.display = 'none';
        el.classList.remove('active');
      });

      const targetEl = document.getElementById('step-' + targetStep);
      if (targetEl) {
        targetEl.style.display = 'block';
        targetEl.classList.add('active');
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      container.querySelectorAll('.wizard-indicator .dot').forEach(dot => {
        const idx = parseInt(dot.dataset.stepIndex);
        dot.classList.remove('active', 'completed');
        if (idx === targetStep) dot.classList.add('active');
        else if (idx < targetStep) dot.classList.add('completed');
      });
    }

    function extractCurrentFormData() {
      const form = document.getElementById('formSkriningDinamis');
      const formData = new FormData(form);
      const answers = {};
      formData.forEach((v, k) => answers[k] = v);

      let signatureDataURL = null;
      if (STATE.sigPad && !STATE.sigPad.isEmpty()) {
        signatureDataURL = STATE.sigPad.toDataURL('image/jpeg', 0.3);
      }

      const params = { signature: signatureDataURL };
      const fixedFields = ['nama', 'alamat', 'info', 'pengetahuan', 'qunut', 'penyakit', 'pernah', 'alasan', 'catatan'];
      const dataJson = {};

      const sorted = STATE.questions.slice().sort((a, b) => (a.urutan || 0) - (b.urutan || 0));

      sorted.forEach(q => {
        const fieldName = generateFieldName(q.teks);
        const value = answers[fieldName] || '';
        let isFixed = false;
        const lowerTeks = q.teks.toLowerCase();
        for (const f of fixedFields) {
          if (lowerTeks.includes(f)) {
            params[f] = value;
            isFixed = true;
            break;
          }
        }
        if (!isFixed) dataJson[fieldName] = value;
      });
      params.dataJson = JSON.stringify(dataJson);

      return { params, sorted, answers };
    }

    function bindPreviewButton() {
      on(document.getElementById('previewAnswersBtn'), 'click', () => {
        if (!STATE.sigPad || STATE.sigPad.isEmpty()) {
          showToast('Mohon isi tanda tangan terlebih dahulu sebelum preview', 'warning');
          return;
        }
        const data = extractCurrentFormData();
        showSummaryModal(data.params, data.sorted, data.answers, true);
      });
    }

    function bindSubmitForm() {
      const form = document.getElementById('formSkriningDinamis');
      if (!form) return;
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (STATE.isSubmitting) return;

        const data = extractCurrentFormData();
        const { params, sorted, answers } = data;

        const inputs = Array.from(form.querySelectorAll('input[required], textarea[required], select[required]'));
        let valid = true;
        let firstEmpty = null;

        inputs.forEach(inp => {
          let empty = false;
          if (inp.type === 'radio') {
            const checked = form.querySelector(`input[name="${inp.name}"]:checked`);
            if (!checked) empty = true;
          } else {
            if (!String(inp.value || '').trim()) empty = true;
          }
          if (empty) {
            valid = false;
            if (!firstEmpty) firstEmpty = inp;
          }
        });

        if (!valid) {
          if (firstEmpty) {
            firstEmpty.style.borderColor = '#dc3545';
            firstEmpty.focus();
            setTimeout(() => { firstEmpty.style.borderColor = ''; }, 2500);
          }
          showToast('Harap isi semua field wajib', 'warning');
          return;
        }

        if (!STATE.sigPad || STATE.sigPad.isEmpty()) {
          showToast('Tanda tangan assessor wajib diisi', 'error');
          return;
        }

        showSummaryModal(params, sorted, answers, false);
      });
    }

    function showSummaryModal(params, sortedQuestions, rawAnswers, isPreviewMode) {
      const modalEl = document.getElementById('previewModal');
      const summaryContainer = document.getElementById('summaryContent');
      const modalTitle = document.getElementById('previewModalTitle');

      modalTitle.innerHTML = isPreviewMode
        ? '<i class="bi bi-eye me-2"></i>Preview Total Semua Jawaban'
        : '<i class="bi bi-check-circle me-2"></i>Konfirmasi & Kirim Data Skrining';

      let html = '';
      sortedQuestions.forEach(q => {
        const fieldName = generateFieldName(q.teks);
        const value = rawAnswers[fieldName] || '-';
        html += `
          <div class="col-md-6 mb-2">
            <div class="bg-light p-2 rounded-3 border border-0 shadow-sm small">
              <strong>${escapeHtml(q.teks)}</strong><br>
              <span class="text-primary fw-bold">${escapeHtml(value)}</span>
            </div>
          </div>`;
      });
      html += `
        <div class="col-md-12 mt-3">
          <div class="bg-success bg-opacity-10 p-2 rounded-3 border border-0 shadow-sm small text-success">
            <strong>✍️ Tanda Tangan Assessor:</strong> <i class="bi bi-check-circle-fill"></i> Sudah ditandatangani
          </div>
        </div>`;
      summaryContainer.innerHTML = html;

      const finalBtn = document.getElementById('modalFinalSubmitBtn');
      const newFinalBtn = finalBtn.cloneNode(true);
      finalBtn.parentNode.replaceChild(newFinalBtn, finalBtn);

      if (isPreviewMode) {
        newFinalBtn.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Lanjut Kirim';
        newFinalBtn.addEventListener('click', () => {
          bootstrap.Modal.getInstance(modalEl)?.hide();
        });
      } else {
        newFinalBtn.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Ya, Kirim Data';
        newFinalBtn.addEventListener('click', async () => {
          if (STATE.isSubmitting) return;
          STATE.isSubmitting = true;
          const btn = newFinalBtn;
          const original = btn.innerHTML;
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Mengirim…';

          try {
            const result = await submitSkrining(params);
            if (result && result.success) {
              showToast('✅ Skrining berhasil dikirim!', 'success');
              clearFormState();
              document.getElementById('formSkriningDinamis')?.reset();
              if (STATE.sigPad) STATE.sigPad.clear();
              STATE.currentStep = 0;
              bootstrap.Modal.getInstance(modalEl)?.hide();
              setTimeout(() => window.location.reload(), 1200);
            } else {
              throw new Error((result && result.error) || 'Gagal mengirim');
            }
          } catch (e) {
            showToast('❌ Gagal mengirim: ' + e.message, 'error');
          } finally {
            STATE.isSubmitting = false;
            btn.disabled = false;
            btn.innerHTML = original;
          }
        });
      }

      new bootstrap.Modal(modalEl).show();
    }

    function switchMode(mode) {
      if (mode === STATE.currentMode) return;
      STATE.currentMode = mode;
      document.getElementById('modeWizardBtn')?.classList.toggle('active', mode === 'wizard');
      document.getElementById('modeAllBtn')?.classList.toggle('active', mode === 'all');
      STATE.currentStep = 0;
      renderForm();
    }

    function renderForm() {
      if (!STATE.questions || STATE.questions.length === 0) {
        const container = document.getElementById('skriningFormContainer');
        container.innerHTML = `<div class="alert alert-warning border-0 shadow-sm glass-card">
          <i class="bi bi-exclamation-triangle me-2"></i>Belum ada pertanyaan skrining.
        </div>`;
        return;
      }
      const sorted = STATE.questions.slice().sort((a, b) => (a.urutan || 0) - (b.urutan || 0));
      if (STATE.currentMode === 'wizard') renderFormWizard(sorted);
      else renderFormAll(sorted);
    }

    async function loadQuestions() {
      renderSkeletonForm();

      let cached = null;
      try {
        const item = localStorage.getItem(CACHE_KEY);
        if (item) {
          const parsed = JSON.parse(item);
          if (Date.now() - parsed.ts < CACHE_AGE * 60 * 1000) {
            cached = parsed.data;
          } else {
            localStorage.removeItem(CACHE_KEY);
          }
        }
      } catch (e) { /* ignore */ }

      if (cached && Array.isArray(cached) && cached.length > 0) {
        STATE.questions = cached;
        renderForm();
      }

      (async () => {
        try {
          const res = await getSkriningQuestions();
          let list = [];
          if (res && res.success && Array.isArray(res.data)) list = res.data;
          else if (Array.isArray(res)) list = res;

          if (list.length > 0) {
            STATE.questions = list;
            try {
              localStorage.setItem(CACHE_KEY, JSON.stringify({ data: list, ts: Date.now() }));
            } catch (e) {}
            renderForm();
          } else if (!cached || cached.length === 0) {
            const container = document.getElementById('skriningFormContainer');
            container.innerHTML = `<div class="alert alert-info border-0 shadow-sm glass-card">
              <i class="bi bi-info-circle me-2"></i>Belum ada pertanyaan skrining tersedia.
            </div>`;
          }
        } catch (e) {
          console.warn('[skrining] fetch error:', e);
          if (!cached || cached.length === 0) {
            const container = document.getElementById('skriningFormContainer');
            container.innerHTML = `<div class="alert alert-danger border-0 shadow-sm glass-card">
              Gagal memuat pertanyaan: ${escapeHtml(e.message)}
            </div>`;
          }
        }
      })();
    }

    (async function boot() {
      const canAccess = await guardPublicAccess();
      if (!canAccess) return;

      updateNavbarMenu();

      on(document.getElementById('modeWizardBtn'), 'click', () => switchMode('wizard'));
      on(document.getElementById('modeAllBtn'), 'click', () => switchMode('all'));

      await loadQuestions();
    })();

    console.log(
      '%c skrining.html v26.1.8 — GitHub Pages /bisaa/ Edition ',
      'background:#2563eb;color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;'
    );
  </script>
</body>
