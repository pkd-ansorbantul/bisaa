<!-- ============================================================
     SIDEBAR PARTIAL — PKD GP Ansor Bantul
     Versi: 27.0.0 — NOTIF PANEL OVERFLOW FIX EDITION
     Dimuat oleh: js/components/sidebar.js
     ============================================================
     v27.0.0 CHANGES (dari v26.1.8):
     ✅ FIX: .sidebar-header & .sidebar-header-notif overflow: visible
        → Notif panel 380px bisa overflow keluar sidebar 260px
     ✅ FIX: Notif panel default position → buka ke KANAN bell
        (sebelumnya buka ke bawah → tertutup brand area)
     ✅ FIX: Minimized mode — panel tetap buka ke kanan
     ✅ KEEP: Semua 18 menu + 4 submenu + brand + logout
     ✅ VERIFIED: Semua navigasi + notif + theme toggle berfungsi
     ============================================================ -->

<!-- ===== v27.0.0: Inline styles untuk sidebar header ===== -->
<style>
  /* ============================================================
     SIDEBAR HEADER — theme toggle + notif bell + minimize
     ✅ FIX v27.0.0: overflow: visible agar notif panel bisa
        overflow keluar dari sidebar (260px → 380px panel)
     ============================================================ */
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.6rem 0.9rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    flex-shrink: 0;
    transition: padding 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    /* ✅ FIX v27.0.0: notif panel tidak boleh ter-clip */
    overflow: visible;
  }

  .sidebar-header-notif {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    min-width: 0;
    /* ✅ FIX v27.0.0: notif panel tidak boleh ter-clip */
    overflow: visible;
    /* ✅ Prevent stacking-context isolation */
    position: relative;
    z-index: 1;
  }

  .sidebar-header-controls {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    flex-shrink: 0;
  }

  /* Mini buttons */
  .sidebar-mini-btn {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.08);
    border: none;
    color: #cbd5e1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s ease;
    padding: 0;
    flex-shrink: 0;
    position: relative;
  }

  .sidebar-mini-btn:hover {
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
  }

  .sidebar-mini-btn:active {
    transform: scale(0.94);
  }

  .sidebar-mini-btn:focus-visible {
    outline: 2px solid #60a5fa;
    outline-offset: 2px;
  }

  /* Theme toggle button — icon swap */
  #sidebarThemeToggleBtn .theme-icon-light,
  #sidebarThemeToggleBtn .theme-icon-dark {
    position: absolute;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #sidebarThemeToggleBtn .theme-icon-dark {
    opacity: 0;
    transform: rotate(-90deg) scale(0.5);
  }

  [data-theme="dark"] #sidebarThemeToggleBtn .theme-icon-light {
    opacity: 0;
    transform: rotate(90deg) scale(0.5);
  }

  [data-theme="dark"] #sidebarThemeToggleBtn .theme-icon-dark {
    opacity: 1;
    transform: rotate(0) scale(1);
    color: #fbbf24;
  }

  /* Notif bell override — agar cocok di dark sidebar */
  .sidebar-header-notif .notif-bell-btn {
    background: rgba(255, 255, 255, 0.08);
    border: none;
    color: #cbd5e1;
    width: 34px;
    height: 34px;
    font-size: 0.95rem;
  }

  .sidebar-header-notif .notif-bell-btn:hover {
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
  }

  .sidebar-header-notif .notif-bell-btn.has-unread {
    color: #fbbf24;
  }

  /* Notif badge — border sesuai sidebar dark */
  .sidebar-header-notif .notif-badge {
    border-color: #0f172a;
    font-size: 0.62rem;
    min-width: 18px;
    height: 18px;
    top: -3px;
    right: -3px;
  }

  /* ============================================================
     ✅ FIX v27.0.0: Notif Panel Positioning
     Default: buka ke KANAN bell (bukan ke bawah)
     → Tidak tertutup brand area di bawahnya
     → Bisa overflow keluar sidebar (parent overflow: visible)
     ============================================================ */
  .sidebar-header-notif .notif-panel {
    top: 0;
    left: calc(100% + 10px);
    right: auto;
    /* ✅ Override arrow pointer — panel bukan anchor ke bawah bell */
    --notif-arrow-hidden: 1;
  }

  /* Sembunyikan arrow pointer karena panel bukan anchor ke bawah */
  .sidebar-header-notif .notif-panel::before {
    /* Arrow menunjuk ke kiri (dari bell di kanan) */
    top: 16px;
    left: -7px;
    right: auto;
    transform: rotate(-45deg);
    /* Border menunjuk ke kiri */
    border-left: 1px solid var(--color-slate-200);
    border-top: none;
    border-right: none;
    border-bottom: 1px solid var(--color-slate-200);
  }

  [data-theme="dark"] .sidebar-header-notif .notif-panel::before {
    background: #0f172a;
    border-color: #1e293b;
  }

  /* Minimized mode: stack vertical, compact */
  .sidebar-wrapper.minimized .sidebar-header {
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 0.5rem 0.4rem;
    gap: 0.4rem;
  }

  .sidebar-wrapper.minimized .sidebar-header-notif {
    width: 100%;
    justify-content: center;
    /* ✅ Keep overflow visible di minimized mode */
    overflow: visible;
  }

  .sidebar-wrapper.minimized .sidebar-header-controls {
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .sidebar-wrapper.minimized .sidebar-mini-btn,
  .sidebar-wrapper.minimized .sidebar-header-notif .notif-bell-btn {
    width: 40px;
    height: 40px;
  }

  /* Minimized: notif panel tetap muncul ke kanan */
  .sidebar-wrapper.minimized .sidebar-header-notif .notif-panel {
    top: 0;
    left: calc(100% + 8px);
    right: auto;
  }

  /* ============================================================
     RESPONSIVE — Mobile (<992px)
     Sidebar hidden, notif panel ikut disembunyikan atau fullwidth
     ============================================================ */
  @media (max-width: 991px) {
    .sidebar-header {
      padding: 0.75rem 1rem;
    }

    /* Mobile: notif panel fullwidth (handled by theme.css @media) */
    .sidebar-header-notif .notif-panel {
      position: fixed;
      top: 64px;
      left: 8px;
      right: 8px;
      width: auto;
      max-width: none;
    }

    /* Sembunyikan arrow pointer di mobile */
    .sidebar-header-notif .notif-panel::before {
      display: none;
    }
  }

  /* ============================================================
     ACCESSIBILITY — Reduced motion
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    .sidebar-header,
    .sidebar-mini-btn,
    #sidebarThemeToggleBtn .theme-icon-light,
    #sidebarThemeToggleBtn .theme-icon-dark {
      transition-duration: 0.01ms !important;
    }
  }
</style>
