<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Login ke sistem PKD GP Ansor Kabupaten Bantul">
  <meta name="robots" content="noindex, nofollow">
  
  <title>Login · PKD GP Ansor Bantul</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/bisaa/LOGO%20ANSOR.webp">
  <link rel="apple-touch-icon" href="/bisaa/LOGO%20ANSOR.webp">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* ===== UNIVERSAL PREMIUM ===== */
    * { font-family: 'Inter', system-ui, sans-serif; }
    body {
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== HEADER ===== */
    .header-minimal {
      background: rgba(255, 255, 255, 0.72) !important;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 1030;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.04);
      padding: 0 !important;
    }
    .header-minimal .container {
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
    }
    .btn-back {
      background: rgba(37, 99, 235, 0.08);
      color: #2563eb;
      border: 1px solid rgba(37, 99, 235, 0.2);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-radius: 50px;
    }
    .btn-back:hover {
      background: #2563eb;
      color: white;
      transform: translateX(-3px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .brand-logo-mini { 
      height: 40px; 
      width: auto; 
      margin-right: 14px; 
      transition: transform 0.2s;
    }
    .brand-logo-mini:hover { transform: scale(1.05); }
    .brand-title-mini { 
      font-weight: 700; 
      color: #0a3d62; 
      font-size: 1.3rem; 
      line-height: 1.2; 
      letter-spacing: -0.02em;
    }
    .brand-sub-mini { 
      font-size: 0.8rem; 
      color: #64748b; 
      display: block; 
      letter-spacing: 0.02em;
    }

    /* ===== USER MENU ===== */
    #navbarUserMenu { display: flex; align-items: center; gap: 8px; }
    .user-menu-area .dropdown-toggle { 
      border-radius: 50px; 
      padding: 0.3rem 1rem; 
      font-size: 0.9rem; 
    }
    .user-menu-area .btn-outline-primary { 
      border-radius: 50px; 
      padding: 0.3rem 1.2rem; 
      font-size: 0.9rem; 
    }

    /* ===== GLASS CARD ===== */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .glass-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 50px rgba(37, 99, 235, 0.08);
      border-color: rgba(37, 99, 235, 0.2);
    }

    /* ===== FORM ===== */
    .form-control {
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      padding: 0.6rem 1rem;
      transition: 0.2s;
      font-size: 0.95rem;
    }
    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .form-label { font-weight: 600; font-size: 0.9rem; color: #0f172a; }

    /* ===== BUTTON LOGIN ===== */
    .btn-login {
      border-radius: 9999px;
      padding: 0.7rem;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      background: linear-gradient(135deg, #2563eb, #1e4bb3);
      border: none;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      color: white;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
      color: white;
    }
    .btn-login:active {
      transform: scale(0.98);
    }
    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== ANIMASI ===== */
    .fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes fadeUp { 
      from { opacity: 0; transform: translateY(20px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    /* ===== FOOTER ===== */
    .footer-modern {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: auto;
      text-align: center;
      padding: 1.5rem 0;
      border-top: 1px solid #e2e8f0;
      background: white;
    }

    /* ===== RESPONSIF ===== */
    @media (max-width: 576px) {
      .glass-card { border-radius: 16px; padding: 1.5rem !important; }
      .header-minimal .container { padding: 0 0.5rem; }
      .btn-back { font-size: 0.8rem; padding: 0.2rem 0.8rem; }
      .brand-title-mini { display: none; }
      .brand-sub-mini { display: none; }
      .user-menu-area .dropdown-toggle { font-size: 0.75rem; padding: 0.2rem 0.8rem; }
    }

    /* ===== ERROR SHAKE ===== */
    .shake {
      animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-4px); }
      40%, 60% { transform: translateX(4px); }
    }
  </style>
</head>
<body>

  <!-- ================= HEADER ================= -->
  <header class="header-minimal sticky-top shadow-sm">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <div class="d-flex align-items-center gap-2">
        <a href="/bisaa/index.html" class="btn btn-back rounded-pill">
          <i class="bi bi-arrow-left me-1" aria-hidden="true"></i> Kembali
        </a>
        <a href="/bisaa/index.html" class="brand-minimal text-decoration-none d-flex align-items-center ms-1">
          <img src="/bisaa/LOGO%20ANSOR.webp" alt="GP Ansor" class="brand-logo-mini">
          <div>
            <div class="brand-title-mini">PKD GP Ansor</div>
            <span class="brand-sub-mini">Kabupaten Bantul</span>
          </div>
        </a>
      </div>
      <div id="navbarUserMenu" class="user-menu-area"></div>
    </div>
  </header>

  <!-- ================= KONTEN LOGIN ================= -->
  <div id="contentArea" class="container" style="padding: 2rem 0; flex: 1;">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="glass-card p-4 fade-up text-center">
          
          <!-- Logo & Judul -->
          <div class="mb-4">
            <img src="/bisaa/LOGO%20ANSOR.webp" alt="Logo Ansor" style="height: 60px; width: auto; margin-bottom: 0.5rem;">
            <h4 class="fw-bold text-primary">Masuk ke Sistem</h4>
            <p class="text-muted small">Gunakan akun Admin, Ketua PAC, atau Member</p>
          </div>

          <!-- Login Form -->
          <form id="loginForm" class="text-start" autocomplete="off">
            <div class="mb-3">
              <label class="form-label fw-semibold" for="username">Username</label>
              <input 
                type="text" 
                id="username" 
                class="form-control" 
                placeholder="Masukkan username" 
                autocomplete="username"
                required
              >
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-semibold" for="password">Password</label>
              <div class="input-group">
                <input 
                  type="password" 
                  id="password" 
                  class="form-control rounded-start-3" 
                  placeholder="Masukkan password" 
                  autocomplete="current-password"
                  required
                >
                <button 
                  class="btn btn-outline-secondary rounded-end-3" 
                  type="button" 
                  id="togglePasswordBtn"
                  aria-label="Tampilkan password"
                >
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>
            
            <div id="errorMsg" class="text-danger small mb-3" style="display: none;" role="alert"></div>
            
            <button type="submit" class="btn btn-primary w-100 btn-login" id="loginBtn">
              <span id="loginBtnText">Login</span>
            </button>
          </form>

          <!-- Links -->
          <div class="mt-3">
            <a href="/bisaa/forgot_account.html" class="text-decoration-none small text-muted">
              <i class="bi bi-question-circle me-1" aria-hidden="true"></i>Lupa Username / Password?
            </a>
            <br>
            <a href="/bisaa/index.html" class="text-decoration-none small" style="margin-top: 0.5rem; display: inline-block;">
              <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Kembali ke Awal
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- ================= FOOTER ================= -->
  <footer class="footer-modern container">
    <div class="d-flex justify-content-center align-items-center gap-2">
      <i class="bi bi-c-circle" aria-hidden="true"></i>
      <span>Hak Cipta 2026 — Tim Instruktur GP Ansor Kabupaten Bantul</span>
    </div>
  </footer>

  <!-- ================= SCRIPTS ================= -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    // ==========================================================
    //   IMPORTS
    // ==========================================================
    import {
      verifyAdmin,
      verifyKetuaPAC,
      verifyMember,
      setUserRole,
      setUserData,
      persistAuthState,
      getUserRole,
      updateNavbarMenu
    } from './js/core/api.js';

    // ==========================================================
    //   TOGGLE PASSWORD VISIBILITY
    // ==========================================================
    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const btn = document.getElementById('togglePasswordBtn');
      if (!pwd || !btn) return;
      
      if (pwd.type === 'password') {
        pwd.type = 'text';
        btn.querySelector('i').className = 'bi bi-eye-slash';
        btn.setAttribute('aria-label', 'Sembunyikan password');
      } else {
        pwd.type = 'password';
        btn.querySelector('i').className = 'bi bi-eye';
        btn.setAttribute('aria-label', 'Tampilkan password');
      }
    }

    // ==========================================================
    //   SHOW ERROR
    // ==========================================================
    function showError(message) {
      const errorDiv = document.getElementById('errorMsg');
      const form = document.getElementById('loginForm');
      if (errorDiv) {
        errorDiv.innerText = message;
        errorDiv.style.display = 'block';
      }
      // Shake animation
      if (form) {
        form.classList.add('shake');
        setTimeout(() => form.classList.remove('shake'), 500);
      }
    }

    function hideError() {
      const errorDiv = document.getElementById('errorMsg');
      if (errorDiv) {
        errorDiv.style.display = 'none';
        errorDiv.innerText = '';
      }
    }

    // ==========================================================
    //   LOGIN HANDLER
    // ==========================================================
    async function handleLogin(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('loginBtnText');
      const originalText = btnText.textContent;

      // Validasi
      if (!username || !password) {
        showError('Username dan password harus diisi!');
        return;
      }

      hideError();
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Memeriksa...';

      let loggedIn = false;

      // 1. Coba login sebagai admin
      try {
        const adminRes = await verifyAdmin(username, password);
        if (adminRes.success && adminRes.role) {
          setUserRole('admin');
          setUserData({ nama: username, role: 'admin' });
          persistAuthState();
          loggedIn = true;
          
          // Redirect sesuai parameter redirect atau default
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || '/bisaa/app.html#/admin/dashboard';
          window.location.replace(redirect);
          return;
        }
      } catch (e) {
        console.warn('Admin login error:', e);
      }

      if (loggedIn) return;

      // 2. Coba login sebagai ketua PAC
      try {
        const pacRes = await verifyKetuaPAC(username, password);
        if (pacRes.success && pacRes.role === 'ketua_pac') {
          setUserRole('ketua_pac');
          setUserData(pacRes.data || { nama: username });
          persistAuthState();
          loggedIn = true;
          
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || '/bisaa/ketua_pac.html';
          window.location.replace(redirect);
          return;
        }
      } catch (e) {
        console.warn('Ketua PAC login error:', e);
      }

      if (loggedIn) return;

      // 3. Coba login sebagai member
      try {
        const memberRes = await verifyMember(username, password);
        if (memberRes.success && memberRes.role === 'member') {
          setUserRole('member');
          setUserData(memberRes.data || { nama: username });
          persistAuthState();
          loggedIn = true;
          
          const params = new URLSearchParams(window.location.search);
          const redirect = params.get('redirect') || '/bisaa/member.html';
          window.location.replace(redirect);
          return;
        }
      } catch (e) {
        console.warn('Member login error:', e);
      }

      // 4. Semua gagal
      showError('Username atau password salah!');
      btn.disabled = false;
      btnText.textContent = originalText;
    }

    // ==========================================================
    //   INIT FORM
    // ==========================================================
    function initLoginForm() {
      const form = document.getElementById('loginForm');
      const toggleBtn = document.getElementById('togglePasswordBtn');
      
      if (toggleBtn) {
        toggleBtn.addEventListener('click', togglePasswordVisibility);
      }
      
      if (form) {
        form.addEventListener('submit', handleLogin);
      }

      // Enter di username → focus ke password
      document.getElementById('username')?.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('password')?.focus();
        }
      });

      // Clear error saat user mulai mengetik
      ['username', 'password'].forEach(id => {
        document.getElementById(id)?.addEventListener('input', hideError);
      });
    }

    // ==========================================================
    //   BOOT
    // ==========================================================
    (async function boot() {
      // Cek apakah user sudah login
      const role = getUserRole();
      
      if (role === 'admin') {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/bisaa/app.html#/admin/dashboard';
        window.location.replace(redirect);
        return;
      } else if (role === 'ketua_pac') {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/bisaa/ketua_pac.html';
        window.location.replace(redirect);
        return;
      } else if (role === 'member') {
        const params = new URLSearchParams(window.location.search);
        const redirect = params.get('redirect') || '/bisaa/member.html';
        window.location.replace(redirect);
        return;
      }

      // Guest → tampilkan form
      updateNavbarMenu();
      initLoginForm();
    })();

  </script>
</body>
</html>
