    .cache-status {

<body>

  <div id="contentArea">
    <section class="container container-card">
      <h2 class="section-title"><i class="bi bi-people-fill me-2"></i>Data Kader per PAC</h2>

      <!-- Filter & Pencarian -->
      <div class="row mb-4 g-2">
        <div class="col-md-6">
          <div class="d-flex gap-2 flex-wrap align-items-center">
            <div class="input-group" style="max-width:300px;">
              <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-search text-muted"></i>
              </span>

                     id="searchInput" placeholder="Cari nama..." autocomplete="off"
                     aria-label="Cari kader">
            </div>

              <option value="">Semua PAC</option>
            </select>

      <div class="table-container">

  <footer class="footer-modern container">

  <!-- ================= SCRIPTS ================= -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    // ==========================================================
    //   IMPORTS (v26.1.8 GITHUB PAGES: /bisaa/js/core/api.js)
    // ==========================================================
    import {
      callApi,
      showToast,
      escapeHtml,
      guardPublicAccess,
      updateNavbarMenu
    } from '/bisaa/js/core/api.js';

    // ==========================================================
    //   STATE
    // ==========================================================
    const STATE = {
      pesertaList: [],
      filteredList: [],
      searchQuery: '',
      utusanFilter: '',
      currentPage: 1,
      itemsPerPage: 20,
      sortColumn: null,
      sortDirection: 'asc'
    };

    let searchDebounceTimer = null;

    // ==========================================================
    //   UTILITY
    // ==========================================================
    function updateCacheStatus(status) {
      const el = document.getElementById('cacheStatus');
      if (el) {
        el.textContent = status;
        el.className = 'cache-status ' + (status === 'Live' ? 'live' : '');
      }
    }

    function debounce(fn, delay) {
      let timer;
      return function(...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    // ==========================================================
    //   LOAD DATA
    // ==========================================================
    async function loadKaderData(forceRefresh = false) {
      const container = document.getElementById('kaderTableContainer');
      if (container) {
        container.innerHTML = `
          <div class="text-center py-5">
            <div class="spinner-border text-primary"></div>
            <p class="mt-2 text-muted small">Memuat data kader...</p>
          </div>
        `;
      }

      try {
        const res = await callApi('getPesertaList', {}, 'GET');
        const freshData = res?.data || res;

        if (freshData && Array.isArray(freshData) && freshData.length > 0) {
          STATE.pesertaList = freshData;
          renderUtusanFilter();
          applyFiltersAndSort();
          updateCacheStatus('Live');
        } else {
          if (container) {
            container.innerHTML = `<div class="alert alert-info text-center">Belum ada data kader.</div>`;
          }
          updateCacheStatus('Empty');
        }
      } catch (e) {
        console.warn('Gagal load kader:', e);
        if (container) {
          container.innerHTML = `<div class="alert alert-danger text-center">Gagal memuat data.</div>`;
        }
        updateCacheStatus('Error');
      }
    }

    // ==========================================================
    //   FILTER & SORT
    // ==========================================================
    function getFilteredPeserta(query = '', utusan = '') {
      let filtered = STATE.pesertaList;

      if (query.trim() !== '') {
        const q = query.toLowerCase().trim();
        filtered = filtered.filter(item =>
          (item.nama_lengkap && item.nama_lengkap.toLowerCase().includes(q)) ||
          (item.utusan && item.utusan.toLowerCase().includes(q))
        );
      }

      if (utusan !== '') {
        filtered = filtered.filter(item => item.utusan === utusan);
      }

      return filtered;
    }

    function applyFiltersAndSort() {
      let filtered = getFilteredPeserta(STATE.searchQuery, STATE.utusanFilter);

      if (STATE.sortColumn) {
        filtered.sort(function(a, b) {
          let va = (a[STATE.sortColumn] || '').toString().toLowerCase();
          let vb = (b[STATE.sortColumn] || '').toString().toLowerCase();
          if (va < vb) return STATE.sortDirection === 'asc' ? -1 : 1;
          if (va > vb) return STATE.sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
      }

      STATE.filteredList = filtered;
      const totalItems = filtered.length;
      const totalPages = Math.max(1, Math.ceil(totalItems / STATE.itemsPerPage));
      if (STATE.currentPage > totalPages) STATE.currentPage = totalPages;
      if (STATE.currentPage < 1) STATE.currentPage = 1;

      const start = (STATE.currentPage - 1) * STATE.itemsPerPage;
      const end = Math.min(start + STATE.itemsPerPage, totalItems);

      renderTable(filtered.slice(start, end), totalItems);
      renderTotalBadge(totalItems);
    }

    // ==========================================================
    //   RENDER TOTAL BADGE
    // ==========================================================
    function renderTotalBadge(total) {
      const container = document.getElementById('totalBadgeContainer');
      if (!container) return;
      const selectedPAC = STATE.utusanFilter;
      if (selectedPAC) {
        container.innerHTML = `<span class="stat-badge"><i class="bi bi-people-fill me-2"></i>Kader PAC ${escapeHtml(selectedPAC)} : ${total} orang</span>`;
      } else {
        container.innerHTML = `<span class="stat-badge"><i class="bi bi-people-fill me-2"></i>Total Kader : ${total} orang</span>`;
      }
    }

    // ==========================================================
    //   RENDER TABEL
    // ==========================================================
    function renderTable(data, totalItems) {
      const container = document.getElementById('kaderTableContainer');
      if (!container) return;

      let html = `
        <div class="table-responsive">
          <table class="table table-bordered table-hover table-sm align-middle">
            <thead class="table-light">
              <tr>
                <th style="width:50px;">#</th>
                <th class="sortable" data-sort="nama_lengkap" role="button" tabindex="0">Nama</th>
                <th class="sortable" data-sort="utusan" role="button" tabindex="0">PAC</th>
                <th class="sortable" data-sort="pendidikan_terakhir" role="button" tabindex="0">Pendidikan</th>
                <th class="sortable" data-sort="pekerjaan" role="button" tabindex="0">Pekerjaan</th>
              </tr>
            </thead>
            <tbody>
      `;

      if (data.length === 0) {
        html += `
          <tr>
            <td colspan="5" class="text-center py-3 text-muted">
              <i class="bi bi-inbox fs-4 d-block mb-2"></i>
              Tidak ada data kader untuk PAC ini.
            </td>
          </tr>
        `;
      } else {
        data.forEach((item, index) => {
          const globalIndex = (STATE.currentPage - 1) * STATE.itemsPerPage + index + 1;
          html += `
            <tr>
              <td>${globalIndex}</td>
              <td><strong>${escapeHtml(item.nama_lengkap || '')}</strong></td>
              <td>${escapeHtml(item.utusan || '-')}</td>
              <td>${escapeHtml(item.pendidikan_terakhir || '-')}</td>
              <td>${escapeHtml(item.pekerjaan || '-')}</td>
            </tr>
          `;
        });
      }

      html += `</tbody></table></div>`;

      const totalPages = Math.max(1, Math.ceil(totalItems / STATE.itemsPerPage));
      html += `
        <div class="pagination-container">
          <div class="info">
            Menampilkan ${data.length > 0 ? (STATE.currentPage - 1) * STATE.itemsPerPage + 1 : 0} -
            ${Math.min(STATE.currentPage * STATE.itemsPerPage, totalItems)} dari ${totalItems} data
          </div>
          <div class="btn-group">
      `;

      // Pagination dengan max 7 tombol
      const maxButtons = 7;
      let startPage = Math.max(1, STATE.currentPage - Math.floor(maxButtons / 2));
      let endPage = Math.min(totalPages, startPage + maxButtons - 1);
      if (endPage - startPage + 1 < maxButtons) startPage = Math.max(1, endPage - maxButtons + 1);

      if (startPage > 1) {
        html += `<button class="btn btn-sm btn-outline-secondary" onclick="goToPage(1)" aria-label="Halaman 1">1</button>`;
        if (startPage > 2) html += `<button class="btn btn-sm btn-outline-secondary" disabled>…</button>`;
      }
      for (let i = startPage; i <= endPage; i++) {
        html += `<button class="btn btn-sm ${i === STATE.currentPage ? 'btn-primary active' : 'btn-outline-secondary'}"
                          onclick="goToPage(${i})" aria-label="Halaman ${i}">${i}</button>`;
      }
      if (endPage < totalPages) {
        if (endPage < totalPages - 1) html += `<button class="btn btn-sm btn-outline-secondary" disabled>…</button>`;
        html += `<button class="btn btn-sm btn-outline-secondary" onclick="goToPage(${totalPages})" aria-label="Halaman terakhir">${totalPages}</button>`;
      }
      html += `</div></div>`;

      container.innerHTML = html;

      // Bind sort
      container.querySelectorAll('[data-sort]').forEach(th => {
        th.addEventListener('click', function() {
          sortTable(this.dataset.sort);
        });
        th.addEventListener('keypress', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            sortTable(this.dataset.sort);
          }
        });
      });
    }

    // ==========================================================
    //   SORT & PAGINATION (GLOBAL)
    // ==========================================================
    window.sortTable = function(col) {
      if (STATE.sortColumn === col) {
        STATE.sortDirection = STATE.sortDirection === 'asc' ? 'desc' : 'asc';
      } else {
        STATE.sortColumn = col;
        STATE.sortDirection = 'asc';
      }
      STATE.currentPage = 1;
      applyFiltersAndSort();
    };

    window.goToPage = function(page) {
      const totalItems = STATE.filteredList.length;
      const totalPages = Math.max(1, Math.ceil(totalItems / STATE.itemsPerPage));
      if (page < 1 || page > totalPages) return;
      STATE.currentPage = page;
      applyFiltersAndSort();
    };

    // ==========================================================
    //   RENDER DROPDOWN FILTER UTUSAN
    // ==========================================================
    function renderUtusanFilter() {
      const select = document.getElementById('filterUtusan');
      if (!select) return;

      const utusanSet = new Set();
      STATE.pesertaList.forEach(item => {
        if (item.utusan && String(item.utusan).trim() !== '') {
          utusanSet.add(item.utusan);
        }
      });

      const utusan = Array.from(utusanSet).sort();
      const currentVal = select.value;

      select.innerHTML = '<option value="">Semua PAC</option>';
      utusan.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u;
        opt.textContent = u;
        if (currentVal === u) opt.selected = true;
        select.appendChild(opt);
      });
    }

    // ==========================================================
    //   BIND EVENTS
    // ==========================================================
    document.getElementById('refreshDataBtn')?.addEventListener('click', function() {
      const btn = this;
      const original = btn.innerHTML;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Memuat...';
      btn.disabled = true;

      loadKaderData(true)
        .then(() => {
          btn.innerHTML = original;
          btn.disabled = false;
          showToast('Data berhasil disegarkan', 'success');
        })
        .catch(() => {
          btn.innerHTML = original;
          btn.disabled = false;
          showToast('Gagal menyegarkan', 'error');
        });
    });

    document.getElementById('searchInput')?.addEventListener('input', debounce(function(e) {
      STATE.searchQuery = e.target.value;
      STATE.currentPage = 1;
      applyFiltersAndSort();
    }, 300));

    document.getElementById('filterUtusan')?.addEventListener('change', function() {
      STATE.utusanFilter = this.value;
      STATE.currentPage = 1;
      applyFiltersAndSort();
    });

    // ==========================================================
    //   BOOT
    // ==========================================================
    (async function boot() {
      const canAccess = await guardPublicAccess();
      if (!canAccess) return;

      updateNavbarMenu();
      loadKaderData();
    })();

    console.log(
      '%c kader.html v26.1.8 — GitHub Pages /bisaa/ Edition ',
      'background:#2563eb;color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;'
    );
  </script>
