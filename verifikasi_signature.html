<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Verifikasi tanda tangan digital PKD GP Ansor Kabupaten Bantul">
  <meta name="robots" content="noindex, nofollow">

  <title>Verifikasi TTD Digital · PKD GP Ansor Bantul</title>

  <!-- ✅ v26.1.8 GITHUB PAGES: /bisaa/LOGOANSOR.webp -->
  <link rel="icon" type="image/webp" href="/bisaa/LOGOANSOR.webp">
  <link rel="apple-touch-icon" href="/bisaa/LOGOANSOR.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    /* ============================================================
       RESET & LAYOUT
       ============================================================ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* ============================================================
       BRAND HEADER
       ============================================================ */
    .brand-header {
      text-align: center;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .brand-header img {
      height: 64px;
      margin-bottom: 0.75rem;
    }
    .brand-header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.25rem;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .brand-header h1 i {
      color: #2563eb;
      font-size: 1.5rem;
    }
    .brand-header p {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 0;
    }

    /* ============================================================
       VERIFY CARD
       ============================================================ */
    .verify-card {
      max-width: 560px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 2rem 1.75rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
      border: 1px solid #e2e8f0;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.1s;
    }

    /* ============================================================
       TTD PREVIEW
       ============================================================ */
    .ttd-preview {
      text-align: center;
      padding: 1rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      margin-bottom: 1rem;
    }
    .ttd-preview img {
      max-width: 180px;
      max-height: 180px;
      width: auto;
      height: auto;
      background: #fff;
      padding: 8px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .ttd-preview .no-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
      color: #94a3b8;
      font-size: 0.85rem;
    }

    /* ============================================================
       RESULT BOX
       ============================================================ */
    .result-box {
      border-radius: 16px;
      padding: 1.25rem;
      border: none;
      animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .result-box.success {
      background: #dcfce7;
      border-left: 5px solid #16a34a;
      color: #166534;
    }
    .result-box.danger {
      background: #fee2e2;
      border-left: 5px solid #dc2626;
      color: #991b1b;
    }
    .result-box.warning {
      background: #fef3c7;
      border-left: 5px solid #f59e0b;
      color: #92400e;
    }
    .result-box.info {
      background: #cffafe;
      border-left: 5px solid #0891b2;
      color: #155e75;
    }

    .result-box .result-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .result-box .result-title i {
      font-size: 1.4rem;
    }

    .role-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #2563eb;
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 0.5rem;
    }

    .result-detail {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-top: 0.85rem;
      font-size: 0.875rem;
    }
    .result-detail .row-line {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    .result-detail .row-line:last-child {
      border-bottom: none;
    }
    .result-detail .label {
      color: #64748b;
      font-weight: 500;
      flex-shrink: 0;
    }
    .result-detail .value {
      font-weight: 600;
      text-align: right;
      word-break: break-word;
      color: #0f172a;
    }
    .result-detail code {
      font-size: 0.75rem;
      background: rgba(15, 23, 42, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      color: #0f172a;
      word-break: break-all;
    }

    .result-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      margin-top: 0.85rem;
      padding: 0.65rem 1.5rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }
    .result-action.primary {
      background: #16a34a;
      color: #fff;
    }
    .result-action.primary:hover {
      background: #15803d;
      color: #fff;
      transform: translateY(-1px);
    }

    /* ============================================================
       LOADING
       ============================================================ */
    .loading-state {
      text-align: center;
      padding: 2rem 0;
    }
    .loading-state .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(37, 99, 235, 0.15);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    .loading-state p {
      font-size: 0.9rem;
      color: #64748b;
      margin: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ============================================================
       EMPTY STATE
       ============================================================ */
    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
    }
    .empty-state .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #eff6ff;
      color: #2563eb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .empty-state h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    .empty-state p {
      font-size: 0.85rem;
      color: #64748b;
      max-width: 340px;
      margin: 0 auto 1.25rem;
      line-height: 1.5;
    }
    .empty-state .btn-manual {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #2563eb;
      color: #fff;
      padding: 0.6rem 1.5rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      border: none;
    }
    .empty-state .btn-manual:hover {
      background: #1e4bb3;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
    }

    /* ============================================================
       FOOTER
       ============================================================ */
    .footer-links {
      margin-top: 1.5rem;
      text-align: center;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.2s;
    }
    .footer-links a {
      text-decoration: none;
      color: #64748b;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      transition: all 0.2s;
    }
    .footer-links a:hover {
      color: #2563eb;
      background: rgba(37, 99, 235, 0.06);
    }

    /* ============================================================
       ANIMATIONS
       ============================================================ */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 576px) {
      body { padding: 1rem 0.75rem; }
      .verify-card {
        padding: 1.5rem 1.25rem;
        border-radius: 20px;
      }
      .brand-header img { height: 52px; }
      .brand-header h1 { font-size: 1.15rem; }
      .result-detail {
        padding: 0.7rem 0.85rem;
        font-size: 0.8rem;
      }
      .ttd-preview img {
        max-width: 140px;
        max-height: 140px;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       BRAND HEADER
       ============================================================ -->
  <div class="brand-header">
    <!-- ✅ v26.1.8 GITHUB PAGES: /bisaa/LOGOANSOR.webp -->
    <img src="/bisaa/LOGOANSOR.webp" alt="GP Ansor">
    <h1>
      <i class="bi bi-vector-pen" aria-hidden="true"></i>
      Verifikasi TTD Digital
    </h1>
    <p>PKD GP Ansor Kabupaten Bantul</p>
  </div>

  <!-- ============================================================
       VERIFY CARD
       ============================================================ -->
  <div class="verify-card">

    <!-- Loading (default) -->
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>Memproses verifikasi…</p>
    </div>

    <!-- Result area -->
    <div id="resultArea" aria-live="polite" aria-atomic="true" style="display:none;"></div>

  </div>

  <!-- ============================================================
       FOOTER LINKS
       ============================================================ -->
  <div class="footer-links">
    <!-- ✅ v26.1.8 GITHUB PAGES: /bisaa/index.html -->
    <a href="/bisaa/index.html">
      <i class="bi bi-arrow-left"></i>
      Kembali ke Beranda
    </a>
  </div>

  <!-- ============================================================
       SCRIPTS
       ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    // ============================================================
    //   IMPORTS (v26.1.8 GITHUB PAGES: /bisaa/js/core/api.js)
    // ============================================================
    import { callApi, escapeHtml } from '/bisaa/js/core/api.js';

    // ============================================================
    //   CONSTANTS
    // ============================================================
    const ROLE_LABELS = {
      ketua_pc: 'Ketua PC',
      sekretaris: 'Sekretaris',
      instruktur: 'Instruktur',
    };

    // ============================================================
    //   DOM REFS
    // ============================================================
    const loadingStateEl = document.getElementById('loadingState');
    const resultAreaEl   = document.getElementById('resultArea');

    // ============================================================
    //   STATE
    // ============================================================
    let isVerifying = false;

    // ============================================================
    //   RENDER HELPERS
    // ============================================================
    function showResult() {
      loadingStateEl.style.display = 'none';
      resultAreaEl.style.display = 'block';
    }

    function renderSuccess(data, role, driveId) {
      const roleLabel = ROLE_LABELS[role] || role || 'Penanda Tangan';
      const nama = escapeHtml(data.nama || '-');
      const pesertaNama = escapeHtml(data.peserta_nama || '-');
      const kegunaan = escapeHtml(data.kegunaan || 'Verifikasi Sertifikat PKD');
      const ttdUrl = `https://drive.google.com/thumbnail?id=${encodeURIComponent(driveId)}&sz=w400`;
      const openUrl = `https://drive.google.com/file/d/${encodeURIComponent(driveId)}/view`;

      let tanggal = '-';
      if (data.timestamp) {
        try {
          const d = new Date(data.timestamp);
          if (!isNaN(d.getTime())) {
            tanggal = d.toLocaleString('id-ID', {
              day: '2-digit', month: 'long', year: 'numeric',
              hour: '2-digit', minute: '2-digit',
            });
          }
        } catch (e) { /* silent */ }
      }

      resultAreaEl.innerHTML = `
        <div class="result-box success">
          <div class="result-title">
            <i class="bi bi-patch-check-fill"></i>
            Tanda Tangan Valid
          </div>
          <p class="mb-2 small">
            Tanda tangan digital ini terdaftar dan sah sebagai bagian dari
            dokumen resmi PKD GP Ansor Kabupaten Bantul.
          </p>
          <span class="role-badge">${escapeHtml(roleLabel)}</span>

          <div class="ttd-preview mt-2">
            <img src="${ttdUrl}" alt="Tanda tangan ${nama}"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
            <div class="no-preview" style="display:none;">
              <i class="bi bi-eye-slash fs-3 mb-2"></i>
              Preview tidak tersedia
            </div>
          </div>

          <div class="result-detail">
            <div class="row-line">
              <span class="label">Penanda Tangan</span>
              <span class="value">${nama}</span>
            </div>
            <div class="row-line">
              <span class="label">Role</span>
              <span class="value">${escapeHtml(roleLabel)}</span>
            </div>
            <div class="row-line">
              <span class="label">Untuk Peserta</span>
              <span class="value">${pesertaNama}</span>
            </div>
            <div class="row-line">
              <span class="label">Kegunaan</span>
              <span class="value">${kegunaan}</span>
            </div>
            <div class="row-line">
              <span class="label">Tanggal</span>
              <span class="value">${escapeHtml(tanggal)}</span>
            </div>
            <div class="row-line">
              <span class="label">Drive ID</span>
              <span class="value"><code>${escapeHtml(driveId)}</code></span>
            </div>
          </div>

          <a href="${openUrl}" target="_blank" rel="noopener noreferrer" class="result-action primary">
            <i class="bi bi-box-arrow-up-right"></i> Buka TTD Asli
          </a>
        </div>
      `;
      showResult();
    }

    function renderNotFound(roleLabel) {
      resultAreaEl.innerHTML = `
        <div class="result-box danger">
          <div class="result-title">
            <i class="bi bi-x-circle-fill"></i>
            Tanda Tangan Tidak Valid
          </div>
          <p class="mb-0 small">
            Data tanda tangan digital ${roleLabel ? `<strong>${escapeHtml(roleLabel)}</strong>` : ''}
            tidak terdaftar di sistem kami. Pastikan QR code berasal dari
            dokumen resmi PKD GP Ansor Bantul.
          </p>
        </div>
      `;
      showResult();
    }

    function renderError(message) {
      resultAreaEl.innerHTML = `
        <div class="result-box warning">
          <div class="result-title">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Gagal Memverifikasi
          </div>
          <p class="mb-0 small">${escapeHtml(message || 'Terjadi kesalahan saat memverifikasi.')}</p>
        </div>
      `;
      showResult();
    }

    function renderEmptyState() {
      resultAreaEl.innerHTML = `
        <div class="empty-state">
          <div class="icon-wrap">
            <i class="bi bi-vector-pen"></i>
          </div>
          <h3>Scan QR Tanda Tangan</h3>
          <p>
            QR code pada dokumen tidak memuat data tanda tangan digital yang valid.
            Silakan scan ulang QR code dari dokumen resmi PKD.
          </p>
          <!-- ✅ v26.1.8 GITHUB PAGES: /bisaa/index.html -->
          <a href="/bisaa/index.html" class="btn-manual">
            <i class="bi bi-house-door"></i>
            Kembali ke Beranda
          </a>
        </div>
      `;
      showResult();
    }

    // ============================================================
    //   VERIFY LOGIC
    // ============================================================
    async function verifySignature(role, driveId) {
      if (isVerifying) return;
      isVerifying = true;

      try {
        const res = await callApi('getAllDigitalApprovals', {}, 'GET');
        const list = (res && res.data) ? res.data : (Array.isArray(res) ? res : []);

        if (!Array.isArray(list) || list.length === 0) {
          renderNotFound(ROLE_LABELS[role] || role);
          return;
        }

        const cleanRole = String(role || '').toLowerCase().trim();
        const cleanDriveId = String(driveId || '').trim();

        const found = list.find(a => {
          const rowRole = String(a.role || '').toLowerCase().trim();
          const rowDrive = String(a.driveId || '').trim();
          return rowRole === cleanRole && rowDrive === cleanDriveId;
        });

        if (found) {
          renderSuccess(found, role, driveId);
        } else {
          renderNotFound(ROLE_LABELS[role] || role);
        }
      } catch (e) {
        console.error('[VerifikasiSignature] error:', e);
        renderError(e.message || 'Network error. Coba lagi.');
      } finally {
        isVerifying = false;
      }
    }

    // ============================================================
    //   MAIN: Parse query string
    // ============================================================
    (function main() {
      let params;
      try {
        params = new URLSearchParams(window.location.search);
      } catch (e) {
        renderError('URL tidak valid.');
        return;
      }

      const role = params.get('role');
      const driveId = params.get('driveId');
      // Fallback alternatif nama param
      const altDriveId = params.get('driveid') || params.get('id');

      const finalDriveId = driveId || altDriveId;

      if (!role || !finalDriveId) {
        console.log('[VerifikasiSignature] Parameter tidak lengkap:', { role, driveId: finalDriveId });
        renderEmptyState();
        return;
      }

      console.log('[VerifikasiSignature] Verifying:', { role, driveId: finalDriveId });
      verifySignature(role, finalDriveId);
    })();

    // ============================================================
    //   CONSOLE BANNER
    // ============================================================
    console.log(
      '%c Verifikasi TTD Digital v26.1.8 — GitHub Pages /bisaa/ Edition ',
      'background:#2563eb;color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;'
    );
  </script>

</body>
</html>
