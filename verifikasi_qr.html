<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Verifikasi Sertifikat · PKD GP Ansor Bantul</title>

    <!-- Favicon & Font -->
    <link rel="icon" type="image/png" href="/bisaa/LOGO%20ANSOR.webp">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* ===== UNIVERSAL PREMIUM (GLASSMORPHISM) ===== */
        * { font-family: 'Inter', system-ui, sans-serif; }
        body {
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER MINIMALIS ELEGAN --- */
        .header-minimal {
            background: rgba(255, 255, 255, 0.72) !important;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 1030;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.04);
            padding-top: 0 !important;
            padding-bottom: 0 !important;
        }
        .header-minimal .container { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .brand-logo-mini { height: 40px; width: auto; margin-right: 14px; transition: transform 0.2s; }
        .brand-logo-mini:hover { transform: scale(1.05); }
        .brand-title-mini { font-weight: 700; color: #0a3d62; font-size: 1.3rem; line-height: 1.2; letter-spacing: -0.02em; }
        .brand-sub-mini { font-size: 0.8rem; color: #64748b; display: block; margin-top: 0px; letter-spacing: 0.02em; }
        #navbarUserMenu { display: flex; align-items: center; gap: 8px; }
        .user-menu-area .dropdown-toggle { border-radius: 50px; padding: 0.3rem 1rem; font-size: 0.9rem; }
        .user-menu-area .btn-outline-primary { border-radius: 50px; padding: 0.3rem 1.2rem; font-size: 0.9rem; }

        /* --- GLASS CARD --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 2rem;
            max-width: 800px;
            margin: 2rem auto;
        }
        .glass-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(37, 99, 235, 0.08);
            border-color: rgba(37, 99, 235, 0.2);
        }

        .section-title {
            font-weight: 650; font-size: 1.75rem; margin-bottom: 1.5rem;
            border-left: 6px solid #2563eb; padding-left: 1.2rem;
        }

        /* --- RESULT CARD --- */
        .result-card {
            background: #f0fdf4;
            border-left: 6px solid #22c55e;
            border-radius: 20px;
            padding: 1.5rem;
            display: none;
            animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .result-card.danger {
            background: #fef2f2;
            border-left-color: #ef4444;
        }
        .result-card .badge-valid { background: #22c55e; color: white; padding: 6px 20px; border-radius: 50px; font-size: 0.9rem; display: inline-block; margin-bottom: 1rem; }
        .result-row { display: flex; flex-wrap: wrap; gap: 1.5rem; }
        .result-item { flex: 1; min-width: 200px; }
        .result-item strong { display: block; font-size: 0.85rem; color: #475569; margin-bottom: 4px; }
        .result-item span { font-weight: 600; font-size: 1rem; color: #0f172a; }

        /* --- SKELETON LOADING --- */
        .skeleton-box {
            background: #e2e8f0;
            border-radius: 8px;
            animation: pulse 1.5s infinite ease-in-out;
            display: inline-block;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
        .loading-state {
            text-align: center;
            padding: 2rem 1rem;
        }
        .loading-state .spinner-border { width: 3rem; height: 3rem; color: #2563eb; }

        /* --- FOOTER --- */
        .footer-modern {
            font-size: 0.85rem; color: #64748b; margin-top: auto; text-align: center;
            padding: 1.5rem 0; border-top: 1px solid #e2e8f0; background: white;
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 576px) {
            .glass-card { border-radius: 16px; padding: 1.5rem !important; }
            .header-minimal .container { padding: 0 0.5rem; }
            .brand-title-mini { display: none; }
            .brand-sub-mini { display: none; }
            .section-title { font-size: 1.3rem; }
            .result-row { flex-direction: column; gap: 0.5rem; }
        }

        /* --- ANIMASI --- */
        .fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .delay-1 { animation-delay: 0.05s; }
    </style>
</head>
<body>

<!-- HEADER -->
<header class="header-minimal sticky-top shadow-sm">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <div class="d-flex align-items-center gap-2">
            <a href="/bisaa/index.html" class="btn btn-back rounded-pill">
                <i class="bi bi-arrow-left me-1"></i> Kembali
            </a>
            <a href="/bisaa/index.html" class="brand-minimal text-decoration-none d-flex align-items-center ms-1">
                <img src="/bisaa/LOGO%20ANSOR.webp" alt="GP Ansor" class="brand-logo-mini">
                <div>
                    <div class="brand-title-mini">PKD GP Ansor</div>
                    <span class="brand-sub-mini">Kabupaten Bantul</span>
                </div>
            </a>
        </div>
        <div id="navbarUserMenu" class="user-menu-area"></div>
    </div>
</header>

<!-- CONTENT -->
<div class="container">
    <div class="glass-card fade-up">
        <div class="d-flex align-items-center gap-2 mb-3">
            <i class="bi bi-shield-check-fill text-success fs-4"></i>
            <h2 class="section-title mb-0">Verifikasi Sertifikat</h2>
        </div>

        <!-- Loading State (skeleton) -->
        <div id="loadingIndicator" class="loading-state" style="display:block;">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Memverifikasi...</span>
            </div>
            <p class="mt-2 text-muted">Sedang memverifikasi data sertifikat...</p>
        </div>

        <!-- Result Content -->
        <div id="resultContainer" class="result-card" style="display:none;">
            <div class="badge-valid"><i class="bi bi-check-circle-fill me-1"></i> Sertifikat VALID</div>
            <hr class="my-3">
            <div id="resultContent" class="result-row">
                <!-- Akan diisi oleh JS -->
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="/bisaa/index.html" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="bi bi-arrow-left me-1"></i> Kembali
            </a>
        </div>
    </div>
</div>

<footer class="footer-modern container">
    <div class="container"><i class="bi bi-c-circle"></i> Hak Cipta 2026 - Tim Instruktur GP Ansor Kabupaten Bantul</div>
</footer>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    // ==========================================================
    //   IMPOR DARI CORE API
    // ==========================================================
    import {
        callApi,
        getAllDigitalApprovals,
        verifyCertificate,
        getPKDLokasi,
        escapeHtml,
        updateNavbarMenu
    } from './js/core/api.js';

    // ==========================================================
    //   FUNGSI BANTU
    // ==========================================================
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    function formatDate(dateStr) {
        if (!dateStr) return '-';
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return '-';
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    function getRoleLabel(role) {
        const labels = {
            'ketua_pc': 'Ketua PC GP Ansor Kabupaten Bantul',
            'sekretaris': 'Sekretaris PC GP Ansor Kabupaten Bantul',
            'instruktur': 'Instruktur PKD GP Ansor Kabupaten Bantul'
        };
        return labels[role] || role;
    }

    // ==========================================================
    //   VERIFIKASI UTAMA
    // ==========================================================
    async function verifyApproval() {
        const nomor = getQueryParam('nomor');
        const role = getQueryParam('role');
        const driveId = getQueryParam('driveId');
        const namaTtd = getQueryParam('nama');
        const pesertaId = getQueryParam('peserta_id');

        const loading = document.getElementById('loadingIndicator');
        const resultContainer = document.getElementById('resultContainer');
        const resultContent = document.getElementById('resultContent');

        let approvalsToDisplay = [];
        let pesertaNama = '';
        let certData = null;

        if (!nomor && !role) {
            // Tidak ada parameter, tampilkan error
            loading.style.display = 'none';
            resultContainer.style.display = 'block';
            resultContainer.className = 'result-card danger';
            resultContent.innerHTML = `
                <div class="text-danger text-center w-100">
                    <i class="bi bi-exclamation-circle-fill fs-2"></i>
                    <h5 class="mt-2">Parameter tidak lengkap</h5>
                    <p class="small">Silakan scan QR yang benar.</p>
                </div>
            `;
            return;
        }

        try {
            // 1. Dapatkan nama peserta dari ID (jika ada)
            if (pesertaId) {
                const pesertaRes = await callApi('getPesertaById', { id: pesertaId }, 'GET');
                if (pesertaRes.success && pesertaRes.data && pesertaRes.data.nama_lengkap) {
                    pesertaNama = pesertaRes.data.nama_lengkap;
                }
            }

            // 2. Ambil semua approvals dari sheet DigitalApprovals
            const approvalsRes = await getAllDigitalApprovals();
            let approvals = approvalsRes.success ? approvalsRes.data || [] : [];

            // 3. Kasus 1: Verifikasi berdasarkan nomor sertifikat
            if (nomor) {
                const certRes = await verifyCertificate(nomor);
                if (certRes.success && certRes.data) {
                    certData = certRes.data;
                    if (!pesertaNama) pesertaNama = certData.nama_peserta;
                }
                approvalsToDisplay = approvals.filter(a => 
                    a.peserta_nama && 
                    a.peserta_nama.toLowerCase() === (pesertaNama || '').toLowerCase()
                );
            } 
            // 4. Kasus 2: Verifikasi berdasarkan QR dari TTD (role, driveId, peserta_id)
            else if (role) {
                // PRIORITAS UTAMA: Jika kita punya nama peserta, gunakan untuk mencari approval
                if (pesertaNama) {
                    approvalsToDisplay = approvals.filter(a => 
                        a.role === role && 
                        a.peserta_nama && 
                        a.peserta_nama.toLowerCase().trim() === pesertaNama.toLowerCase().trim()
                    );
                }
                // FALLBACK: Jika tidak ditemukan (atau tidak ada nama peserta), gunakan driveId
                if (approvalsToDisplay.length === 0) {
                    const byDrive = approvals.find(a => a.role === role && a.driveId === driveId);
                    if (byDrive) approvalsToDisplay = [byDrive];
                }
            }

            // 5. Jika masih tidak ada approval, tampilkan pesan
            if (approvalsToDisplay.length === 0) {
                loading.style.display = 'none';
                resultContainer.style.display = 'block';
                if (role) {
                    const roleLabels = { 'ketua_pc': 'Ketua PC', 'sekretaris': 'Sekretaris', 'instruktur': 'Instruktur' };
                    resultContainer.className = 'result-card danger';
                    resultContent.innerHTML = `
                        <div class="text-danger text-center w-100">
                            <i class="bi bi-exclamation-circle-fill fs-2"></i>
                            <h5 class="mt-2">Persetujuan tidak ditemukan</h5>
                            <p class="small">Persetujuan untuk <strong>${roleLabels[role] || role}</strong> tidak ditemukan atau QR tidak valid.</p>
                        </div>
                    `;
                } else {
                    resultContainer.className = 'result-card danger';
                    resultContent.innerHTML = `
                        <div class="text-danger text-center w-100">
                            <i class="bi bi-exclamation-circle-fill fs-2"></i>
                            <h5 class="mt-2">Sertifikat tidak ditemukan</h5>
                            <p class="small">Sertifikat dengan nomor <strong>${escapeHtml(nomor)}</strong> tidak ditemukan.</p>
                        </div>
                    `;
                }
                return;
            }

            // 6. Cari data sertifikat dari sheet SertifikatGenerated
            let lokasiPKD = 'Kabupaten Bantul';
            if (pesertaNama || pesertaId) {
                try {
                    const rawResponse = await callApi('getUploadedCertificates', {}, 'GET');
                    let certList = [];
                    if (Array.isArray(rawResponse)) {
                        certList = rawResponse;
                    } else if (rawResponse && typeof rawResponse === 'object' && Array.isArray(rawResponse.data)) {
                        certList = rawResponse.data;
                    }

                    let foundItem = null;
                    // Cari berdasarkan ID peserta terlebih dahulu
                    if (pesertaId) {
                        const normalizeId = (id) => String(id || '').trim();
                        const pId = normalizeId(pesertaId);
                        for (let i = 0; i < certList.length; i++) {
                            const c = certList[i];
                            const cId = normalizeId(c.peserta_id);
                            if (cId === pId) {
                                foundItem = c;
                                break;
                            }
                        }
                    }
                    // Jika tidak ketemu, cari berdasarkan nama
                    if (!foundItem && pesertaNama) {
                        const normalizeName = (name) => (name || '').trim().toLowerCase().replace(/\s+/g, ' ');
                        const pName = normalizeName(pesertaNama);
                        for (let i = 0; i < certList.length; i++) {
                            const c = certList[i];
                            const cName = normalizeName(c.nama_peserta);
                            if (cName === pName) {
                                foundItem = c;
                                break;
                            }
                        }
                    }

                    if (foundItem) {
                        certData = foundItem;
                        if (certData.lokasi && certData.lokasi !== 'Kabupaten Bantul') {
                            lokasiPKD = certData.lokasi;
                        }
                    }
                } catch (e) {
                    console.warn('Gagal mencari data sertifikat:', e);
                }
            }

            // Jika lokasi masih default, ambil dari pengaturan
            if (lokasiPKD === 'Kabupaten Bantul') {
                try {
                    const lokasiRes = await getPKDLokasi();
                    if (lokasiRes.success && lokasiRes.data) lokasiPKD = lokasiRes.data;
                } catch (e) {}
            }

            // 7. Render hasil (sukses)
            loading.style.display = 'none';
            resultContainer.style.display = 'block';
            resultContainer.className = 'result-card';

            let html = `
                <div class="result-item w-100">
                    <strong>Nomor Sertifikat</strong>
                    <span>${certData ? escapeHtml(certData.nomor_sertifikat) : '-'}</span>
                    ${!certData ? `<br><small class="text-warning">* Data sertifikat belum digenerate Admin</small>` : ''}
                </div>
                <div class="result-item">
                    <strong>Nama Peserta</strong>
                    <span>${escapeHtml(pesertaNama || '-')}</span>
                </div>
                <div class="result-item">
                    <strong>Lokasi PKD</strong>
                    <span>${escapeHtml(lokasiPKD)}</span>
                </div>
                <div class="result-item">
                    <strong>Tanggal Penerbitan</strong>
                    <span>${certData ? formatDate(certData.createdAt) : '-'}</span>
                    ${!certData ? `<br><small class="text-warning">* Menunggu penerbitan Admin</small>` : ''}
                </div>
                <div class="w-100 mt-2">
                    <hr>
                    <p class="mb-0 text-success fw-bold">🎉 Selamat bergabung! 🎉</p>
                    <p class="small">Dinyatakan <strong>LULUS</strong> dalam Pelatihan Kaderisasi Dasar (PKD) Pimpinan Cabang Gerakan Pemuda Ansor Kabupaten Bantul.</p>
                    <hr>
                    <h6 class="fw-bold mt-3"><i class="bi bi-pencil-square me-2"></i>Persetujuan Digital</h6>
                    <p class="small text-muted">Dokumen ini telah disetujui secara digital oleh:</p>
            `;
            approvalsToDisplay.forEach(a => {
                html += `<div class="mt-1"><span class="badge bg-light text-dark">${getRoleLabel(a.role)}</span> ${escapeHtml(a.nama)} ${a.kegunaan ? `<small class="text-muted">(${escapeHtml(a.kegunaan)})</small>` : ''}</div>`;
            });
            html += `
                    <div class="text-center mt-3">
                        ${certData && certData.pdf_url ? `<a href="${escapeHtml(certData.pdf_url)}" target="_blank" class="btn btn-sm btn-outline-success rounded-pill px-3">Lihat Sertifikat PDF</a>` : ''}
                    </div>
                </div>
            `;
            resultContent.innerHTML = html;

        } catch (err) {
            loading.style.display = 'none';
            resultContainer.style.display = 'block';
            resultContainer.className = 'result-card danger';
            resultContent.innerHTML = `
                <div class="text-danger text-center w-100">
                    <i class="bi bi-exclamation-circle-fill fs-2"></i>
                    <h5 class="mt-2">Terjadi Kesalahan</h5>
                    <p class="small">${escapeHtml(err.message)}</p>
                </div>
            `;
        }
    }

    // ==========================================================
    //   BOOT
    // ==========================================================
    (function boot() {
        // Update navbar user
        updateNavbarMenu();

        // Jalankan verifikasi
        verifyApproval();
    })();
</script>
</body>
</html>
