<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Verifikasi QR sertifikat PKD GP Ansor Kabupaten Bantul">
  <meta name="robots" content="noindex, nofollow">

  <title>Verifikasi QR · PKD GP Ansor Bantul</title>

  <link rel="icon" type="image/webp" href="/bisaa/LOGOANSOR.webp">
  <link rel="apple-touch-icon" href="/bisaa/LOGOANSOR.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* BRAND HEADER */
    .brand-header {
      text-align: center;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .brand-header img {
      height: 64px;
      margin-bottom: 0.75rem;
    }
    .brand-header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.25rem;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .brand-header h1 i {
      color: #2563eb;
      font-size: 1.5rem;
    }
    .brand-header p {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 0;
    }

    /* VERIFY CARD */
    .verify-card {
      max-width: 560px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 2rem 1.75rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
      border: 1px solid #e2e8f0;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.1s;
    }

    /* RESULT BOX */
    .result-box {
      border-radius: 16px;
      padding: 1.25rem;
      border: none;
      animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .result-box.success {
      background: #dcfce7;
      border-left: 5px solid #16a34a;
      color: #166534;
    }
    .result-box.danger {
      background: #fee2e2;
      border-left: 5px solid #dc2626;
      color: #991b1b;
    }
    .result-box.warning {
      background: #fef3c7;
      border-left: 5px solid #f59e0b;
      color: #92400e;
    }
    .result-box.info {
      background: #cffafe;
      border-left: 5px solid #0891b2;
      color: #155e75;
    }

    .result-box .result-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .result-box .result-title i {
      font-size: 1.4rem;
    }

    .result-detail {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-top: 0.85rem;
      font-size: 0.875rem;
    }
    .result-detail .row-line {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    .result-detail .row-line:last-child {
      border-bottom: none;
    }
    .result-detail .label {
      color: #64748b;
      font-weight: 500;
      flex-shrink: 0;
    }
    .result-detail .value {
      font-weight: 600;
      text-align: right;
      word-break: break-word;
      color: #0f172a;
    }
    .result-detail code {
      font-size: 0.8rem;
      background: rgba(15, 23, 42, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      color: #0f172a;
    }

    .result-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      margin-top: 0.85rem;
      padding: 0.65rem 1.5rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }
    .result-action.primary {
      background: #16a34a;
      color: #fff;
    }
    .result-action.primary:hover {
      background: #15803d;
      color: #fff;
      transform: translateY(-1px);
    }

    /* LOADING */
    .loading-state {
      text-align: center;
      padding: 2rem 0;
    }
    .loading-state .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(37, 99, 235, 0.15);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    .loading-state p {
      font-size: 0.9rem;
      color: #64748b;
      margin: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
    }
    .empty-state .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #eff6ff;
      color: #2563eb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    .empty-state h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    .empty-state p {
      font-size: 0.85rem;
      color: #64748b;
      max-width: 340px;
      margin: 0 auto 1.25rem;
      line-height: 1.5;
    }
    .empty-state .btn-manual {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #2563eb;
      color: #fff;
      padding: 0.6rem 1.5rem;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
      border: none;
    }
    .empty-state .btn-manual:hover {
      background: #1e4bb3;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
    }

    /* FOOTER */
    .footer-links {
      margin-top: 1.5rem;
      text-align: center;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.2s;
    }
    .footer-links a {
      text-decoration: none;
      color: #64748b;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      transition: all 0.2s;
    }
    .footer-links a:hover {
      color: #2563eb;
      background: rgba(37, 99, 235, 0.06);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 576px) {
      body { padding: 1rem 0.75rem; }
      .verify-card {
        padding: 1.5rem 1.25rem;
        border-radius: 20px;
      }
      .brand-header img { height: 52px; }
      .brand-header h1 { font-size: 1.15rem; }
      .result-detail {
        padding: 0.7rem 0.85rem;
        font-size: 0.8rem;
      }
      .empty-state .icon-wrap {
        width: 60px;
        height: 60px;
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="brand-header">
    <img src="/bisaa/LOGOANSOR.webp" alt="GP Ansor">
    <h1>
      <i class="bi bi-qr-code-scan" aria-hidden="true"></i>
      Verifikasi QR
    </h1>
    <p>PKD GP Ansor Kabupaten Bantul</p>
  </div>

  <div class="verify-card">

    <!-- Loading (default) -->
    <div id="loadingState" class="loading-state">
      <div class="spinner"></div>
      <p>Memproses verifikasi…</p>
    </div>

    <!-- Result area -->
    <div id="resultArea" aria-live="polite" aria-atomic="true" style="display:none;"></div>

  </div>

  <div class="footer-links">
    <a href="/bisaa/index.html">
      <i class="bi bi-arrow-left"></i>
      Kembali ke Beranda
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    // ============================================================
    //   verifikasi_qr.html v28.4.0 — FULL FIX
    // ============================================================

    import { callApi, escapeHtml } from '/bisaa/js/core/api.js';

    // ============================================================
    //   DOM REFS
    // ============================================================
    const loadingStateEl = document.getElementById('loadingState');
    const resultAreaEl   = document.getElementById('resultArea');

    // ============================================================
    //   STATE
    // ============================================================
    let isVerifying = false;

    // ============================================================
    //   RENDER HELPERS
    // ============================================================
    function showResult() {
      loadingStateEl.style.display = 'none';
      resultAreaEl.style.display = 'block';
    }

    function renderSuccess(data) {
      const nama = escapeHtml(data.nama_peserta || '-');
      const nomor = escapeHtml(data.nomor_sertifikat || '-');
      const lokasi = escapeHtml(data.lokasi || 'Kabupaten Bantul');
      const tanggal = data.createdAt
        ? new Date(data.createdAt).toLocaleDateString('id-ID', {
            day: '2-digit', month: 'long', year: 'numeric'
          })
        : '-';
      const pdfUrl = data.pdf_url ? escapeHtml(data.pdf_url) : '';

      resultAreaEl.innerHTML = `
        <div class="result-box success">
          <div class="result-title">
            <i class="bi bi-patch-check-fill"></i>
            Sertifikat Valid
          </div>
          <p class="mb-0 small">Sertifikat ini terdaftar dan sah dikeluarkan oleh PKD GP Ansor Kabupaten Bantul.</p>

          <div class="result-detail">
            <div class="row-line">
              <span class="label">Nama Peserta</span>
              <span class="value">${nama}</span>
            </div>
            <div class="row-line">
              <span class="label">Nomor Sertifikat</span>
              <span class="value"><code>${nomor}</code></span>
            </div>
            <div class="row-line">
              <span class="label">Lokasi PKD</span>
              <span class="value">${lokasi}</span>
            </div>
            <div class="row-line">
              <span class="label">Tanggal Terbit</span>
              <span class="value">${escapeHtml(tanggal)}</span>
            </div>
          </div>

          ${pdfUrl ? `
            <a href="${pdfUrl}" target="_blank" rel="noopener noreferrer" class="result-action primary">
              <i class="bi bi-download"></i> Unduh Sertifikat PDF
            </a>
          ` : ''}
        </div>
      `;
      showResult();
    }

    function renderNotFound(nomor) {
      resultAreaEl.innerHTML = `
        <div class="result-box danger">
          <div class="result-title">
            <i class="bi bi-x-circle-fill"></i>
            Sertifikat Tidak Ditemukan
          </div>
          <p class="mb-0 small">
            Nomor <strong><code>${escapeHtml(nomor)}</code></strong> tidak terdaftar
            di sistem kami. Periksa kembali atau hubungi panitia PKD.
          </p>
        </div>
      `;
      showResult();
    }

    function renderError(message) {
      resultAreaEl.innerHTML = `
        <div class="result-box warning">
          <div class="result-title">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Gagal Memverifikasi
          </div>
          <p class="mb-0 small">${escapeHtml(message || 'Terjadi kesalahan saat memverifikasi.')}</p>
        </div>
      `;
      showResult();
    }

    function renderEmptyState(params) {
      const hasNama = params.get('nama');
      const nomorHint = hasNama
        ? `Verifikasi untuk <strong>${escapeHtml(hasNama)}</strong> memerlukan nomor sertifikat.`
        : 'QR code tidak memuat data sertifikat yang valid.';

      resultAreaEl.innerHTML = `
        <div class="empty-state">
          <div class="icon-wrap">
            <i class="bi bi-qr-code"></i>
          </div>
          <h3>Scan QR Code Sertifikat</h3>
          <p>
            ${nomorHint}<br><br>
            Silakan scan ulang QR code di sertifikat, atau verifikasi
            manual dengan memasukkan nomor sertifikat.
          </p>
          <a href="/bisaa/verifikasi.html" class="btn-manual">
            <i class="bi bi-keyboard"></i>
            Verifikasi Manual
          </a>
        </div>
      `;
      showResult();
    }

    // ============================================================
    //   VERIFY LOGIC
    // ============================================================
    async function verifyByNomor(nomor) {
      if (isVerifying) return;
      isVerifying = true;

      try {
        const res = await callApi('verifyCertificate', { nomor: nomor.trim() }, 'GET');

        if (res && res.success === true) {
          if (res.data && res.data.nomor_sertifikat) {
            renderSuccess(res.data);
          } else {
            renderNotFound(nomor);
          }
        } else {
          renderError((res && res.error) || 'Respons tidak valid dari server.');
        }
      } catch (e) {
        console.error('[VerifikasiQR] error:', e);
        renderError(e.message || 'Network error. Coba lagi.');
      } finally {
        isVerifying = false;
      }
    }

    // ============================================================
    //   MAIN: Parse query string & verify
    // ============================================================
    (async function main() {
      let params;
      try {
        params = new URLSearchParams(window.location.search);
      } catch (e) {
        renderError('URL tidak valid.');
        return;
      }

      const nomor = params.get('nomor');
      const id    = params.get('id');       // fallback: peserta ID
      const nama  = params.get('nama');     // fallback: nama peserta

      // Priority 1: verify by nomor
      if (nomor) {
        console.log('[VerifikasiQR] Nomor ditemukan:', nomor);
        return verifyByNomor(nomor);
      }

      // Priority 2: verify by ID (lookup dulu via getUploadedCertificates)
      if (id) {
        console.log('[VerifikasiQR] ID peserta ditemukan:', id);
        isVerifying = true;
        try {
          const res = await callApi('getUploadedCertificates', {}, 'GET');
          const list = (res && res.data) ? res.data : (Array.isArray(res) ? res : []);
          const found = list.find(c => String(c.peserta_id) === String(id));
          if (found && found.nomor_sertifikat) {
            isVerifying = false;
            return verifyByNomor(found.nomor_sertifikat);
          }
          isVerifying = false;
          renderNotFound('Peserta ID: ' + id);
        } catch (e) {
          isVerifying = false;
          renderError('Gagal mencari sertifikat: ' + e.message);
        }
        return;
      }

      // Priority 3: nama only — show empty state
      if (nama) {
        console.log('[VerifikasiQR] Hanya nama, tidak bisa auto-verify:', nama);
        return renderEmptyState(params);
      }

      // No params at all
      console.log('[VerifikasiQR] Tidak ada parameter verifikasi di URL');
      return renderEmptyState(params);
    })();

    console.log(
      '%c verifikasi_qr.html v28.4.0 — Full Fix ',
      'background:#2563eb;color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;'
    );
  </script>

</body>
</html>
