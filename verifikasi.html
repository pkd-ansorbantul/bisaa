<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Verifikasi keaslian sertifikat PKD GP Ansor Kabupaten Bantul">
  <meta name="robots" content="noindex, nofollow">

  <title>Verifikasi Sertifikat · PKD GP Ansor Bantul</title>

  <link rel="icon" type="image/webp" href="/bisaa/LOGOANSOR.webp">
  <link rel="apple-touch-icon" href="/bisaa/LOGOANSOR.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    /* BRAND HEADER */
    .brand-header {
      text-align: center;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .brand-header img {
      height: 64px;
      margin-bottom: 0.75rem;
    }
    .brand-header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.25rem;
      letter-spacing: -0.01em;
    }
    .brand-header p {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 0;
    }

    /* VERIFY CARD */
    .verify-card {
      max-width: 560px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 2rem 1.75rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
      border: 1px solid #e2e8f0;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.1s;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }

    .form-control {
      border-radius: 12px;
      border: 1.5px solid #e2e8f0;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      font-family: inherit;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
      outline: none;
    }
    .form-control::placeholder { color: #94a3b8; }

    .btn-verify {
      border-radius: 9999px;
      padding: 0.7rem 1.75rem;
      font-weight: 600;
      font-size: 0.95rem;
      background: linear-gradient(135deg, #2563eb, #1e4bb3);
      border: none;
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      margin-top: 0.25rem;
    }
    .btn-verify:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
      color: #fff;
    }
    .btn-verify:active:not(:disabled) {
      transform: translateY(0) scale(0.98);
    }
    .btn-verify:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none !important;
    }

    .result-area { margin-top: 1.25rem; }

    .result-box {
      border-radius: 16px;
      padding: 1.25rem;
      border: none;
      animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .result-box.success {
      background: #dcfce7;
      border-left: 5px solid #16a34a;
      color: #166534;
    }
    .result-box.danger {
      background: #fee2e2;
      border-left: 5px solid #dc2626;
      color: #991b1b;
    }
    .result-box.warning {
      background: #fef3c7;
      border-left: 5px solid #f59e0b;
      color: #92400e;
    }
    .result-box.info {
      background: #cffafe;
      border-left: 5px solid #0891b2;
      color: #155e75;
    }

    .result-box .result-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .result-box .result-title i { font-size: 1.4rem; }

    .result-detail {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-top: 0.85rem;
      font-size: 0.875rem;
    }
    .result-detail .row-line {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
    }
    .result-detail .row-line:last-child { border-bottom: none; }
    .result-detail .label {
      color: #64748b;
      font-weight: 500;
      flex-shrink: 0;
    }
    .result-detail .value {
      font-weight: 600;
      text-align: right;
      word-break: break-word;
      color: #0f172a;
    }
    .result-detail code {
      font-size: 0.8rem;
      background: rgba(15, 23, 42, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      color: #0f172a;
    }

    .result-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: 100%;
      margin-top: 0.85rem;
      padding: 0.65rem 1.5rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }
    .result-action.primary {
      background: #16a34a;
      color: #fff;
    }
    .result-action.primary:hover {
      background: #15803d;
      color: #fff;
      transform: translateY(-1px);
    }

    .loading-state {
      text-align: center;
      padding: 1.5rem 0;
    }
    .loading-state .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(37, 99, 235, 0.15);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 0.75rem;
    }
    .loading-state p {
      font-size: 0.85rem;
      color: #64748b;
      margin: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-links {
      margin-top: 1.5rem;
      text-align: center;
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 0.2s;
    }
    .footer-links a {
      text-decoration: none;
      color: #64748b;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      transition: all 0.2s;
    }
    .footer-links a:hover {
      color: #2563eb;
      background: rgba(37, 99, 235, 0.06);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 576px) {
      body { padding: 1rem 0.75rem; }
      .verify-card { padding: 1.5rem 1.25rem; border-radius: 20px; }
      .brand-header img { height: 52px; }
      .brand-header h1 { font-size: 1.15rem; }
      .result-detail {
        padding: 0.7rem 0.85rem;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="brand-header">
    <img src="/bisaa/LOGOANSOR.webp" alt="GP Ansor">
    <h1>Verifikasi Sertifikat</h1>
    <p>PKD GP Ansor Kabupaten Bantul</p>
  </div>

  <div class="verify-card">

    <form id="verifyForm" autocomplete="off" novalidate>
      <label class="form-label" for="nomorInput">
        <i class="bi bi-upc-scan me-1"></i> Nomor Sertifikat
      </label>
      <input
        type="text"
        class="form-control"
        id="nomorInput"
        name="nomor"
        placeholder="Contoh: 001/PC-XI/SR-01.PKD/I/2026"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
        required
        aria-label="Nomor Sertifikat"
      >
      <button type="submit" class="btn-verify mt-3" id="verifyBtn">
        <i class="bi bi-search me-1" id="verifyBtnIcon"></i>
        <span id="verifyBtnText">Verifikasi Sekarang</span>
      </button>
    </form>

    <div class="result-area" id="resultArea" aria-live="polite" aria-atomic="true"></div>

  </div>

  <div class="footer-links">
    <a href="/bisaa/index.html">
      <i class="bi bi-arrow-left"></i>
      Kembali ke Beranda
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    // ============================================================
    //   verifikasi.html v28.4.0 — FULL FIX
    // ============================================================

    import { callApi, escapeHtml } from '/bisaa/js/core/api.js';

    // ============================================================
    //   DOM REFS
    // ============================================================
    const formEl       = document.getElementById('verifyForm');
    const inputEl      = document.getElementById('nomorInput');
    const btnEl        = document.getElementById('verifyBtn');
    const btnIconEl    = document.getElementById('verifyBtnIcon');
    const btnTextEl    = document.getElementById('verifyBtnText');
    const resultAreaEl = document.getElementById('resultArea');

    let isVerifying = false;

    // ============================================================
    //   RENDER HELPERS
    // ============================================================
    function renderLoading() {
      resultAreaEl.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Memverifikasi sertifikat…</p>
        </div>
      `;
    }

    function renderSuccess(data) {
      const nama = escapeHtml(data.nama_peserta || '-');
      const nomor = escapeHtml(data.nomor_sertifikat || '-');
      const lokasi = escapeHtml(data.lokasi || 'Kabupaten Bantul');
      const tanggal = data.createdAt
        ? new Date(data.createdAt).toLocaleDateString('id-ID', {
            day: '2-digit', month: 'long', year: 'numeric'
          })
        : '-';
      const pdfUrl = data.pdf_url ? escapeHtml(data.pdf_url) : '';

      resultAreaEl.innerHTML = `
        <div class="result-box success">
          <div class="result-title">
            <i class="bi bi-patch-check-fill"></i>
            Sertifikat Valid
          </div>
          <p class="mb-0 small">Sertifikat ini terdaftar dan sah dikeluarkan oleh PKD GP Ansor Kabupaten Bantul.</p>

          <div class="result-detail">
            <div class="row-line">
              <span class="label">Nama Peserta</span>
              <span class="value">${nama}</span>
            </div>
            <div class="row-line">
              <span class="label">Nomor Sertifikat</span>
              <span class="value"><code>${nomor}</code></span>
            </div>
            <div class="row-line">
              <span class="label">Lokasi PKD</span>
              <span class="value">${lokasi}</span>
            </div>
            <div class="row-line">
              <span class="label">Tanggal Terbit</span>
              <span class="value">${escapeHtml(tanggal)}</span>
            </div>
          </div>

          ${pdfUrl ? `
            <a href="${pdfUrl}" target="_blank" rel="noopener noreferrer" class="result-action primary">
              <i class="bi bi-download"></i> Unduh Sertifikat PDF
            </a>
          ` : ''}
        </div>
      `;
    }

    function renderNotFound(nomor) {
      resultAreaEl.innerHTML = `
        <div class="result-box danger">
          <div class="result-title">
            <i class="bi bi-x-circle-fill"></i>
            Sertifikat Tidak Ditemukan
          </div>
          <p class="mb-0 small">
            Nomor <strong><code>${escapeHtml(nomor)}</code></strong> tidak terdaftar
            di sistem kami. Periksa kembali penulisan nomor, atau hubungi panitia PKD.
          </p>
        </div>
      `;
    }

    function renderError(message) {
      resultAreaEl.innerHTML = `
        <div class="result-box warning">
          <div class="result-title">
            <i class="bi bi-exclamation-triangle-fill"></i>
            Gagal Memverifikasi
          </div>
          <p class="mb-0 small">${escapeHtml(message || 'Terjadi kesalahan saat memverifikasi.')}</p>
        </div>
      `;
    }

    function renderInfo(message) {
      resultAreaEl.innerHTML = `
        <div class="result-box info">
          <div class="result-title">
            <i class="bi bi-info-circle-fill"></i>
            Informasi
          </div>
          <p class="mb-0 small">${escapeHtml(message)}</p>
        </div>
      `;
    }

    function setBtnLoading(loading) {
      if (loading) {
        btnEl.disabled = true;
        btnIconEl.className = 'spinner-border spinner-border-sm me-2';
        btnTextEl.textContent = 'Memverifikasi…';
      } else {
        btnEl.disabled = false;
        btnIconEl.className = 'bi bi-search me-1';
        btnTextEl.textContent = 'Verifikasi Sekarang';
      }
    }

    // ============================================================
    //   VERIFY LOGIC
    // ============================================================
    async function verify(nomor) {
      if (isVerifying) return;
      if (!nomor || !nomor.trim()) {
        renderInfo('Masukkan nomor sertifikat terlebih dahulu.');
        inputEl.focus();
        return;
      }

      isVerifying = true;
      setBtnLoading(true);
      renderLoading();

      try {
        const res = await callApi('verifyCertificate', { nomor: nomor.trim() }, 'GET');

        if (res && res.success === true) {
          if (res.data && res.data.nomor_sertifikat) {
            renderSuccess(res.data);
          } else {
            renderNotFound(nomor);
          }
        } else {
          renderError((res && res.error) || 'Respons tidak valid dari server.');
        }
      } catch (e) {
        console.error('[Verifikasi] error:', e);
        renderError(e.message || 'Network error. Coba lagi.');
      } finally {
        isVerifying = false;
        setBtnLoading(false);
      }
    }

    // ============================================================
    //   FORM SUBMIT
    // ============================================================
    formEl.addEventListener('submit', (e) => {
      e.preventDefault();
      verify(inputEl.value);
    });

    // ============================================================
    //   AUTO-FROM QUERY STRING (?nomor=xxx)
    // ============================================================
    (function autoFromQuery() {
      try {
        const params = new URLSearchParams(window.location.search);
        const nomor = params.get('nomor');
        if (nomor) {
          inputEl.value = nomor;
          setTimeout(() => verify(nomor), 200);
        }
      } catch (e) {
        console.warn('[Verifikasi] Query parse error:', e);
      }
    })();

    if (!new URLSearchParams(window.location.search).get('nomor')) {
      setTimeout(() => inputEl.focus(), 300);
    }

    console.log(
      '%c verifikasi.html v28.4.0 — Full Fix ',
      'background:#2563eb;color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;'
    );
  </script>

</body>
</html>
