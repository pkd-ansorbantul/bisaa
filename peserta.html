  <script type="module">

    import {

    // ============================================================

    let formStructure = [];

    let currentCameraTarget = '';

    const FORM_STATE_KEY = 'pkd_peserta_form_state_v2';
    const MAX_FILE_SIZE_MB = 5;

    // ============================================================
    //   UTILITY: safe localStorage
    // ============================================================
    function safeLS(fn) {
      try { return fn(); }
      catch (e) { return null; }
    }

    // ============================================================
    //   FORM STATE PERSISTENCE
    // ============================================================
    function savePesertaFormState() {
      const form = document.getElementById('formPesertaDinamis');
      if (!form) return;

      const formData = new FormData(form);
      const data = {};

      formData.forEach((v, k) => {
        if (v instanceof File) return;
        data[k] = v;
      });

      safeLS(() => localStorage.setItem(FORM_STATE_KEY, JSON.stringify(data)));
    }

    function restorePesertaFormState() {
      const saved = safeLS(() => localStorage.getItem(FORM_STATE_KEY));
      if (!saved) return;

      try {
        const data = JSON.parse(saved);
        const form = document.getElementById('formPesertaDinamis');
        if (!form) return;

        Object.keys(data).forEach(key => {
          const fields = form.querySelectorAll(`[name="${key}"]`);
          if (!fields.length) return;

          fields.forEach(field => {
            if (field.type === 'radio') {
              if (field.value === data[key]) field.checked = true;
            } else if (field.type === 'file') {
              // Skip file restore
            } else {
              field.value = data[key];
            }
          });
        });

        // Trigger utusan toggle
        const utusanSelect = form.querySelector('select[name="utusan"]');
        if (utusanSelect) utusanSelect.dispatchEvent(new Event('change'));
      } catch (e) { /* silent */ }
    }

    function clearPesertaFormState() {
      safeLS(() => localStorage.removeItem(FORM_STATE_KEY));
    }

    // ============================================================
    //   QR GENERATION
    // ============================================================
    function generateQR(id) {
      const container = document.getElementById('qrCodeContainer');
      if (!container) return;

      container.innerHTML = '';

      if (!id) {
        container.innerHTML = '<div class="text-muted small">ID tidak tersedia</div>';
        return;
      }

      if (typeof qrcode !== 'function') {
        container.innerHTML = '<div class="text-muted small">QR library tidak tersedia</div>';
        return;
      }

      try {
        const qr = qrcode(0, 'M');
        qr.addData(`peserta_id=${id}`);
        qr.make();

        const moduleCount = qr.getModuleCount();
        const cellSize = 10;
        const margin = 20;
        const qrSize = moduleCount * cellSize;
        const canvasSize = qrSize + (margin * 2);

        const canvas = document.createElement('canvas');
        canvas.width = canvasSize;
        canvas.height = canvasSize;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvasSize, canvasSize);

        for (let row = 0; row < moduleCount; row++) {
          for (let col = 0; col < moduleCount; col++) {
            if (qr.isDark(row, col)) {
              ctx.fillStyle = '#000000';
              ctx.fillRect(
                margin + col * cellSize,
                margin + row * cellSize,
                cellSize,
                cellSize
              );
            }
          }
        }

        // Logo overlay
        const logoSize = 70;
        const logoX = (canvasSize - logoSize) / 2;
        const logoY = (canvasSize - logoSize) / 2;

        const logoImg = new Image();
        logoImg.src = `${BASE_PATH}LOGOANSOR.webp`;

        logoImg.onload = function () {
          ctx.drawImage(logoImg, logoX, logoY, logoSize, logoSize);
        };

        logoImg.onerror = function () {
          // Fallback: text logo
          const fallbackCanvas = document.createElement('canvas');
          fallbackCanvas.width = logoSize;
          fallbackCanvas.height = logoSize;
          const fCtx = fallbackCanvas.getContext('2d');

          fCtx.fillStyle = '#14994c';
          fCtx.beginPath();
          fCtx.moveTo(logoSize / 2, 0);
          fCtx.lineTo(logoSize, logoSize);
          fCtx.lineTo(0, logoSize);
          fCtx.closePath();
          fCtx.fill();

          fCtx.fillStyle = '#ffffff';
          fCtx.font = 'bold 22px Inter';
          fCtx.textAlign = 'center';
          fCtx.textBaseline = 'middle';
          fCtx.fillText('ANSOR', logoSize / 2, logoSize / 2 - 2);

          ctx.drawImage(fallbackCanvas, logoX, logoY, logoSize, logoSize);
        };

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 8;
        ctx.strokeRect(0, 0, canvasSize, canvasSize);

        container.appendChild(canvas);
      } catch (err) {
        console.error('[PesertaView] QR generate error:', err);
        container.innerHTML = '<div class="text-muted small">QR error</div>';
      }
    }

    // ============================================================
    //   LOAD FORM
    // ============================================================
    async function loadPesertaForm() {
      const container = document.getElementById('pesertaFormContainer');

      try {
        let raw = null;
        const settingsRes = await callApi('getFormSettings', {}, 'GET');

        if (settingsRes && settingsRes.success) {
          let data = settingsRes.data;

          if (typeof data === 'string') {
            try { data = JSON.parse(data); }
            catch (e) { data = null; }
          }

          raw = data;
        }

        formStructure = normalizeFormStructure(raw);
        buildForm(container);
      } catch (e) {
        console.error('[PesertaView] load form error:', e);
        container.innerHTML = `
          <div class="alert alert-danger text-center py-5">

    // ============================================================
    //   SIGNATURE PAD
    // ============================================================
    function initSignaturePad() {
      const canvas = document.getElementById('signatureCanvas');
      const containerSignature = document.getElementById('signatureAreaContainer');
      if (!canvas || !containerSignature) return;

      if (typeof SignaturePad === 'undefined') {
        showToast('Library tanda tangan belum siap. Refresh halaman.', 'warning');
        return;
      }

      if (sigPad) {
        try { sigPad.off(); }
        catch (e) { /* silent */ }
        sigPad = null;
      }

      function resizeCanvas() {
        const ratio = Math.max(window.devicePixelRatio || 1, 1);
        const rect = canvas.parentElement.getBoundingClientRect();
        const w = Math.max(rect.width - 16, 280);
        const h = 160;

        canvas.width = w * ratio;
        canvas.height = h * ratio;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';

        const ctx = canvas.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(ratio, ratio);
      }

      resizeCanvas();

      sigPad = new SignaturePad(canvas, {
        backgroundColor: 'rgb(255,255,255)',
        penColor: 'rgb(0,0,0)',
        minWidth: 0.5,
        maxWidth: 3.5,
        velocityFilterWeight: 0.7,
        throttle: 16,
      });

      sigPad.addEventListener('beginStroke', () => {
        containerSignature.classList.add('drawing');
      });
      sigPad.addEventListener('endStroke', () => {
        if (sigPad.isEmpty()) {
          containerSignature.classList.remove('drawing');
        }
        savePesertaFormState();
      });

      document.getElementById('clearSignature')?.addEventListener('click', () => {
        sigPad.clear();
        containerSignature.classList.remove('drawing');
        savePesertaFormState();
      });

      document.getElementById('undoSignature')?.addEventListener('click', () => {
        const data = sigPad.toData();
        if (data && data.length > 0) {
          data.pop();
          sigPad.fromData(data);
          if (sigPad.isEmpty()) {
            containerSignature.classList.remove('drawing');
          }
          savePesertaFormState();
        }
      });

      // Resize handler — debounced
      window.removeEventListener('resize', window._pesertaResizeHandler);
      window._pesertaResizeHandler = () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (!sigPad) return;
          const data = sigPad.toData();
          const isEmpty = sigPad.isEmpty();

          resizeCanvas();
          sigPad.clear();
          if (!isEmpty && data.length) {
            try { sigPad.fromData(data); }
            catch (e) { /* silent */ }
          }
        }, 200);
      };
      window.addEventListener('resize', window._pesertaResizeHandler);
    }

    // ============================================================
    //   CAMERA
    // ============================================================
    window.openCamera = async function (targetId) {
      if (cameraActive) return;
      currentCameraTarget = targetId;

      const modalEl = document.getElementById('cameraModal');
      const video = document.getElementById('cameraVideo');
      const title = document.getElementById('cameraModalTitle');

      if (title) {
        title.innerText = targetId === 'foto'
          ? 'Ambil Foto Diri'
          : 'Ambil Foto / Scan Surat Rekomendasi';
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        cameraStream = stream;
        if (video) {
          video.srcObject = stream;
          video.play();
        }
        cameraActive = true;
        if (modalEl) {
          const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
          modal.show();
        }
      } catch (err) {
        showToast('Gagal mengakses kamera: ' + err.message, 'error');
      }
    };

    document.getElementById('capturePhotoBtn')?.addEventListener('click', function () {
      const video = document.getElementById('cameraVideo');
      if (!video) return;

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);

      canvas.toBlob(function (blob) {
        if (!blob) return;
        const file = new File(
          [blob],
          `capture_${currentCameraTarget}_${Date.now()}.jpg`,
          { type: 'image/jpeg' }
        );

        const input = document.getElementById(`input_${currentCameraTarget}`);
        if (!input) return;

        try {
          const dataTransfer = new DataTransfer();
          dataTransfer.items.add(file);
          input.files = dataTransfer.files;
          input.dispatchEvent(new Event('change'));
        } catch (e) {
          console.warn('[Camera] DataTransfer not supported:', e);
        }

        const modalEl = document.getElementById('cameraModal');
        if (modalEl) {
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();
        }
        closeCamera();
      }, 'image/jpeg', 0.8);
    });

    function closeCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      cameraActive = false;
      const video = document.getElementById('cameraVideo');
      if (video) video.srcObject = null;
    }

    document.getElementById('cameraModal')?.addEventListener('hidden.bs.modal', function () {
      closeCamera();
    });

    // ============================================================
    //   SUBMIT FORM
    // ============================================================
    async function submitPesertaForm(e) {
      e.preventDefault();

      const form = document.getElementById('formPesertaDinamis');
      if (!form) return;

      const formData = new FormData(form);
      const data = { action: 'submitPeserta', custom_data: {} };

      // Required validation
      const missingFields = [];
      formStructure.forEach(field => {
        if (field.required) {
          const val = formData.get(field.id);
          const isFile = field.type === 'file';
          let isEmpty = true;

          if (isFile) {
            const fileInput = document.getElementById(`input_${field.id}`);
            isEmpty = !fileInput || !fileInput.files.length;
          } else {
            isEmpty = !val || val.trim() === '';
          }

          if (isEmpty) missingFields.push(field.label);
        }
      });

      if (missingFields.length > 0) {
        showToast('Harap isi: ' + missingFields.join(', '), 'error');
        return;
      }

      // File size validation
      const fotoFile = formData.get('foto');
      if (fotoFile && fotoFile.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
        showToast(`Ukuran foto maksimal ${MAX_FILE_SIZE_MB} MB`, 'error');
        return;
      }
      const suratFile = formData.get('surat_rekomendasi');
      if (suratFile && suratFile.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
        showToast(`Ukuran surat rekomendasi maksimal ${MAX_FILE_SIZE_MB} MB`, 'error');
        return;
      }

      // Signature validation
      if (!sigPad || sigPad.isEmpty()) {
        showToast('Tanda tangan digital wajib diisi', 'warning');
        const sigArea = document.getElementById('signatureAreaContainer');
        sigArea?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      // Disable form
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalBtnHtml = submitBtn ? submitBtn.innerHTML : '';

      document.querySelectorAll('#formPesertaDinamis input, #formPesertaDinamis textarea, #formPesertaDinamis select')
        .forEach(el => el.disabled = true);

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Mengirim...';
      }

      try {
        // Read files as base64
        if (fotoFile && fotoFile.size > 0) {
          data.foto = await fileToBase64(fotoFile);
        }
        if (suratFile && suratFile.size > 0) {
          data.surat_rekomendasi = await fileToBase64(suratFile);
        }

        // Signature
        data.tanda_tangan = sigPad.toDataURL('image/jpeg', 0.2);

        // Map form structure
        const coreFields = [
          'nama_lengkap', 'tempat_tgl_lahir', 'pekerjaan',
          'pendidikan_terakhir', 'alamat', 'no_hp', 'email',
          'utusan', 'pengalaman_organisasi', 'status', 'tanggal', 'catatan'
        ];

        formStructure.forEach(field => {
          const val = formData.get(field.id);
          if (field.type === 'file') return;

          if (coreFields.includes(field.id)) {
            data[field.id] = val || '';
          } else {
            data.custom_data[field.id] = val || '';
          }
        });

        // Handle utusan "Lainnya"
        if (data.utusan === 'Lainnya') {
          const luarValue = formData.get('utusan_luar');
          const luarInput = typeof luarValue === 'string' ? luarValue.trim() : '';
          data.utusan = luarInput ? `Lainnya - ${luarInput}` : 'Lainnya (tidak diisi)';
        }
        delete data.utusan_luar;

        // Submit
        const result = await submitPeserta(data);
        if (!result || !result.success) {
          throw new Error((result && result.error) || 'Gagal mengirim');
        }

        showToast('✅ Data peserta berhasil dikirim!', 'success');

        // Show ID card
        const qrResult = document.getElementById('qrResult');
        if (qrResult) qrResult.style.display = 'block';

        const idDisplay = document.getElementById('pesertaIdDisplay');
        const nameDisplay = document.getElementById('idCardNama');
        const alamatDisplay = document.getElementById('idCardAlamat');

        if (idDisplay) idDisplay.textContent = result.id || '-';
        if (nameDisplay) nameDisplay.textContent = data.nama_lengkap || '-';
        if (alamatDisplay) alamatDisplay.textContent = data.alamat || '-';

        generateQR(result.id);

        // Reset form
        form.reset();
        document.querySelectorAll('#formPesertaDinamis img[id^="preview_"]')
          .forEach(el => el.style.display = 'none');
        document.querySelectorAll('#formPesertaDinamis div[id^="preview_"]')
          .forEach(el => el.innerHTML = '');

        if (sigPad) sigPad.clear();
        document.getElementById('signatureAreaContainer')?.classList.remove('drawing');
        clearPesertaFormState();

        const utusanLuar = document.getElementById('utusanLuarContainer');
        if (utusanLuar) utusanLuar.style.display = 'none';

        // Scroll ke kartu ID
        qrResult?.scrollIntoView({ behavior: 'smooth', block: 'start' });

        // Bind download ID card
        bindDownloadIdCard(data.nama_lengkap);
      } catch (err) {
        showToast('❌ Gagal mengirim: ' + err.message, 'error');
      } finally {
        document.querySelectorAll('#formPesertaDinamis input, #formPesertaDinamis textarea, #formPesertaDinamis select')
          .forEach(el => el.disabled = false);

        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalBtnHtml;
        }
      }
    }

    function bindDownloadIdCard(namaLengkap) {
      const downloadBtn = document.getElementById('downloadIdCardBtn');
      if (!downloadBtn) return;

      downloadBtn.onclick = function () {
        const cardElement = document.getElementById('idCard');
        if (!cardElement) return;

        if (typeof html2canvas === 'undefined') {
          showToast('Fitur download tidak tersedia', 'error');
          return;
        }

        const btnEl = this;
        const original = btnEl.innerHTML;
        btnEl.disabled = true;
        btnEl.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>Memuat...';

        html2canvas(cardElement, {
          scale: 2,
          useCORS: true,
          backgroundColor: '#ffffff',
        }).then(canvasImg => {
          const link = document.createElement('a');
          const namaFile = (namaLengkap || 'peserta').replace(/\s+/g, '_');
          link.download = `Kartu_ID_${namaFile}.png`;
          link.href = canvasImg.toDataURL('image/png');
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          showToast('Kartu ID berhasil diunduh!', 'success');
        }).catch(err => {
          showToast('Gagal mengunduh kartu ID: ' + err.message, 'error');
        }).finally(() => {
          btnEl.disabled = false;
          btnEl.innerHTML = original;
        });
      };
    }

    // ============================================================
    //   BOOT
    // ============================================================
    (async function boot() {
      const canAccess = await guardPublicAccess();
      if (!canAccess) return;

      updateNavbarMenu();

      const container = document.getElementById('pesertaFormContainer');
      if (container) {
        renderSkeletonPeserta(container);
      }

      await loadPesertaForm();
    })();

    console.log(
      '%c peserta.html v26.4.0 — GitHub Pages /bisaa/ Edition ',
      'background:#2563eb;color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;'
    );
  </script>
</body>
</html>
