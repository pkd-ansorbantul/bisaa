    /* ============ EMPTY & ERROR STATES ============ */

    /* ============ DARK MODE ============ */

<body>

  <header class="header-minimal">

        <div id="assetContainer">

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    // ============================================================
    //   IMPORTS
    // ============================================================
    import {
      callApi,
      showToast,
      escapeHtml,
      updateNavbarMenu,
    } from '/bisaa/js/core/api.js';

    // ============================================================
    //   CONSTANTS
    // ============================================================
    const SESSION_AUTH_KEY = 'public_asset_auth_v1';
    const CACHE_KEY_FOLDERS = 'pkd_public_folders_v1';
    const CACHE_KEY_ASSETS = 'pkd_public_assets_v1';
    const CACHE_AGE_MIN = 5;
    const DOWNLOAD_DELAY_MS = 1000;

    // ============================================================
    //   STATE
    // ============================================================
    const STATE = {
      assetList: [],
      folderList: [],
      currentFolderId: '',
      unlockedFolders: new Set(),
      isDownloadingAll: false,
      isLoading: false,
      globalConfig: null,
    };

    // ============================================================
    //   UTILITY
    // ============================================================
    function safeLS(fn) {
      try { return fn(); } catch (e) { return null; }
    }

    function safeSS(fn) {
      try { return fn(); } catch (e) { return null; }
    }

    function cleanDriveId(id) {
      if (!id || typeof id !== 'string') return '';
      return id.trim().replace(/[\x00-\x1F\x7F]+/g, '').replace(/[^a-zA-Z0-9_-]+/g, '');
    }

    function isValidDriveId(id) {
      return cleanDriveId(id).length >= 15;
    }

    function parseBool(v) {
      if (v === true) return true;
      if (v === false) return false;
      if (v === undefined || v === null) return false;
      let s = String(v).toLowerCase().trim();
      if (s.startsWith("'")) s = s.substring(1);
      return s === 'true' || s === 'yes' || s === '1';
    }

    function formatDate(timestamp) {
      if (!timestamp) return '-';
      try {
        const d = new Date(timestamp);
        return isNaN(d.getTime()) ? '-' : d.toLocaleDateString('id-ID');
      } catch { return '-'; }
    }

    function sanitizeFilename(name) {
      return String(name || 'asset')
        .replace(/[\\/:*?"<>|]/g, '_')
        .replace(/\s+/g, '_')
        .substring(0, 100) || 'asset';
    }

    function getCache(key) {
      const raw = safeLS(() => localStorage.getItem(key));
      if (!raw) return null;
      try {
        const { data, ts } = JSON.parse(raw);
        if ((Date.now() - ts) > CACHE_AGE_MIN * 60 * 1000) {
          safeLS(() => localStorage.removeItem(key));
          return null;
        }
        return data;
      } catch { return null; }
    }

    function setCache(key, data) {
      safeLS(() => localStorage.setItem(key, JSON.stringify({ data, ts: Date.now() })));
    }

    function normalizeResult(res) {
      if (!res) return [];
      if (Array.isArray(res)) return res;
      if (res.data && Array.isArray(res.data)) return res.data;
      return [];
    }

    function buildDriveViewUrl(driveId) {
      return `https://drive.google.com/file/d/${cleanDriveId(driveId)}/view`;
    }
    function buildDriveDownloadUrl(driveId) {
      return `https://drive.google.com/uc?export=download&id=${cleanDriveId(driveId)}`;
    }
    function buildDrivePreviewUrl(driveId) {
      return `https://drive.google.com/file/d/${cleanDriveId(driveId)}/preview`;
    }

    // ============================================================
    //   SKELETON
    // ============================================================
    function renderSkeletonFolderList() {
      const c = document.getElementById('folderList');
      if (!c) return;
      let html = '';
      for (let i = 0; i < 4; i++) {
        html += `<div class="folder-item"><div class="skeleton-box" style="height:1.5rem;width:100%;border-radius:8px;"></div></div>`;
      }
      c.innerHTML = html;
    }

    function renderSkeletonAssets() {
      const c = document.getElementById('assetContainer');
      if (!c) return;
      let html = '<div class="asset-grid">';
      for (let i = 0; i < 8; i++) {
        html += `<div class="asset-card skeleton">
          <div class="skeleton-box skeleton-img"></div>
          <div class="card-body">
            <div class="skeleton-box skeleton-title"></div>
            <div class="skeleton-box skeleton-desc"></div>
          </div>
        </div>`;
      }
      html += '</div>';
      c.innerHTML = html;
    }

    // ============================================================
    //   ASSET PLAYER (VIDEO / AUDIO / PDF)
    // ============================================================
    function openAssetPlayer(judul, driveId, jenis, mimeType) {
      const cleaned = cleanDriveId(driveId);
      if (!isValidDriveId(cleaned)) {
        showToast('ID file tidak valid.', 'warning');
        return;
      }

      // Cleanup existing overlay
      document.getElementById('assetPlayerOverlay')?.remove();

      const jenisLower = String(jenis || '').toLowerCase();
      const mimeLower = String(mimeType || '').toLowerCase();
      const isVideo = jenisLower === 'video' || mimeLower.startsWith('video/');
      const isAudio = jenisLower === 'audio' || mimeLower.startsWith('audio/');
      const iconClass = isVideo ? 'film' : (isAudio ? 'music-note-beamed' : 'file-earmark-play');

      const embedUrl = buildDrivePreviewUrl(cleaned);
      const downloadUrl = buildDriveDownloadUrl(cleaned);
      const viewUrl = buildDriveViewUrl(cleaned);

      const overlay = document.createElement('div');
      overlay.className = 'player-overlay';
      overlay.id = 'assetPlayerOverlay';
      overlay.setAttribute('role', 'dialog');
      overlay.setAttribute('aria-modal', 'true');
      overlay.setAttribute('aria-label', `Pemutar: ${judul}`);
      overlay.innerHTML = `
        <div class="player-box">
          <div class="player-header">
            <h5><i class="bi bi-${iconClass} me-2" aria-hidden="true"></i>${escapeHtml(judul || 'Pemutar')}</h5>
            <button type="button" data-close-player aria-label="Tutup">
              <i class="bi bi-x-lg" aria-hidden="true"></i>
            </button>
          </div>
          <div class="player-body">
            <iframe src="${embedUrl}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="Pemutar ${escapeHtml(judul)}"></iframe>
            <div class="player-loading" data-loading>
              <div class="spinner-border" role="status">
                <span class="visually-hidden">Memuat...</span>
              </div>
              <div>Memuat pemutar...</div>
            </div>
          </div>
          <div class="player-footer">
            <a href="${viewUrl}" target="_blank" rel="noopener noreferrer" class="player-btn">
              <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
              <span>Buka di Tab Baru</span>
            </a>
            <a href="${downloadUrl}" download class="player-btn primary">
              <i class="bi bi-download" aria-hidden="true"></i>
              <span>Download</span>
            </a>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      const iframe = overlay.querySelector('iframe');
      const loadingEl = overlay.querySelector('[data-loading]');
      let loaded = false;

      iframe.addEventListener('load', () => {
        loaded = true;
        if (loadingEl) loadingEl.style.display = 'none';
      });

      setTimeout(() => {
        if (!loaded && loadingEl) loadingEl.style.display = 'none';
      }, 6000);

      const closeOverlay = () => {
        overlay.remove();
        document.removeEventListener('keydown', escHandler);
      };

      overlay.querySelector('[data-close-player]')?.addEventListener('click', closeOverlay);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeOverlay();
      });

      const escHandler = (e) => {
        if (e.key === 'Escape') closeOverlay();
      };
      document.addEventListener('keydown', escHandler);
    }

    // ============================================================
    //   ASSET ACTIONS
    // ============================================================
    function downloadAsset(driveId, judul, fileName) {
      const cleaned = cleanDriveId(driveId);
      if (!isValidDriveId(cleaned)) {
        showToast('ID file tidak valid.', 'warning');
        return;
      }

      showToast('Menyiapkan unduhan...', 'info');

      const downloadUrl = buildDriveDownloadUrl(cleaned);
      const safeName = sanitizeFilename(fileName || judul);

      try {
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = safeName;
        a.rel = 'noopener noreferrer';
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => showToast(`File "${safeName}" diunduh`, 'success'), 800);
      } catch (e) {
        const win = window.open(downloadUrl, '_blank', 'noopener,noreferrer');
        if (!win) showToast('Popup diblokir. Izinkan popup untuk mengunduh.', 'warning');
      }
    }

    function copyAssetLink(driveId, judul) {
      if (!driveId) { showToast('ID file tidak valid.', 'warning'); return; }
      const url = buildDriveViewUrl(driveId);
      const fallbackCopy = () => {
        const input = document.createElement('input');
        input.value = url;
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        try {
          document.execCommand('copy');
          showToast('Link disalin!', 'success');
        } catch (e) {
          showToast('Gagal menyalin link.', 'error');
        }
        document.body.removeChild(input);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url)
          .then(() => showToast('Link disalin!', 'success'))
          .catch(fallbackCopy);
      } else {
        fallbackCopy();
      }
    }

    function shareAsset(driveId, judul) {
      if (!driveId) { showToast('ID file tidak valid.', 'warning'); return; }
      const url = buildDriveViewUrl(driveId);
      if (navigator.share) {
        navigator.share({ title: judul || 'Aset PKD GP Ansor', url }).catch(() => {});
      } else {
        copyAssetLink(driveId, judul);
      }
    }

    function shareViaWhatsApp(driveId, judul) {
      if (!driveId) { showToast('ID file tidak valid.', 'warning'); return; }
      const url = buildDriveViewUrl(driveId);
      const text = encodeURIComponent(`Berbagi aset digital PKD GP Ansor Bantul:\n${judul}\n${url}`);
      window.open(`https://wa.me/?text=${text}`, '_blank', 'noopener,noreferrer');
    }

    // ============================================================
    //   DOWNLOAD ALL IN FOLDER
    // ============================================================
    async function downloadAllInFolder() {
      if (STATE.isDownloadingAll) return;

      const filtered = STATE.assetList.filter(item =>
        String(item.folderId || '') === String(STATE.currentFolderId || '')
      );

      if (filtered.length === 0) {
        showToast('Tidak ada aset untuk diunduh.', 'info');
        return;
      }

      const folder = STATE.folderList.find(f => String(f.id) === String(STATE.currentFolderId));
      const folderName = folder ? folder.nama : 'Semua Aset';

      if (!confirm(
        `Unduh ${filtered.length} file dari "${folderName}"?\n\n` +
        `Browser akan membuka ${filtered.length} tab unduhan berurutan.\n` +
        `Pastikan popup tidak diblokir.`
      )) return;

      STATE.isDownloadingAll = true;
      const btn = document.getElementById('downloadAllBtn');
      const originalHtml = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="bi bi-cloud-arrow-down-fill"></i> <span>Memproses…</span>`;
      }

      let successCount = 0;

      for (let i = 0; i < filtered.length; i++) {
        const item = filtered[i];
        const cleaned = cleanDriveId(item.driveId);
        if (!isValidDriveId(cleaned)) continue;

        if (btn) {
          btn.innerHTML = `<i class="bi bi-cloud-arrow-down-fill"></i> <span>${i + 1}/${filtered.length}…</span>`;
        }

        try {
          const url = buildDriveDownloadUrl(cleaned);
          const a = document.createElement('a');
          a.href = url;
          a.download = sanitizeFilename(item.fileName || item.judul) || `asset_${i + 1}`;
          a.rel = 'noopener noreferrer';
          a.target = '_blank';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          successCount++;
        } catch (e) {
          console.warn('Gagal unduh:', item.judul, e.message);
        }

        if (i < filtered.length - 1) {
          await new Promise(r => setTimeout(r, DOWNLOAD_DELAY_MS));
        }
      }

      if (btn) {
        btn.innerHTML = originalHtml;
        btn.disabled = false;
      }
      STATE.isDownloadingAll = false;
      showToast(`${successCount}/${filtered.length} file di-trigger untuk diunduh`, 'success');
    }

    // ============================================================
    //   RENDER FOLDER LIST
    // ============================================================
    function renderFolderList() {
      const c = document.getElementById('folderList');
      if (!c) return;

      if (!STATE.folderList || STATE.folderList.length === 0) {
        c.innerHTML = `<div class="text-center text-muted small py-3">Belum ada folder publik.</div>`;
        return;
      }

      let html = '';
      STATE.folderList.forEach(f => {
        const hasPassword = parseBool(f.hasPassword);
        const isUnlocked = STATE.unlockedFolders.has(String(f.id));
        const isActive = STATE.currentFolderId == f.id;

        let lockIcon = '';
        if (hasPassword && !isUnlocked) {
          lockIcon = '<i class="bi bi-lock-fill lock-icon" title="Terproteksi" aria-label="Terproteksi"></i>';
        } else if (hasPassword && isUnlocked) {
          lockIcon = '<i class="bi bi-unlock-fill lock-icon text-success" title="Sudah dibuka" aria-label="Sudah dibuka"></i>';
        }

        html += `
          <div class="folder-item ${isActive ? 'active' : ''}"
               data-folder-id="${escapeHtml(String(f.id))}"
               role="button"
               tabindex="0">
            <i class="bi bi-folder-fill" aria-hidden="true"></i>
            <span>${escapeHtml(f.nama || '-')}</span>
            ${lockIcon}
          </div>`;
      });
      c.innerHTML = html;

      c.querySelectorAll('[data-folder-id]').forEach(el => {
        el.addEventListener('click', () => navigateFolder(el.dataset.folderId));
        el.addEventListener('keypress', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            navigateFolder(el.dataset.folderId);
          }
        });
      });
    }

    // ============================================================
    //   RENDER BREADCRUMB
    // ============================================================
    function renderBreadcrumb() {
      const c = document.getElementById('breadcrumb');
      if (!c) return;

      if (STATE.currentFolderId === '') {
        c.innerHTML = `<li class="breadcrumb-item active">Semua Aset</li>`;
        return;
      }

      const folder = STATE.folderList.find(f => String(f.id) === String(STATE.currentFolderId));
      if (folder) {
        c.innerHTML = `
          <li class="breadcrumb-item"><a href="#" data-goto-root>Semua Aset</a></li>
          <li class="breadcrumb-item active">${escapeHtml(folder.nama)}</li>`;
        c.querySelector('[data-goto-root]')?.addEventListener('click', (e) => {
          e.preventDefault();
          navigateFolder('');
        });
      } else {
        c.innerHTML = `<li class="breadcrumb-item active">Semua Aset</li>`;
      }
    }

    // ============================================================
    //   RENDER ASSETS
    // ============================================================
    function renderAssets() {
      const c = document.getElementById('assetContainer');
      const toolbar = document.getElementById('assetToolbar');
      const countEl = document.getElementById('assetCount');
      if (!c) return;

      const filtered = STATE.assetList.filter(item =>
        String(item.folderId || '') === String(STATE.currentFolderId || '')
      );
      filtered.sort((a, b) => String(a.judul || '').localeCompare(String(b.judul || '')));

      if (filtered.length === 0) {
        c.innerHTML = `
          <div class="empty-state">
            <i class="bi bi-image" aria-hidden="true"></i>
            <h5>Belum Ada Aset</h5>
            <p>Folder ini belum memiliki aset yang dipublikasikan.</p>
          </div>`;
        if (toolbar) toolbar.style.display = 'none';
        return;
      }

      if (toolbar) toolbar.style.display = 'flex';
      if (countEl) countEl.innerHTML = `<strong>${filtered.length}</strong> file tersedia`;

      let html = '<div class="asset-grid">';
      filtered.forEach((item, idx) => {
        const cleaned = cleanDriveId(item.driveId);
        const valid = isValidDriveId(cleaned);
        const imgUrl = valid ? `https://drive.google.com/thumbnail?id=${cleaned}&sz=w400` : '';

        const jenis = String(item.jenis || '').toLowerCase();
        const mime = String(item.mimeType || '');
        const isVideo = jenis === 'video' || mime.startsWith('video/');
        const isPdf = jenis === 'dokumen' || jenis === 'sertifikat' || mime === 'application/pdf';
        const isAudio = jenis === 'audio' || mime.startsWith('audio/');

        let previewContent = '';
        if (valid) {
          if (isPdf) {
            previewContent = `<div class="thumbnail-container"><div class="fallback" style="display:flex;"><i class="bi bi-file-earmark-pdf-fill text-danger" style="font-size:2.5rem;" aria-hidden="true"></i><div class="small text-muted mt-2">PDF</div></div></div>`;
          } else if (isAudio) {
            previewContent = `<div class="thumbnail-container" style="background:linear-gradient(135deg,#dbeafe,#bfdbfe);"><div class="fallback" style="background:transparent;"><i class="bi bi-music-note-beamed text-primary" style="font-size:3rem;" aria-hidden="true"></i><div class="small text-muted mt-2">🎵 Tap untuk putar</div></div></div>`;
          } else if (isVideo) {
            previewContent = `<div class="thumbnail-container"><img src="${imgUrl}" alt="${escapeHtml(item.judul)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="fallback" style="display:none;background:linear-gradient(135deg,#1e293b,#0f172a);color:white;"><i class="bi bi-play-circle-fill" style="font-size:3rem;color:#60a5fa;" aria-hidden="true"></i><div class="small mt-2">▶️ Tap untuk putar</div></div></div>`;
          } else {
            previewContent = `<div class="thumbnail-container"><img src="${imgUrl}" alt="${escapeHtml(item.judul)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="fallback" style="display:none;"><i class="bi bi-file-earmark-fill text-secondary" style="font-size:2.5rem;" aria-hidden="true"></i><div class="small text-muted mt-2">Thumbnail gagal</div></div></div>`;
          }
        } else {
          previewContent = `<div class="thumbnail-container" style="background:#f8fafc;"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;"><i class="bi bi-file-earmark-fill text-secondary" style="font-size:2.5rem;" aria-hidden="true"></i><div class="small text-muted mt-2">ID rusak</div></div></div>`;
        }

        html += `
          <div class="asset-card" data-index="${idx}">
            ${previewContent}
            <div class="card-body">
              <div class="card-title">${escapeHtml(item.judul || '-')}</div>
              <div class="card-text">${escapeHtml(item.deskripsi || '')}</div>
              <div class="card-actions">
                <button class="btn btn-sm btn-download"
                        data-action="download"
                        data-index="${idx}"
                        title="Download"
                        aria-label="Download ${escapeHtml(item.judul || '')}">
                  <i class="bi bi-download" aria-hidden="true"></i>
                </button>
                <button class="btn btn-sm btn-outline-secondary"
                        data-action="copy"
                        data-index="${idx}"
                        title="Salin Link"
                        aria-label="Salin link">
                  <i class="bi bi-link-45deg" aria-hidden="true"></i>
                </button>
                <button class="btn btn-sm btn-outline-primary"
                        data-action="share"
                        data-index="${idx}"
                        title="Bagikan"
                        aria-label="Bagikan">
                  <i class="bi bi-share" aria-hidden="true"></i>
                </button>
                <button class="btn btn-sm btn-success"
                        data-action="whatsapp"
                        data-index="${idx}"
                        title="WhatsApp"
                        aria-label="Bagikan ke WhatsApp">
                  <i class="bi bi-whatsapp" aria-hidden="true"></i>
                </button>
              </div>
              <div class="mt-2 text-end text-muted small">${formatDate(item.timestamp)}</div>
            </div>
          </div>`;
      });
      html += '</div>';
      c.innerHTML = html;

      // Bind card preview click (open player)
      c.querySelectorAll('.asset-card').forEach(card => {
        const idx = parseInt(card.dataset.index, 10);
        const item = filtered[idx];

        card.querySelector('.thumbnail-container')?.addEventListener('click', () => {
          openAssetPlayer(item.judul, item.driveId, item.jenis, item.mimeType);
        });

        card.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const action = btn.dataset.action;
            if (action === 'download') downloadAsset(item.driveId, item.judul, item.fileName);
            else if (action === 'copy') copyAssetLink(item.driveId, item.judul);
            else if (action === 'share') shareAsset(item.driveId, item.judul);
            else if (action === 'whatsapp') shareViaWhatsApp(item.driveId, item.judul);
          });
        });
      });
    }

    // ============================================================
    //   FOLDER NAVIGATION
    // ============================================================
    function navigateFolder(folderId) {
      STATE.currentFolderId = folderId || '';

      const folder = STATE.folderList.find(f => String(f.id) === String(folderId));
      if (folder) {
        const hasPassword = parseBool(folder.hasPassword);
        const isUnlocked = STATE.unlockedFolders.has(String(folder.id));

        if (hasPassword && !isUnlocked) {
          renderFolderList();
          renderBreadcrumb();
          renderAssets();
          showFolderPasswordOverlay(folderId);
          return;
        }
      }

      renderFolderList();
      renderBreadcrumb();
      renderAssets();
    }

    // ============================================================
    //   FOLDER PASSWORD OVERLAY
    // ============================================================
    function showFolderPasswordOverlay(folderId) {
      document.getElementById('folderPasswordOverlay')?.remove();

      const overlay = document.createElement('div');
      overlay.id = 'folderPasswordOverlay';
      overlay.className = 'password-lock-overlay';
      overlay.innerHTML = `
        <div class="lock-box">
          <i class="bi bi-folder-lock fs-1 text-warning mb-3" aria-hidden="true"></i>
          <h5 class="fw-bold">Folder Terproteksi</h5>
          <p class="text-muted small">Masukkan password untuk mengakses folder ini.</p>
          <div class="input-group mb-3">
            <input type="password" class="form-control" id="folderPasswordInput"
                   placeholder="Password folder" autocomplete="off" aria-label="Password folder">
            <button class="btn btn-outline-secondary" type="button" id="toggleFolderPassBtn" aria-label="Tampilkan password">
              <i class="bi bi-eye" aria-hidden="true"></i>
            </button>
          </div>
          <button class="btn btn-primary w-100 rounded-pill py-2" id="unlockFolderBtn">
            <i class="bi bi-unlock-fill me-1" aria-hidden="true"></i> Buka Kunci
          </button>
          <div id="folderPasswordError" class="text-danger small mt-2" style="display:none;"></div>
          <button class="btn btn-link btn-sm text-muted mt-2" id="cancelFolderUnlockBtn">Kembali ke Semua Aset</button>
        </div>`;
      document.body.appendChild(overlay);

      const input = document.getElementById('folderPasswordInput');
      const errDiv = document.getElementById('folderPasswordError');
      const unlockBtn = document.getElementById('unlockFolderBtn');
      const toggleBtn = document.getElementById('toggleFolderPassBtn');

      input?.focus();

      toggleBtn?.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
        const i = toggleBtn.querySelector('i');
        if (i) i.className = input.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
      });

      input?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') unlockBtn?.click();
      });

      document.getElementById('cancelFolderUnlockBtn')?.addEventListener('click', cancelFolderUnlock);

      unlockBtn?.addEventListener('click', async function () {
        const pass = input.value.trim();
        if (!pass) {
          errDiv.style.display = 'block';
          errDiv.innerText = 'Password wajib diisi.';
          return;
        }

        const btn = this;
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Memeriksa...';

        try {
          const result = await callApi('verifyFolderPassword', { id: folderId, password: pass }, 'GET');
          if (result && result.success) {
            STATE.unlockedFolders.add(String(folderId));
            overlay.remove();
            renderFolderList();
            renderBreadcrumb();
            renderAssets();
            showToast('Folder terbuka', 'success');
          } else {
            errDiv.style.display = 'block';
            errDiv.innerText = (result && result.error) || 'Password salah.';
            btn.disabled = false;
            btn.innerHTML = originalHtml;
          }
        } catch (err) {
          errDiv.style.display = 'block';
          errDiv.innerText = 'Terjadi kesalahan: ' + (err.message || '');
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      });
    }

    function cancelFolderUnlock() {
      document.getElementById('folderPasswordOverlay')?.remove();
      STATE.currentFolderId = '';
      renderFolderList();
      renderBreadcrumb();
      renderAssets();
    }

    // ============================================================
    //   GLOBAL PASSWORD OVERLAY
    // ============================================================
    function showGlobalPasswordOverlay() {
      const overlay = document.createElement('div');
      overlay.id = 'globalPasswordOverlay';
      overlay.className = 'password-lock-overlay';
      overlay.innerHTML = `
        <div class="lock-box">
          <i class="bi bi-lock-fill fs-1 text-primary mb-3" aria-hidden="true"></i>
          <h5 class="fw-bold">Galeri Terproteksi</h5>
          <p class="text-muted small">Masukkan password untuk mengakses galeri publik.</p>
          <div class="input-group mb-3">
            <input type="password" class="form-control" id="globalPasswordInput"
                   placeholder="Password" autocomplete="off" aria-label="Password galeri">
            <button class="btn btn-outline-secondary" type="button" id="toggleGlobalPassBtn" aria-label="Tampilkan password">
              <i class="bi bi-eye" aria-hidden="true"></i>
            </button>
          </div>
          <button class="btn btn-primary w-100 rounded-pill py-2" id="unlockGlobalBtn">
            <i class="bi bi-unlock-fill me-1" aria-hidden="true"></i> Buka Kunci
          </button>
          <div id="globalPasswordError" class="text-danger small mt-2" style="display:none;"></div>
          <a href="/bisaa/index.html" class="btn btn-link btn-sm text-muted mt-2">Kembali ke Beranda</a>
        </div>`;
      document.body.appendChild(overlay);

      const input = document.getElementById('globalPasswordInput');
      const errDiv = document.getElementById('globalPasswordError');
      const unlockBtn = document.getElementById('unlockGlobalBtn');
      const toggleBtn = document.getElementById('toggleGlobalPassBtn');

      input?.focus();

      toggleBtn?.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
        const i = toggleBtn.querySelector('i');
        if (i) i.className = input.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
      });

      input?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') unlockBtn?.click();
      });

      unlockBtn?.addEventListener('click', async function () {
        const pass = input.value.trim();
        if (!pass) {
          errDiv.style.display = 'block';
          errDiv.innerText = 'Password wajib diisi.';
          return;
        }

        const btn = this;
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Memeriksa...';

        try {
          const result = await callApi('verifyAssetPublicPassword', { password: pass }, 'GET');
          if (result && result.success) {
            safeSS(() => sessionStorage.setItem(SESSION_AUTH_KEY, 'true'));
            overlay.remove();
            loadData();
          } else {
            errDiv.style.display = 'block';
            errDiv.innerText = (result && result.error) || 'Password salah.';
            btn.disabled = false;
            btn.innerHTML = originalHtml;
          }
        } catch (err) {
          errDiv.style.display = 'block';
          errDiv.innerText = 'Terjadi kesalahan: ' + (err.message || '');
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      });
    }

    // ============================================================
    //   LOAD DATA
    // ============================================================
    async function loadData() {
      STATE.isLoading = true;

      try {
        // Check global config first
        const configRes = await callApi('getAssetPublicConfig', {}, 'GET');
        const configData = configRes?.data || configRes;
        STATE.globalConfig = configData;

        const globalEnabled = configRes && configRes.success && configData && configData.enabled;

        if (!globalEnabled) {
          document.getElementById('assetContainer').innerHTML = `
            <div class="empty-state">
              <i class="bi bi-info-circle" aria-hidden="true"></i>
              <h5>Galeri Publik Tidak Aktif</h5>
              <p>Hubungi admin untuk informasi lebih lanjut.</p>
            </div>`;
          document.getElementById('sidebarContainer').style.display = 'none';
          document.getElementById('contentContainer').classList.remove('col-md-9');
          document.getElementById('contentContainer').classList.add('col-md-12');
          STATE.isLoading = false;
          return;
        }

        // Check global password
        const needsGlobalPassword = configData ? parseBool(configData.hasPassword) : false;
        const sessionAuth = safeSS(() => sessionStorage.getItem(SESSION_AUTH_KEY)) === 'true';

        if (needsGlobalPassword && !sessionAuth) {
          showGlobalPasswordOverlay();
          STATE.isLoading = false;
          return;
        }

        // Load folders & assets (parallel)
        const [assetsRes, foldersRes] = await Promise.all([
          callApi('getAssetList', {}, 'GET'),
          callApi('getFolders', { all: 'true' }, 'GET'),
        ]);

        const rawFolders = normalizeResult(foldersRes);
        STATE.folderList = rawFolders.filter(f =>
          parseBool(f.isPublic) && !parseBool(f.hideFromGallery)
        );
        STATE.assetList = normalizeResult(assetsRes);

        setCache(CACHE_KEY_FOLDERS, STATE.folderList);
        setCache(CACHE_KEY_ASSETS, STATE.assetList);

        renderFolderList();
        renderBreadcrumb();
        renderAssets();
      } catch (e) {
        console.error('[PublicAssets] loadData error:', e);
        document.getElementById('assetContainer').innerHTML = `
          <div class="alert alert-danger text-center">
            <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>
            Gagal memuat data: ${escapeHtml(e.message || 'Network error')}
            <div class="mt-2">
              <button class="btn btn-sm btn-outline-danger" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise me-1"></i>Coba Lagi
              </button>
            </div>
          </div>`;
      } finally {
        STATE.isLoading = false;
      }
    }

    // ============================================================
    //   BIND TOP EVENTS
    // ============================================================
    document.getElementById('downloadAllBtn')?.addEventListener('click', downloadAllInFolder);

    // ============================================================
    //   BOOT
    // ============================================================
    (async function boot() {
      updateNavbarMenu();

      // Instant cache render
      renderSkeletonFolderList();
      renderSkeletonAssets();

      const cachedFolders = getCache(CACHE_KEY_FOLDERS);
      const cachedAssets = getCache(CACHE_KEY_ASSETS);

      if (cachedFolders && cachedFolders.length > 0) {
        STATE.folderList = cachedFolders;
        STATE.assetList = cachedAssets || [];
        renderFolderList();
        renderBreadcrumb();
        renderAssets();
      }

      // Fresh load
      await loadData();
    })();

    console.log(
      '%c Public Assets v26.3.2 — GitHub Pages /bisaa/ Edition ',
      'background:#16a34a;color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;'
    );
  </script>
