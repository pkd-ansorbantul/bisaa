<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
  <title>Galeri Aset Publik - PKD GP Ansor Bantul</title>

  <link rel="icon" type="image/png" href="/bisaa/LOGO%20ANSOR.webp" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: #f8fafc; color: #0f172a; min-height: 100vh; }

    /* HEADER */
    .header-minimal {
      background: rgba(255, 255, 255, 0.72) !important;
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 1030; padding: 0.75rem 0;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.04);
    }
    .brand-logo-mini { height: 40px; width: auto; margin-right: 14px; transition: transform 0.2s; }
    .brand-logo-mini:hover { transform: scale(1.05); }
    .brand-title-mini { font-weight: 700; color: #0a3d62; font-size: 1.3rem; line-height: 1.2; letter-spacing: -0.02em; }
    .brand-sub-mini { font-size: 0.8rem; color: #64748b; display: block; letter-spacing: 0.02em; }

    /* CONTENT */
    .content-wrapper { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    .section-title {
      font-weight: 650; font-size: 1.75rem;
      border-left: 6px solid #2563eb;
      padding-left: 1.2rem; margin-bottom: 1.8rem;
      color: #0f172a;
    }

    /* FOLDER SIDEBAR */
    .folder-sidebar {
      background: white; border-radius: 16px; padding: 1rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid #e2e8f0; margin-bottom: 1.5rem;
    }
    .folder-item {
      display: flex; align-items: center;
      padding: 0.5rem 0.75rem; border-radius: 8px;
      cursor: pointer; transition: background 0.15s;
      margin-bottom: 0.25rem; color: #0f172a;
    }
    .folder-item:hover { background: #f1f5f9; }
    .folder-item.active { background: #dbeafe; font-weight: 600; color: #2563eb; }
    .folder-item > i.bi-folder-fill { margin-right: 0.5rem; color: #2563eb; }
    .folder-item .lock-icon { margin-left: auto; color: #f59e0b; font-size: 0.75rem; }
    .breadcrumb { background: transparent; padding: 0; margin-bottom: 1rem; }
    .breadcrumb a { color: #2563eb; text-decoration: none; }
    .breadcrumb a:hover { text-decoration: underline; }

    /* TOOLBAR */
    .asset-toolbar {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 1rem;
      flex-wrap: wrap; gap: 0.5rem;
    }
    .asset-toolbar .asset-count { font-size: 0.85rem; color: #64748b; }
    .asset-toolbar .asset-count strong { color: #0f172a; }

    .btn-toolbar {
      background: white; border: 1px solid #e2e8f0;
      color: #334155; padding: 0.4rem 0.9rem;
      border-radius: 50px; font-size: 0.8rem;
      font-weight: 500; display: inline-flex;
      align-items: center; gap: 0.35rem;
      transition: all 0.2s; cursor: pointer;
    }
    .btn-toolbar:hover { background: #f8fafc; border-color: #cbd5e1; color: #0f172a; }

    /* ASSET GRID */
    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .asset-card {
      background: white; border-radius: 16px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex; flex-direction: column;
      cursor: pointer;
    }
    .asset-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); }
    .asset-card .thumbnail-container {
      position: relative; width: 100%; height: 150px;
      background: #f1f5f9; overflow: hidden;
    }
    .asset-card .thumbnail-container img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .asset-card .thumbnail-container .fallback {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; background: #f8fafc; color: #64748b;
    }
    .asset-card .card-body {
      padding: 1rem; flex: 1;
      display: flex; flex-direction: column;
    }
    .asset-card .card-title { font-weight: 600; margin-bottom: 0.25rem; word-break: break-word; color: #0f172a; }
    .asset-card .card-text { font-size: 0.85rem; color: #64748b; margin: 0; flex: 1; word-break: break-word; }
    .asset-card .card-actions {
      display: flex; gap: 4px; margin-top: 8px;
      justify-content: flex-end; align-items: center;
    }
    .asset-card .card-actions .btn {
      padding: 0.2rem 0.4rem; font-size: 0.75rem;
      border-radius: 50%; width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s;
    }
    .asset-card .card-actions .btn:hover { transform: scale(1.1); }
    .asset-card .card-actions .btn-download {
      background: #16a34a; color: white; border: none;
    }
    .asset-card .card-actions .btn-download:hover { background: #15803d; }

    /* PLAYER MODAL (IFRAME) */
    .player-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: flex; align-items: center; justify-content: center;
      z-index: 99999; padding: 1rem;
    }
    .player-box {
      background: #0f172a; color: white;
      border-radius: 20px;
      max-width: 900px; width: 100%;
      max-height: 90vh;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .player-header {
      padding: 1rem 1.25rem;
      background: rgba(255, 255, 255, 0.05);
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    .player-header h5 {
      margin: 0; font-weight: 600; font-size: 1rem;
      color: #fff; word-break: break-word;
    }
    .player-header button {
      background: rgba(255, 255, 255, 0.1);
      border: none; color: white;
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s; flex-shrink: 0;
    }
    .player-header button:hover { background: #dc3545; transform: scale(1.1); }
    .player-body {
      flex: 1; min-height: 400px;
      background: #000;
      position: relative; padding: 0;
    }
    .player-body iframe {
      width: 100%; height: 100%;
      min-height: 400px; border: none; display: block;
    }
    .player-body .player-loading {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0f172a; gap: 1rem; color: #94a3b8;
      pointer-events: none;
    }
    .player-body .player-loading .spinner-border { color: #2563eb; }
    .player-footer {
      padding: 0.85rem 1.25rem;
      background: rgba(255, 255, 255, 0.03);
      display: flex; justify-content: space-between;
      align-items: center; gap: 0.5rem; flex-wrap: wrap;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    .player-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white; padding: 0.5rem 1rem;
      border-radius: 50px; font-size: 0.8rem;
      font-weight: 500; display: inline-flex;
      align-items: center; gap: 0.35rem;
      cursor: pointer; transition: all 0.2s;
    }
    .player-btn:hover { background: rgba(255, 255, 255, 0.2); }
    .player-btn.primary {
      background: #16a34a; border-color: #16a34a;
    }
    .player-btn.primary:hover { background: #15803d; }

    /* PREVIEW MODAL */
    .custom-preview-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 99999;
    }
    .custom-preview-box {
      background: #ffffff; border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      max-width: 90vw; max-height: 90vh;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      overflow: hidden; position: relative;
    }
    .custom-preview-header {
      background: #0f172a; color: #fff; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;
    }
    .custom-preview-header h5 { margin: 0; font-weight: 600; font-size: 1.1rem; }
    .custom-preview-header button {
      background: rgba(255, 255, 255, 0.1); border: none; color: #fff;
      border-radius: 50%; width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; cursor: pointer; transition: 0.2s;
    }
    .custom-preview-header button:hover { background: #dc3545; transform: scale(1.1); }
    .custom-preview-body {
      flex: 1; background: #0f172a;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative; padding: 0;
    }
    .custom-preview-body iframe {
      width: 100%; height: 100%; border: none;
      transition: opacity 0.3s; opacity: 0; background: #0f172a;
    }
    .custom-preview-body iframe.show { opacity: 1; }
    .custom-preview-spinner {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff; z-index: 10;
    }
    .custom-preview-error {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff; text-align: center;
      display: none; z-index: 10;
    }
    .custom-preview-error i { font-size: 3rem; color: #f59e0b; }

    /* PASSWORD OVERLAYS */
    #passwordLockOverlay, #folderPasswordOverlay {
      position: fixed; inset: 0; z-index: 999999;
      background: rgba(15, 23, 42, 0.9);
      display: flex; align-items: center; justify-content: center;
    }
    .lock-box {
      background: white; border-radius: 24px; padding: 2rem;
      max-width: 400px; width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    /* SKELETON */
    .skeleton-box {
      background: linear-gradient(90deg, #e2e8f0 0%, #f1f5f9 50%, #e2e8f0 100%);
      background-size: 200% 100%; border-radius: 8px;
      animation: shimmer 1.2s infinite; display: inline-block;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .asset-card.skeleton { border: 1px solid #e2e8f0; background: #f8fafc; box-shadow: none; cursor: default; }
    .asset-card.skeleton:hover { transform: none; box-shadow: none; }
    .asset-card.skeleton .skeleton-img { width: 100%; height: 150px; border-radius: 16px 16px 0 0; display: block; }
    .asset-card.skeleton .skeleton-title { height: 1.2rem; width: 70%; margin: 0.5rem auto 0.3rem; border-radius: 4px; display: block; }
    .asset-card.skeleton .skeleton-desc { height: 0.9rem; width: 50%; margin: 0 auto; border-radius: 4px; display: block; }

    @media (max-width: 576px) {
      .custom-preview-box { max-width: 100vw; max-height: 100vh; border-radius: 0; }
      .asset-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
      .content-wrapper { padding: 1rem; }
      .brand-title-mini { display: none; }
      .brand-sub-mini { display: none; }
      .player-box { border-radius: 12px; max-height: 95vh; }
      .player-body { min-height: 250px; }
      .player-body iframe { min-height: 250px; }
      .player-footer { padding: 0.75rem 1rem; }
    }
  </style>
</head>
<body>

  <header class="header-minimal shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="/bisaa/index.html" class="d-flex align-items-center text-decoration-none">
        <img src="/bisaa/LOGO%20ANSOR.webp" alt="GP Ansor" class="brand-logo-mini">
        <div>
          <div class="brand-title-mini">PKD GP Ansor</div>
          <span class="brand-sub-mini">Kabupaten Bantul</span>
        </div>
      </a>
      <a href="/bisaa/index.html" class="btn btn-outline-secondary rounded-pill btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Kembali
      </a>
    </div>
  </header>

  <div id="passwordLockOverlay" style="display:none;">
    <div class="lock-box">
      <i class="bi bi-lock-fill fs-1 text-primary mb-3"></i>
      <h5 class="fw-bold">Galeri Terproteksi</h5>
      <p class="text-muted small">Masukkan password untuk mengakses galeri publik.</p>
      <div class="input-group mb-3">
        <input type="password" class="form-control" id="publicAccessPassword" placeholder="Masukkan password" autocomplete="off">
        <button class="btn btn-outline-secondary" type="button" id="togglePassOverlay"><i class="bi bi-eye"></i></button>
      </div>
      <button class="btn btn-primary w-100 rounded-pill py-2 fw-bold" id="unlockPublicBtn">
        <i class="bi bi-unlock-fill me-1"></i> Buka Kunci
      </button>
      <div id="publicLockError" class="text-danger small mt-2" style="display:none;"></div>
      <a href="/bisaa/index.html" class="btn btn-link btn-sm text-muted mt-2">Kembali ke Beranda</a>
    </div>
  </div>

  <div class="content-wrapper">
    <h2 class="section-title"><i class="bi bi-images me-2"></i>Galeri Aset Publik</h2>
    <div class="row g-3">
      <div class="col-md-3" id="sidebarContainer">
        <div class="folder-sidebar">
          <h6 class="fw-bold mb-3"><i class="bi bi-folder-fill me-2"></i>Folder</h6>
          <div id="folderList"></div>
        </div>
      </div>
      <div class="col-md-9" id="contentContainer">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb" id="breadcrumb">
            <li class="breadcrumb-item active">Semua Aset</li>
          </ol>
        </nav>

        <div class="asset-toolbar" id="assetToolbar" style="display:none;">
          <div class="asset-count" id="assetCount"></div>
          <button type="button" class="btn-toolbar" id="downloadAllBtn">
            <i class="bi bi-cloud-arrow-down-fill"></i>
            <span>Download Semua</span>
          </button>
        </div>

        <div id="assetContainer"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import { callApi, showToast, escapeHtml } from './js/core/api.js';

    // ==========================================================
    //   STATE
    // ==========================================================
    const STATE = {
      assetList: [],
      folderList: [],
      currentFolderId: '',
      folderPasswordRequired: false,
      folderPasswordAttempted: false,
      isSingleFolderMode: false,
      unlockedFolders: new Set(),
      rawAssetsData: null,
      rawFoldersData: null,
      rawConfigData: null,
      pendingFolderId: null,
      isDownloadingAll: false,
    };

    // ==========================================================
    //   UTILITY
    // ==========================================================
    function cleanDriveId(id) {
      if (!id || typeof id !== 'string') return '';
      return id.trim().replace(/[\x00-\x1F\x7F]+/g, '').replace(/[^a-zA-Z0-9_-]+/g, '');
    }
    function isValidDriveId(id) { return cleanDriveId(id).length >= 15; }
    function parseBool(v) {
      if (v === true) return true;
      if (v === false) return false;
      if (v === undefined || v === null) return false;
      const s = String(v).toLowerCase().trim();
      return s === 'true' || s === 'yes' || s === '1';
    }
    function formatDate(timestamp) {
      if (!timestamp) return '-';
      try {
        const d = new Date(timestamp);
        return isNaN(d.getTime()) ? '-' : d.toLocaleDateString('id-ID');
      } catch { return '-'; }
    }
    function normalizeResult(res) {
      if (!res) return [];
      if (Array.isArray(res)) return res;
      if (res.data && Array.isArray(res.data)) return res.data;
      return [];
    }
    function sanitizeFilename(name) {
      return String(name || 'asset')
        .replace(/[\\/:*?"<>|]/g, '_')
        .replace(/\s+/g, '_')
        .substring(0, 100) || 'asset';
    }

    // ✅ URL yang WORKS untuk download (browser navigasi, bukan fetch)
    function buildDriveViewUrl(driveId) {
      return `https://drive.google.com/file/d/${cleanDriveId(driveId)}/view`;
    }
    function buildDriveDownloadUrl(driveId) {
      // Format klasik yang masih works untuk anchor tag download
      return `https://drive.google.com/uc?export=download&id=${cleanDriveId(driveId)}`;
    }
    function buildDrivePreviewUrl(driveId) {
      // Untuk iframe — works untuk audio, video, pdf, image
      return `https://drive.google.com/file/d/${cleanDriveId(driveId)}/preview`;
    }

    // ==========================================================
    //   SKELETON
    // ==========================================================
    function renderSkeletonFolderList() {
      const c = document.getElementById('folderList');
      let html = '';
      for (let i = 0; i < 4; i++) {
        html += `<div class="folder-item"><div class="skeleton-box" style="height:1.5rem;width:100%;border-radius:8px;"></div></div>`;
      }
      c.innerHTML = html;
    }
    function renderSkeletonAssets() {
      const c = document.getElementById('assetContainer');
      let html = '<div class="asset-grid">';
      for (let i = 0; i < 8; i++) {
        html += `<div class="asset-card skeleton"><div class="skeleton-box skeleton-img"></div><div class="card-body"><div class="skeleton-box skeleton-title"></div><div class="skeleton-box skeleton-desc"></div></div></div>`;
      }
      html += '</div>';
      c.innerHTML = html;
    }

    // ==========================================================
    //   TOGGLE PASSWORD
    // ==========================================================
    document.getElementById('togglePassOverlay')?.addEventListener('click', function() {
      const input = document.getElementById('publicAccessPassword');
      if (!input) return;
      input.type = input.type === 'password' ? 'text' : 'password';
      const icon = this.querySelector('i');
      if (icon) icon.className = input.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    });

    // ==========================================================
    //   ✅ PLAYER MODAL — Universal iframe player
    //   Works untuk: audio, video, PDF, image
    //   Google Drive render player-nya sendiri di iframe
    // ==========================================================
    window.openAssetPlayer = function(judul, driveId, jenis, mimeType) {
      const cleaned = cleanDriveId(driveId);
      if (!isValidDriveId(cleaned)) { showToast('ID file tidak valid.', 'warning'); return; }

      document.getElementById('assetPlayerOverlay')?.remove();

      const jenisLower = String(jenis || '').toLowerCase();
      const mimeLower = String(mimeType || '').toLowerCase();
      const isVideo = jenisLower === 'video' || mimeLower.startsWith('video/');
      const isAudio = jenisLower === 'audio' || mimeLower.startsWith('audio/');
      const iconClass = isVideo ? 'film' : (isAudio ? 'music-note-beamed' : 'file-earmark-play');

      const embedUrl = buildDrivePreviewUrl(cleaned);
      const downloadUrl = buildDriveDownloadUrl(cleaned);
      const viewUrl = buildDriveViewUrl(cleaned);

      const overlay = document.createElement('div');
      overlay.className = 'player-overlay';
      overlay.id = 'assetPlayerOverlay';
      overlay.innerHTML = `
        <div class="player-box">
          <div class="player-header">
            <h5><i class="bi bi-${iconClass} me-2"></i>${escapeHtml(judul || 'Pemutar')}</h5>
            <button type="button" data-close-player aria-label="Tutup"><i class="bi bi-x-lg"></i></button>
          </div>
          <div class="player-body">
            <iframe src="${embedUrl}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
            <div class="player-loading" data-loading>
              <div class="spinner-border" role="status"></div>
              <div>Memuat pemutar...</div>
            </div>
          </div>
          <div class="player-footer">
            <div class="d-flex gap-2 flex-wrap">
              <a href="${viewUrl}" target="_blank" rel="noopener noreferrer" class="player-btn" style="text-decoration:none;">
                <i class="bi bi-box-arrow-up-right"></i>
                <span>Buka di Tab Baru</span>
              </a>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              <a href="${downloadUrl}" download class="player-btn primary" style="text-decoration:none;">
                <i class="bi bi-download"></i>
                <span>Download</span>
              </a>
            </div>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      // Hide loading saat iframe load
      const iframe = overlay.querySelector('iframe');
      const loadingEl = overlay.querySelector('[data-loading]');
      let loaded = false;

      iframe.addEventListener('load', () => {
        loaded = true;
        if (loadingEl) loadingEl.style.display = 'none';
      });

      // Fallback: kalau 6 detik belum load, hilangkan spinner (user mungkin bisa interaksi)
      setTimeout(() => {
        if (!loaded && loadingEl) loadingEl.style.display = 'none';
      }, 6000);

      // Close handlers
      const closeOverlay = () => overlay.remove();
      overlay.querySelector('[data-close-player]')?.addEventListener('click', closeOverlay);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeOverlay(); });

      const escHandler = (e) => {
        if (e.key === 'Escape') {
          closeOverlay();
          document.removeEventListener('keydown', escHandler);
        }
      };
      document.addEventListener('keydown', escHandler);
    };

    // ==========================================================
    //   PREVIEW MODAL (untuk PDF & image)
    // ==========================================================
    window.previewAsset = function(judul, driveId) {
      const cleaned = cleanDriveId(driveId);
      if (!isValidDriveId(cleaned)) { showToast('ID File tidak valid.', 'warning'); return; }

      document.getElementById('customPreviewModal')?.remove();

      const embedUrl = buildDrivePreviewUrl(cleaned);

      const overlay = document.createElement('div');
      overlay.id = 'customPreviewModal';
      overlay.className = 'custom-preview-overlay';
      overlay.innerHTML = `
        <div class="custom-preview-box">
          <div class="custom-preview-header">
            <h5><i class="bi bi-eye me-2"></i>${escapeHtml(judul || 'Pratinjau')}</h5>
            <button type="button" aria-label="Tutup" data-close-preview><i class="bi bi-x-lg"></i></button>
          </div>
          <div class="custom-preview-body">
            <div class="custom-preview-spinner" id="customPreviewSpinner">
              <div class="spinner-border text-light" role="status"><span class="visually-hidden">Memuat...</span></div>
            </div>
            <div class="custom-preview-error" id="customPreviewError">
              <i class="bi bi-exclamation-triangle-fill"></i>
              <p class="text-light mt-2">Gagal memuat file.<br><small>Pastikan file publik.</small></p>
            </div>
            <iframe id="previewContent" src="${embedUrl}" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
          </div>
        </div>`;
      document.body.appendChild(overlay);

      const iframe = document.getElementById('previewContent');
      const spinner = document.getElementById('customPreviewSpinner');
      const errorDiv = document.getElementById('customPreviewError');
      const hideSpinner = () => { if (spinner) spinner.style.display = 'none'; };
      const showError = () => { hideSpinner(); if (errorDiv) errorDiv.style.display = 'block'; };

      if (iframe) {
        iframe.addEventListener('load', () => {
          setTimeout(() => { hideSpinner(); iframe.classList.add('show'); }, 300);
        });
        iframe.addEventListener('error', showError);
        setTimeout(() => { if (spinner && spinner.style.display !== 'none') showError(); }, 12000);
      }

      overlay.querySelector('[data-close-preview]')?.addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', function(e) { if (e.target === this) this.remove(); });
      const escHandler = (e) => {
        if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', escHandler); }
      };
      document.addEventListener('keydown', escHandler);
    };

    // ==========================================================
    //   SMART OPEN — pilih modal berdasarkan jenis
    // ==========================================================
    window.openAssetSmart = function(judul, driveId, jenis, mimeType) {
      window.openAssetPlayer(judul, driveId, jenis, mimeType);
    };

    // ==========================================================
    //   DOWNLOAD (via anchor — works)
    // ==========================================================
    window.downloadAssetPublic = function(driveId, judul, fileName) {
      const cleaned = cleanDriveId(driveId);
      if (!isValidDriveId(cleaned)) { showToast('ID file tidak valid.', 'warning'); return; }

      showToast('Menyiapkan unduhan...', 'info');

      const downloadUrl = buildDriveDownloadUrl(cleaned);
      const safeName = sanitizeFilename(fileName || judul);

      try {
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = safeName;
        a.rel = 'noopener noreferrer';
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => showToast(`File "${safeName}" diunduh`, 'success'), 800);
      } catch (e) {
        const win = window.open(downloadUrl, '_blank', 'noopener,noreferrer');
        if (!win) showToast('Popup diblokir. Izinkan popup untuk mengunduh.', 'warning');
      }
    };

    // ==========================================================
    //   SHARE / COPY
    // ==========================================================
    window.copyAssetLinkPublic = function(driveId, judul) {
      if (!driveId) { showToast('ID file tidak valid.', 'warning'); return; }
      const url = buildDriveViewUrl(driveId);
      const fallbackCopy = () => {
        const input = document.createElement('input');
        input.value = url;
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        try { document.execCommand('copy'); showToast('Link disalin!', 'success'); }
        catch (e) { showToast('Gagal menyalin link.', 'error'); }
        document.body.removeChild(input);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(url).then(() => showToast('Link disalin!', 'success')).catch(fallbackCopy);
      } else { fallbackCopy(); }
    };

    window.shareAssetPublic = function(driveId, judul) {
      if (!driveId) { showToast('ID file tidak valid.', 'warning'); return; }
      const url = buildDriveViewUrl(driveId);
      if (navigator.share) {
        navigator.share({ title: judul || 'Aset PKD GP Ansor', url }).catch(() => {});
      } else { window.copyAssetLinkPublic(driveId, judul); }
    };

    window.shareViaWhatsAppPublic = function(driveId, judul) {
      if (!driveId) { showToast('ID file tidak valid.', 'warning'); return; }
      const url = buildDriveViewUrl(driveId);
      const text = encodeURIComponent(`Berbagi aset digital PKD GP Ansor Bantul:\n${judul}\n${url}`);
      window.open(`https://wa.me/?text=${text}`, '_blank', 'noopener,noreferrer');
    };

    // ==========================================================
    //   DOWNLOAD ALL
    // ==========================================================
    window.downloadAllInFolder = async function() {
      if (STATE.isDownloadingAll) return;
      const filtered = STATE.assetList.filter(item =>
        String(item.folderId || '') === String(STATE.currentFolderId || '')
      );
      if (filtered.length === 0) { showToast('Tidak ada aset untuk diunduh.', 'info'); return; }

      const folder = STATE.folderList.find(f => String(f.id) === String(STATE.currentFolderId));
      const folderName = folder ? folder.nama : 'Semua Aset';

      if (!confirm(`Unduh ${filtered.length} file dari "${folderName}"?\n\n` +
        `Browser akan membuka ${filtered.length} tab unduhan berurutan.\n` +
        `Pastikan popup tidak diblokir.`)) return;

      STATE.isDownloadingAll = true;
      const btn = document.getElementById('downloadAllBtn');
      const originalHtml = btn.innerHTML;
      btn.disabled = true;

      let successCount = 0;
      const DELAY_MS = 1000;

      for (let i = 0; i < filtered.length; i++) {
        const item = filtered[i];
        const cleaned = cleanDriveId(item.driveId);
        if (!isValidDriveId(cleaned)) continue;

        btn.innerHTML = `<i class="bi bi-cloud-arrow-down-fill"></i> <span>${i + 1}/${filtered.length}...</span>`;

        try {
          const url = buildDriveDownloadUrl(cleaned);
          const a = document.createElement('a');
          a.href = url;
          a.download = sanitizeFilename(item.fileName || item.judul) || `asset_${i + 1}`;
          a.rel = 'noopener noreferrer';
          a.target = '_blank';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          successCount++;
        } catch (e) { console.warn('Gagal:', item.judul, e.message); }

        if (i < filtered.length - 1) {
          await new Promise(r => setTimeout(r, DELAY_MS));
        }
      }

      btn.innerHTML = originalHtml;
      btn.disabled = false;
      STATE.isDownloadingAll = false;
      showToast(`${successCount}/${filtered.length} file di-trigger untuk diunduh`, 'success');
    };

    document.getElementById('downloadAllBtn')?.addEventListener('click', () => {
      window.downloadAllInFolder();
    });

    // ==========================================================
    //   RENDER FOLDER LIST
    // ==========================================================
    function renderFolderList() {
      const c = document.getElementById('folderList');
      if (!STATE.folderList || STATE.folderList.length === 0) {
        c.innerHTML = `<div class="text-center text-muted small py-3">Belum ada folder publik.</div>`;
        return;
      }
      let html = '';
      STATE.folderList.forEach(f => {
        const hasPassword = parseBool(f.hasPassword);
        const isUnlocked = STATE.unlockedFolders.has(String(f.id));
        const isActive = STATE.currentFolderId == f.id;
        let lockIcon = '';
        if (hasPassword && !isUnlocked) {
          lockIcon = '<i class="bi bi-lock-fill lock-icon" title="Terproteksi"></i>';
        } else if (hasPassword && isUnlocked) {
          lockIcon = '<i class="bi bi-unlock-fill lock-icon text-success" title="Sudah dibuka"></i>';
        }
        html += `
          <div class="folder-item ${isActive ? 'active' : ''}" data-folder-id="${f.id}" onclick="navigateFolder('${f.id}')">
            <i class="bi bi-folder-fill"></i>
            <span>${escapeHtml(f.nama || '-')}</span>
            ${lockIcon}
          </div>`;
      });
      c.innerHTML = html;
    }

    // ==========================================================
    //   RENDER BREADCRUMB
    // ==========================================================
    function renderBreadcrumb() {
      const c = document.getElementById('breadcrumb');
      if (STATE.currentFolderId === '') {
        c.innerHTML = `<li class="breadcrumb-item active">Semua Aset</li>`;
        return;
      }
      const folder = STATE.folderList.find(f => f.id == STATE.currentFolderId);
      if (folder) {
        c.innerHTML = `
          <li class="breadcrumb-item"><a href="#" onclick="navigateFolder(''); return false;">Semua Aset</a></li>
          <li class="breadcrumb-item active">${escapeHtml(folder.nama)}</li>`;
      } else {
        c.innerHTML = `<li class="breadcrumb-item active">Semua Aset</li>`;
      }
    }

    // ==========================================================
    //   RENDER ASSETS
    // ==========================================================
    function renderAssets() {
      const c = document.getElementById('assetContainer');
      const toolbar = document.getElementById('assetToolbar');
      const countEl = document.getElementById('assetCount');

      if (STATE.folderPasswordRequired && !STATE.folderPasswordAttempted) {
        c.innerHTML = `<div class="text-center py-5 text-muted"><i class="bi bi-lock-fill fs-4 d-block mb-2"></i>Folder ini dilindungi password.</div>`;
        if (toolbar) toolbar.style.display = 'none';
        return;
      }

      const filtered = STATE.assetList.filter(item =>
        String(item.folderId || '') === String(STATE.currentFolderId || '')
      );
      filtered.sort((a, b) => String(a.judul || '').localeCompare(String(b.judul || '')));

      if (filtered.length === 0) {
        c.innerHTML = `<div class="alert alert-info text-center"><i class="bi bi-image fs-4 d-block mb-2"></i>Belum ada aset di folder ini.</div>`;
        if (toolbar) toolbar.style.display = 'none';
        return;
      }

      if (toolbar) toolbar.style.display = 'flex';
      if (countEl) countEl.innerHTML = `<strong>${filtered.length}</strong> file tersedia`;

      let html = '<div class="asset-grid">';
      filtered.forEach(item => {
        const cleaned = cleanDriveId(item.driveId);
        const valid = isValidDriveId(cleaned);
        const imgUrl = valid ? `https://drive.google.com/thumbnail?id=${cleaned}&sz=w400` : '';

        const jenis = String(item.jenis || '').toLowerCase();
        const mime = String(item.mimeType || '');
        const isVideo = jenis === 'video' || mime.startsWith('video/');
        const isPdf = jenis === 'dokumen' || jenis === 'sertifikat' || mime === 'application/pdf';
        const isAudio = jenis === 'audio' || mime.startsWith('audio/');

        let previewContent = '';
        if (valid) {
          if (isPdf) {
            previewContent = `<div class="thumbnail-container"><div class="fallback" style="display:flex;"><i class="bi bi-file-earmark-pdf-fill text-danger" style="font-size:2.5rem;"></i><div class="small text-muted mt-2">PDF</div></div></div>`;
          } else if (isAudio) {
            previewContent = `<div class="thumbnail-container" style="background:linear-gradient(135deg,#dbeafe,#bfdbfe);"><div class="fallback" style="background:transparent;"><i class="bi bi-music-note-beamed text-primary" style="font-size:3rem;"></i><div class="small text-muted mt-2">🎵 Tap untuk putar</div></div></div>`;
          } else if (isVideo) {
            previewContent = `<div class="thumbnail-container"><img src="${imgUrl}" alt="${escapeHtml(item.judul)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="fallback" style="display:none;background:linear-gradient(135deg,#1e293b,#0f172a);color:white;"><i class="bi bi-play-circle-fill" style="font-size:3rem;color:#60a5fa;"></i><div class="small mt-2">▶️ Tap untuk putar</div></div></div>`;
          } else {
            previewContent = `<div class="thumbnail-container"><img src="${imgUrl}" alt="${escapeHtml(item.judul)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="fallback" style="display:none;"><i class="bi bi-file-earmark-fill text-secondary" style="font-size:2.5rem;"></i><div class="small text-muted mt-2">Thumbnail gagal</div></div></div>`;
          }
        } else {
          previewContent = `<div class="thumbnail-container" style="background:#f8fafc;"><div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;"><i class="bi bi-file-earmark-fill text-secondary" style="font-size:2.5rem;"></i><div class="small text-muted mt-2">ID rusak</div></div></div>`;
        }

        const safeJudul = escapeHtml(item.judul || '');
        const safeJudulForAttr = String(item.judul || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        const safeFileNameForAttr = String(item.fileName || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        const safeMimeForAttr = String(item.mimeType || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        const safeJenisForAttr = String(item.jenis || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');

        html += `
          <div class="asset-card" onclick="openAssetSmart('${safeJudulForAttr}', '${cleaned}', '${safeJenisForAttr}', '${safeMimeForAttr}')">
            ${previewContent}
            <div class="card-body">
              <div class="card-title">${safeJudul}</div>
              <div class="card-text">${escapeHtml(item.deskripsi || '')}</div>
              <div class="card-actions">
                ${valid ? `
                  <button class="btn btn-sm btn-download" onclick="event.stopPropagation(); downloadAssetPublic('${cleaned}', '${safeJudulForAttr}', '${safeFileNameForAttr}')" title="Download" aria-label="Download">
                    <i class="bi bi-download"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-secondary" onclick="event.stopPropagation(); copyAssetLinkPublic('${cleaned}', '${safeJudulForAttr}')" title="Salin Link" aria-label="Salin Link">
                    <i class="bi bi-link-45deg"></i>
                  </button>
                  <button class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation(); shareAssetPublic('${cleaned}', '${safeJudulForAttr}')" title="Bagikan" aria-label="Bagikan">
                    <i class="bi bi-share"></i>
                  </button>
                  <button class="btn btn-sm btn-success" onclick="event.stopPropagation(); shareViaWhatsAppPublic('${cleaned}', '${safeJudulForAttr}')" title="WhatsApp" aria-label="WhatsApp">
                    <i class="bi bi-whatsapp"></i>
                  </button>
                ` : ''}
              </div>
              <div class="mt-2 text-end text-muted small">${formatDate(item.timestamp)}</div>
            </div>
          </div>`;
      });
      html += '</div>';
      c.innerHTML = html;
    }

    // ==========================================================
    //   NAVIGATE FOLDER
    // ==========================================================
    window.navigateFolder = function(folderId) {
      STATE.currentFolderId = folderId || '';
      STATE.folderPasswordAttempted = false;
      STATE.folderPasswordRequired = false;

      const folder = STATE.folderList.find(f => String(f.id) === String(folderId));
      if (folder) {
        const hasPassword = parseBool(folder.hasPassword);
        const isUnlocked = STATE.unlockedFolders.has(String(folder.id));
        if (hasPassword && !isUnlocked) {
          STATE.folderPasswordRequired = true;
          renderFolderList();
          renderBreadcrumb();
          renderAssets();
          showFolderPasswordOverlay(folderId);
          return;
        }
      }
      STATE.folderPasswordAttempted = true;
      renderFolderList();
      renderBreadcrumb();
      renderAssets();
    };

    // ==========================================================
    //   FOLDER PASSWORD OVERLAY
    // ==========================================================
    function showFolderPasswordOverlay(folderId) {
      document.getElementById('folderPasswordOverlay')?.remove();
      const overlay = document.createElement('div');
      overlay.id = 'folderPasswordOverlay';
      overlay.innerHTML = `
        <div class="lock-box">
          <i class="bi bi-folder-lock fs-1 text-warning mb-3"></i>
          <h5 class="fw-bold">Folder Terproteksi</h5>
          <p class="text-muted small">Masukkan password untuk mengakses folder ini.</p>
          <div class="input-group mb-3">
            <input type="password" class="form-control" id="folderPasswordInputPublic" placeholder="Password folder" autocomplete="off">
            <button class="btn btn-outline-secondary" type="button" id="toggleFolderPassBtn"><i class="bi bi-eye"></i></button>
          </div>
          <button class="btn btn-primary w-100 rounded-pill py-2" id="unlockFolderBtn">
            <i class="bi bi-unlock-fill me-1"></i> Buka Kunci
          </button>
          <div id="folderPasswordError" class="text-danger small mt-2" style="display:none;"></div>
          <button class="btn btn-link btn-sm text-muted mt-2" id="cancelFolderUnlockBtn">Kembali ke Semua Aset</button>
        </div>`;
      document.body.appendChild(overlay);

      const input = document.getElementById('folderPasswordInputPublic');
      const errDiv = document.getElementById('folderPasswordError');
      const unlockBtn = document.getElementById('unlockFolderBtn');
      const toggleBtn = document.getElementById('toggleFolderPassBtn');

      input?.focus();
      toggleBtn?.addEventListener('click', () => {
        input.type = input.type === 'password' ? 'text' : 'password';
        const i = toggleBtn.querySelector('i');
        if (i) i.className = input.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
      });
      input?.addEventListener('keypress', (e) => { if (e.key === 'Enter') unlockBtn?.click(); });
      document.getElementById('cancelFolderUnlockBtn')?.addEventListener('click', () => window.cancelFolderUnlock());

      unlockBtn?.addEventListener('click', async function() {
        const pass = input.value.trim();
        if (!pass) { errDiv.style.display = 'block'; errDiv.innerText = 'Password wajib diisi.'; return; }
        const btn = this;
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Memeriksa...';
        try {
          const result = await callApi('verifyFolderPassword', { id: folderId, password: pass }, 'GET');
          if (result && result.success) {
            STATE.unlockedFolders.add(String(folderId));
            document.getElementById('folderPasswordOverlay')?.remove();
            STATE.folderPasswordAttempted = true;
            STATE.folderPasswordRequired = false;
            renderFolderList();
            renderBreadcrumb();
            renderAssets();
            showToast('Folder terbuka', 'success');
          } else {
            errDiv.style.display = 'block';
            errDiv.innerText = (result && result.error) || 'Password salah.';
            btn.disabled = false;
            btn.innerHTML = originalHtml;
          }
        } catch (err) {
          errDiv.style.display = 'block';
          errDiv.innerText = 'Terjadi kesalahan: ' + (err.message || '');
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      });
    }

    window.cancelFolderUnlock = function() {
      document.getElementById('folderPasswordOverlay')?.remove();
      STATE.currentFolderId = '';
      STATE.folderPasswordRequired = false;
      STATE.folderPasswordAttempted = true;
      renderFolderList();
      renderBreadcrumb();
      renderAssets();
    };

    // ==========================================================
    //   PROCESS & RENDER
    // ==========================================================
    function processAndRender(targetFolderId) {
      if (targetFolderId) {
        STATE.folderList = STATE.rawFoldersData.filter(f =>
          String(f.id) === String(targetFolderId) && parseBool(f.isPublic)
        );
      } else {
        STATE.folderList = STATE.rawFoldersData.filter(f =>
          parseBool(f.isPublic) && !parseBool(f.hideFromGallery)
        );
      }
      STATE.assetList = STATE.rawAssetsData;
      STATE.currentFolderId = targetFolderId ? String(targetFolderId) : '';

      if (STATE.isSingleFolderMode) {
        const sb = document.getElementById('sidebarContainer');
        if (sb) sb.style.display = 'none';
        const cc = document.getElementById('contentContainer');
        if (cc) { cc.classList.remove('col-md-9'); cc.classList.add('col-md-12'); }
      }

      if (STATE.isSingleFolderMode && STATE.currentFolderId) {
        const folder = STATE.folderList[0];
        if (folder && parseBool(folder.hasPassword) && !STATE.unlockedFolders.has(String(folder.id))) {
          STATE.folderPasswordRequired = true;
          STATE.folderPasswordAttempted = false;
          renderFolderList();
          renderBreadcrumb();
          renderAssets();
          showFolderPasswordOverlay(STATE.currentFolderId);
          return;
        }
      }

      STATE.folderPasswordAttempted = true;
      renderFolderList();
      renderBreadcrumb();
      renderAssets();
    }

    // ==========================================================
    //   GLOBAL PASSWORD OVERLAY
    // ==========================================================
    function showGlobalPasswordOverlay() {
      const overlay = document.getElementById('passwordLockOverlay');
      const input = document.getElementById('publicAccessPassword');
      const errDiv = document.getElementById('publicLockError');
      const unlockBtn = document.getElementById('unlockPublicBtn');

      overlay.style.display = 'flex';
      input.value = '';
      errDiv.style.display = 'none';
      input.focus();

      const newBtn = unlockBtn.cloneNode(true);
      unlockBtn.parentNode.replaceChild(newBtn, unlockBtn);

      newBtn.addEventListener('click', async function() {
        const pass = input.value.trim();
        if (!pass) { errDiv.style.display = 'block'; errDiv.innerText = 'Password wajib diisi.'; return; }
        const btn = this;
        btn.disabled = true;
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Memeriksa...';
        try {
          const result = await callApi('verifyAssetPublicPassword', { password: pass }, 'GET');
          if (result && result.success) {
            sessionStorage.setItem('public_asset_auth', 'true');
            errDiv.style.display = 'none';
            overlay.style.display = 'none';
            processAndRender(STATE.pendingFolderId);
          } else {
            errDiv.style.display = 'block';
            errDiv.innerText = (result && result.error) || 'Password salah.';
            btn.disabled = false;
            btn.innerHTML = originalHtml;
          }
        } catch (err) {
          errDiv.style.display = 'block';
          errDiv.innerText = 'Terjadi kesalahan: ' + (err.message || '');
          btn.disabled = false;
          btn.innerHTML = originalHtml;
        }
      });
      input.addEventListener('keypress', (e) => { if (e.key === 'Enter') newBtn.click(); });
    }

    // ==========================================================
    //   BOOT — tanpa Service Worker
    // ==========================================================
    (async function boot() {
      renderSkeletonFolderList();
      renderSkeletonAssets();

      const urlParams = new URLSearchParams(window.location.search);
      const targetFolderId = urlParams.get('folderId');
      STATE.isSingleFolderMode = !!targetFolderId;
      STATE.pendingFolderId = targetFolderId;

      try {
        const [configRes, assetsRes, foldersRes] = await Promise.all([
          callApi('getAssetPublicConfig', {}, 'GET'),
          callApi('getAssetList', { _t: Date.now() }, 'GET'),
          callApi('getFolders', { _t: Date.now(), all: 'true' }, 'GET')
        ]);

        STATE.rawConfigData = configRes;
        STATE.rawAssetsData = normalizeResult(assetsRes);
        STATE.rawFoldersData = normalizeResult(foldersRes);

        const globalEnabled = configRes && configRes.success && configRes.enabled;
        if (!globalEnabled) {
          document.getElementById('assetContainer').innerHTML = `
            <div class="alert alert-info text-center">
              <i class="bi bi-info-circle fs-4 d-block mb-2"></i>
              <strong>Galeri publik tidak aktif.</strong><br>
              <small>Hubungi admin untuk informasi lebih lanjut.</small>
            </div>`;
          document.getElementById('sidebarContainer').style.display = 'none';
          document.getElementById('contentContainer').classList.remove('col-md-9');
          document.getElementById('contentContainer').classList.add('col-md-12');
          return;
        }

        const needsGlobalPassword = parseBool(configRes.hasPassword);
        const sessionAuth = sessionStorage.getItem('public_asset_auth') === 'true';
        if (needsGlobalPassword && !sessionAuth) {
          showGlobalPasswordOverlay();
          return;
        }

        processAndRender(targetFolderId);
      } catch (e) {
        console.error('[public_assets] Boot error:', e);
        document.getElementById('assetContainer').innerHTML = `
          <div class="alert alert-danger text-center">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            Gagal memuat data.<br>
            <small>${escapeHtml(e.message || 'Network error')}</small>
            <div class="mt-2">
              <button class="btn btn-sm btn-outline-danger" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise me-1"></i>Coba Lagi
              </button>
            </div>
          </div>`;
      }
    })();

    console.log(
      '%c Public Assets v26.2.1 — Iframe Player (Fix 403) ',
      'background:#16a34a;color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;'
    );
  </script>
</body>
</html>
