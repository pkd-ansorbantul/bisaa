<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Pre-test PKD GP Ansor Kabupaten Bantul">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>Pre-test · PKD GP Ansor Bantul</title>

  <link rel="icon" type="image/webp" href="/bisaa/LOGOANSOR.webp">
  <link rel="apple-touch-icon" href="/bisaa/LOGOANSOR.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    body {
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ============ HEADER ============ */
    .header-minimal {
      background: rgba(255, 255, 255, 0.72) !important;
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      z-index: 1030;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.04);
      padding: 0 !important;
    }
    .header-minimal .container { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .btn-back {
      background: rgba(37, 99, 235, 0.08);
      color: #2563eb;
      border: 1px solid rgba(37, 99, 235, 0.2);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .btn-back:hover {
      background: #2563eb;
      color: white;
      transform: translateX(-3px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
    .brand-logo-mini { height: 40px; width: auto; margin-right: 14px; transition: transform 0.2s; }
    .brand-logo-mini:hover { transform: scale(1.05); }
    .brand-title-mini { font-weight: 700; color: #0a3d62; font-size: 1.3rem; line-height: 1.2; letter-spacing: -0.02em; }
    .brand-sub-mini { font-size: 0.8rem; color: #64748b; display: block; margin-top: 0; letter-spacing: 0.02em; }

    #navbarUserMenu { display: flex; align-items: center; gap: 8px; }
    .user-menu-area .dropdown-toggle { border-radius: 50px; padding: 0.3rem 1rem; font-size: 0.9rem; }
    .user-menu-area .btn-outline-primary { border-radius: 50px; padding: 0.3rem 1.2rem; font-size: 0.9rem; }

    /* ============ CACHE INDICATOR ============ */
    .cache-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      transition: all 0.3s ease;
      opacity: 0.7;
    }
    .cache-indicator.instant { background: rgba(22, 163, 74, 0.1); color: #15803d; }
    .cache-indicator.loading { background: rgba(37, 99, 235, 0.1); color: #1e40af; }
    .cache-indicator.updated {
      background: rgba(22, 163, 74, 0.15); color: #15803d;
      opacity: 1;
      animation: pulse-badge 0.5s ease;
    }
    @keyframes pulse-badge {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    /* ============ GLASS CARD ============ */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .section-title {
      font-weight: 650;
      font-size: 1.5rem;
      border-left: 6px solid #2563eb;
      padding-left: 1rem;
      margin-bottom: 1rem;
      color: #0f172a;
    }

    /* ============ SKELETON ============ */
    .skeleton-box {
      background: linear-gradient(90deg, #e2e8f0 0%, #f1f5f9 50%, #e2e8f0 100%);
      background-size: 200% 100%;
      border-radius: 8px;
      animation: shimmer 1.5s infinite linear;
      display: inline-block;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ============ QUIZ UI ============ */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      background: #f1f5f9;
      padding: 14px 24px;
      border-radius: 60px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .timer-box {
      background: #0f172a;
      color: white;
      padding: 8px 22px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1.25rem;
      transition: all 0.3s ease;
    }
    .timer-box.warning { background: #dc2626; animation: pulse-timer 1s ease-in-out infinite; }
    @keyframes pulse-timer {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .score-box {
      background: #fbbf24;
      color: #0f172a;
      padding: 8px 22px;
      border-radius: 40px;
      font-weight: 700;
    }
    .progress-box { font-weight: 600; color: #2563eb; }
    .question-text {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 30px;
      line-height: 1.4;
      color: #0f172a;
    }
    .kahoot-options-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 10px;
    }
    .kahoot-option {
      display: flex !important;
      align-items: center;
      padding: 1rem 1.5rem !important;
      border: none !important;
      border-radius: 18px !important;
      color: white !important;
      font-weight: 600 !important;
      font-size: 1.1rem !important;
      transition: transform 0.12s, box-shadow 0.15s !important;
      box-shadow: 0 6px 12px rgba(0,0,0,0.12) !important;
      width: 100%;
      text-align: left;
    }
    .kahoot-option:active { transform: scale(0.95); }
    .opt-red { background-color: #dc2626; }
    .opt-blue { background-color: #2563eb; }
    .opt-yellow { background-color: #eab308; color: #0f172a !important; }
    .opt-green { background-color: #16a34a; }
    .kahoot-option.correct { box-shadow: 0 0 0 4px #22c55e !important; transform: scale(1.02); }
    .kahoot-option.wrong { box-shadow: 0 0 0 4px #ef4444 !important; transform: scale(0.95); }
    .kahoot-option .opt-letter { font-weight: 700; margin-right: 0.75rem; flex-shrink: 0; }

    .progress-thin {
      height: 6px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-thin .progress-bar {
      background: linear-gradient(90deg, #2563eb, #7dd3fc);
      transition: width 0.5s ease;
    }

    .fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer-modern {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: auto;
      text-align: center;
      padding: 1.5rem 0;
      border-top: 1px solid #e2e8f0;
      background: white;
    }

    @media (max-width: 576px) {
      .glass-card { border-radius: 16px; padding: 1rem !important; }
      .header-minimal .container { padding: 0 0.5rem; }
      .btn-back { font-size: 0.8rem; padding: 0.2rem 0.8rem; }
      .brand-title-mini, .brand-sub-mini { display: none; }
      .user-menu-area .dropdown-toggle { font-size: 0.75rem; padding: 0.2rem 0.8rem; }
      .kahoot-options-grid { grid-template-columns: 1fr; }
      .quiz-header { flex-direction: column; align-items: stretch; text-align: center; }
      .question-text { font-size: 1.2rem; }
      .cache-indicator { font-size: 0.65rem; }
    }
  </style>
</head>
<body>

  <header class="header-minimal sticky-top shadow-sm">
    <div class="container d-flex justify-content-between align-items-center py-3">
      <div class="d-flex align-items-center gap-2">
        <a href="/bisaa/index.html" class="btn btn-back rounded-pill">
          <i class="bi bi-arrow-left me-1" aria-hidden="true"></i> Kembali
        </a>
        <a href="/bisaa/index.html" class="brand-minimal text-decoration-none d-flex align-items-center ms-1">
          <img src="/bisaa/LOGOANSOR.webp" alt="GP Ansor" class="brand-logo-mini">
          <div>
            <div class="brand-title-mini">PKD GP Ansor</div>
            <span class="brand-sub-mini">Kabupaten Bantul</span>
          </div>
        </a>
      </div>
      <div id="navbarUserMenu" class="user-menu-area"></div>
    </div>
  </header>

  <div id="contentArea" class="container" style="padding: 2rem 0; max-width: 900px;">
    <div class="glass-card p-4 fade-up">
      <div class="d-flex align-items-center flex-wrap gap-2 mb-3">
        <h2 class="section-title mb-0" style="border-left: none; padding-left: 0;">
          <i class="bi bi-arrow-repeat me-2"></i>Pre-test — Kahoot Style
        </h2>
        <span id="cacheIndicator" class="cache-indicator loading" aria-live="polite">
          <span class="spinner-border spinner-border-sm" style="width:10px;height:10px;border-width:1.5px;" role="status" aria-hidden="true"></span>
          <span id="cacheIndicatorText">Memuat…</span>
        </span>
      </div>
      <div id="pretestContainer" aria-live="polite"></div>
    </div>
  </div>

  <footer class="footer-modern container">
    <div class="d-flex justify-content-center align-items-center gap-2">
      <i class="bi bi-c-circle" aria-hidden="true"></i>
      <span>Hak Cipta 2026 — Tim Instruktur GP Ansor Kabupaten Bantul</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    // ============================================================
    //   pretest.html v28.4.0 — INSTANT LOAD + AUTO UPDATE
    // ============================================================

    import {
      guardPublicAccess,
      submitPretest,
      showToast,
      escapeHtml,
      updateNavbarMenu,
    } from '/bisaa/js/core/api.js';

    import { createPublicCache } from '/bisaa/js/core/public-cache.js';

    // ============================================================
    //   CONSTANTS
    // ============================================================
    const FORM_STATE_KEY = 'pkd_pretest_state_v2';
    const TIMER_WARNING_THRESHOLD = 10;

    // ============================================================
    //   STATE
    // ============================================================
    const STATE = {
      questions: [],
      quiz: null,
      timer: null,
      isMounted: false,
      isSubmitting: false,
      cacheInstance: null,
      cacheIndicatorTimer: null,
    };

    // ============================================================
    //   CACHE INDICATOR
    // ============================================================
    function setCacheIndicator(state, text) {
      const el = document.getElementById('cacheIndicator');
      const textEl = document.getElementById('cacheIndicatorText');
      if (!el || !textEl) return;

      if (STATE.cacheIndicatorTimer) {
        clearTimeout(STATE.cacheIndicatorTimer);
        STATE.cacheIndicatorTimer = null;
      }

      el.className = 'cache-indicator ' + state;
      textEl.textContent = text || '';

      if (state === 'updated') {
        STATE.cacheIndicatorTimer = setTimeout(() => {
          el.className = 'cache-indicator instant';
          textEl.textContent = 'Instan';
        }, 2000);
      }
    }

    // ============================================================
    //   UTILITY — Safe localStorage
    // ============================================================
    function safeLS(fn) {
      try { return fn(); } catch (e) { return null; }
    }

    function saveState() {
      if (!STATE.quiz) return;
      const snapshot = {
        currentIndex: STATE.quiz.currentIndex,
        score: STATE.quiz.score,
        answers: STATE.quiz.answers,
        nama: STATE.quiz.nama,
        nohp: STATE.quiz.nohp,
        alamat: STATE.quiz.alamat,
        started: STATE.quiz.started,
        isFinished: STATE.quiz.isFinished,
        questionIds: STATE.questions.map(q => String(q.id)),
        ts: Date.now(),
      };
      safeLS(() => localStorage.setItem(FORM_STATE_KEY, JSON.stringify(snapshot)));
    }

    function loadState() {
      const raw = safeLS(() => localStorage.getItem(FORM_STATE_KEY));
      if (!raw) return null;
      try {
        const s = JSON.parse(raw);
        // Expire after 24h
        if (s.ts && (Date.now() - s.ts) > 24 * 60 * 60 * 1000) {
          clearState();
          return null;
        }
        // Cek apakah questionIds masih relevan dengan questions yang ada
        if (Array.isArray(s.questionIds) && STATE.questions.length > 0) {
          const currentIds = STATE.questions.map(q => String(q.id));
          const sameSet = s.questionIds.length === currentIds.length &&
                          s.questionIds.every((id, i) => id === currentIds[i]);
          if (!sameSet && s.started && !s.isFinished) {
            console.warn('[Pretest] Question set changed — resetting quiz state');
            clearState();
            return null;
          }
        }
        return s;
      } catch { return null; }
    }

    function clearState() {
      safeLS(() => localStorage.removeItem(FORM_STATE_KEY));
    }

    // ============================================================
    //   TIMER CLEANUP
    // ============================================================
    function stopTimer() {
      if (STATE.timer) {
        clearInterval(STATE.timer);
        STATE.timer = null;
      }
    }

    window.addEventListener('beforeunload', stopTimer);
    window.addEventListener('pagehide', stopTimer);

    // ============================================================
    //   RENDER — Form Data Diri
    // ============================================================
    function renderFormDataDiri() {
      const c = document.getElementById('pretestContainer');
      if (!c) return;

      if (!STATE.questions || STATE.questions.length === 0) {
        c.innerHTML = `
          <div class="alert alert-warning text-center">
            <i class="bi bi-exclamation-triangle fs-4 d-block mb-2" aria-hidden="true"></i>
            <strong>Belum ada soal pretest yang tersedia.</strong>
            <p class="small mb-0 mt-2">Silakan hubungi admin atau coba refresh halaman.</p>
          </div>
        `;
        return;
      }

      const saved = loadState();
      const nama = saved?.nama || '';
      const nohp = saved?.nohp || '';
      const alamat = saved?.alamat || '';

      c.innerHTML = `
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <span class="badge bg-success text-white">
            <i class="bi bi-check-circle me-1" aria-hidden="true"></i>
            ${STATE.questions.length} soal siap
          </span>
        </div>

        <div class="glass-card" style="background:#f8fafc;padding:1.5rem;">
          <h4 class="mb-4">📝 Isi Data Diri untuk Memulai Pretest</h4>

          <div class="mb-3">
            <label class="form-label fw-bold" for="pretestNama">Nama Lengkap <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="pretestNama" value="${escapeHtml(nama)}"
                   placeholder="Masukkan nama lengkap" autocomplete="name" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" for="pretestNohp">Nomor HP <span class="text-danger">*</span></label>
            <input type="tel" class="form-control" id="pretestNohp" value="${escapeHtml(nohp)}"
                   placeholder="Masukkan nomor HP" autocomplete="tel" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold" for="pretestAlamat">Alamat <span class="text-danger">*</span></label>
            <textarea class="form-control" id="pretestAlamat" rows="2"
                      placeholder="Masukkan alamat" required>${escapeHtml(alamat)}</textarea>
          </div>

          <div class="text-center mt-4">
            <button id="startBtn" type="button" class="btn btn-success btn-lg rounded-pill px-5">
              🚀 Mulai Pretest
            </button>
          </div>
        </div>
      `;

      document.getElementById('startBtn')?.addEventListener('click', () => {
        const nama = document.getElementById('pretestNama').value.trim();
        const nohp = document.getElementById('pretestNohp').value.trim();
        const alamat = document.getElementById('pretestAlamat').value.trim();

        if (!nama || !nohp || !alamat) {
          showToast('Nama, No HP, dan Alamat wajib diisi!', 'warning');
          return;
        }

        STATE.quiz = {
          questions: STATE.questions.slice(),
          currentIndex: 0,
          score: 0,
          answers: [],
          nama, nohp, alamat,
          started: true,
          isFinished: false,
        };
        saveState();
        renderQuestion();
      });

      // Resume quiz jika ada
      if (saved && !saved.isFinished && saved.started) {
        if (confirm('Anda memiliki Pretest yang belum selesai. Lanjutkan?')) {
          STATE.quiz = {
            questions: STATE.questions.slice(),
            currentIndex: saved.currentIndex || 0,
            score: saved.score || 0,
            answers: saved.answers || [],
            nama: saved.nama,
            nohp: saved.nohp,
            alamat: saved.alamat,
            started: true,
            isFinished: false,
          };
          renderQuestion();
        } else {
          clearState();
        }
      }
    }

    // ============================================================
    //   RENDER — Question
    // ============================================================
    function renderQuestion() {
      const c = document.getElementById('pretestContainer');
      const quiz = STATE.quiz;
      if (!c || !quiz) return;

      if (!quiz.started) { renderFormDataDiri(); return; }
      if (quiz.currentIndex >= quiz.questions.length) { renderSummary(); return; }

      const q = quiz.questions[quiz.currentIndex];
      const timerDuration = (q.timer_enabled ? (parseInt(q.timer_duration) || 30) : 30);
      const answered = quiz.answers[quiz.currentIndex] !== undefined;

      const options = Array.isArray(q.opsi)
        ? q.opsi
        : String(q.opsi || '').split(',').map(s => s.trim()).filter(Boolean);

      const colors = ['opt-red', 'opt-blue', 'opt-yellow', 'opt-green'];
      const optionBtns = options.map((opt, i) => {
        const isCorrect = i === q.jawaban;
        const isSelected = answered && quiz.answers[quiz.currentIndex].selectedOption === i;
        let extra = '';
        if (answered) {
          if (isCorrect) extra = ' correct';
          else if (isSelected) extra = ' wrong';
        }
        return `
          <button type="button" class="kahoot-option ${colors[i % 4]}${extra}"
                  data-opt-index="${i}" ${answered ? 'disabled' : ''}>
            <span class="opt-letter">${String.fromCharCode(65 + i)}.</span>
            <span class="opt-text">${escapeHtml(opt)}</span>
          </button>
        `;
      }).join('');

      c.innerHTML = `
        <div class="glass-card" style="background:#f8fafc;padding:1.5rem;">
          <div class="quiz-header">
            <div class="timer-box" id="timerBox">
              <i class="bi bi-hourglass-split" aria-hidden="true"></i>
              <span id="timerDisplay" aria-live="polite">${timerDuration}</span> detik
            </div>
            <div class="score-box"><i class="bi bi-star-fill" aria-hidden="true"></i> Skor: ${quiz.score}</div>
            <div class="progress-box"><i class="bi bi-list-ol" aria-hidden="true"></i> ${quiz.currentIndex + 1}/${quiz.questions.length}</div>
          </div>

          <div class="mb-3 small text-muted">
            Nama: ${escapeHtml(quiz.nama)} | No HP: ${escapeHtml(quiz.nohp)}
          </div>

          <div class="question-text">${quiz.currentIndex + 1}. ${escapeHtml(q.teks)}</div>

          <div class="kahoot-options-grid">${optionBtns}</div>

          ${answered ? `
            <div class="mt-4 text-center">
              <button id="nextBtn" type="button" class="btn btn-primary btn-lg rounded-pill px-5">
                ${quiz.currentIndex === quiz.questions.length - 1 ? 'Lihat Hasil' : 'Selanjutnya'} <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i>
              </button>
            </div>
          ` : ''}

          <div class="progress-thin mt-3">
            <div class="progress-bar" style="width: ${((quiz.currentIndex + 1) / quiz.questions.length) * 100}%;"></div>
          </div>
        </div>
      `;

      // Bind option clicks
      c.querySelectorAll('.kahoot-option').forEach(btn => {
        btn.addEventListener('click', function () {
          if (quiz.answers[quiz.currentIndex] !== undefined) return;
          const optIdx = parseInt(this.dataset.optIndex, 10);
          const isCorrect = (optIdx === q.jawaban);
          if (isCorrect) quiz.score += 10;
          quiz.answers[quiz.currentIndex] = {
            questionId: q.id,
            selectedOption: optIdx,
            isCorrect,
          };
          saveState();
          stopTimer();
          setTimeout(renderQuestion, 800);
        });
      });

      // Next button
      document.getElementById('nextBtn')?.addEventListener('click', () => {
        stopTimer();
        STATE.quiz.currentIndex++;
        saveState();
        renderQuestion();
      });

      // Timer — only if not answered
      stopTimer();
      if (!answered) {
        let timeLeft = timerDuration;
        const timerBox = document.getElementById('timerBox');
        const timerDisplay = document.getElementById('timerDisplay');

        STATE.timer = setInterval(() => {
          timeLeft--;
          if (timerDisplay) timerDisplay.textContent = timeLeft;
          if (timerBox && timeLeft <= TIMER_WARNING_THRESHOLD) {
            timerBox.classList.add('warning');
          }
          if (timeLeft <= 0) {
            stopTimer();
            if (quiz.answers[quiz.currentIndex] === undefined) {
              quiz.answers[quiz.currentIndex] = {
                questionId: q.id,
                selectedOption: null,
                isCorrect: false,
              };
              saveState();
              renderQuestion();
            }
          }
        }, 1000);
      }
    }

    // ============================================================
    //   RENDER — Summary
    // ============================================================
    function renderSummary() {
      const c = document.getElementById('pretestContainer');
      const quiz = STATE.quiz;
      if (!c || !quiz) return;

      stopTimer();
      quiz.isFinished = true;
      saveState();

      const total = quiz.questions.length;
      const correct = quiz.answers.filter(a => a && a.isCorrect).length;
      const score = quiz.score;
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

      c.innerHTML = `
        <div class="glass-card text-center" style="background:#f8fafc;padding:1.5rem;">
          <h3 class="mb-4">🎉 Pretest Selesai! 🎉</h3>
          <div class="display-1 mb-3 fw-bold text-primary">${score}</div>
          <p class="lead">Jawaban benar: <strong>${correct}</strong> dari ${total} (${pct}%)</p>
          <hr>
          <div class="text-start small mb-3">
            <div class="row g-2">
              <div class="col-sm-6"><strong>Nama:</strong> ${escapeHtml(quiz.nama || '')}</div>
              <div class="col-sm-6"><strong>No HP:</strong> ${escapeHtml(quiz.nohp || '')}</div>
              <div class="col-12"><strong>Alamat:</strong> ${escapeHtml(quiz.alamat || '')}</div>
            </div>
          </div>
          <div class="d-flex gap-2 justify-content-center flex-wrap mt-3">
            <button id="submitBtn" type="button" class="btn btn-success btn-lg rounded-pill px-5">
              <i class="bi bi-check-circle me-1" aria-hidden="true"></i> Kumpulkan Pretest
            </button>
            <button id="restartBtn" type="button" class="btn btn-outline-secondary btn-lg rounded-pill px-5">
              <i class="bi bi-arrow-counterclockwise me-1" aria-hidden="true"></i> Ulangi
            </button>
          </div>
        </div>
      `;

      document.getElementById('submitBtn')?.addEventListener('click', submitResult);
      document.getElementById('restartBtn')?.addEventListener('click', () => {
        clearState();
        location.reload();
      });
    }

    // ============================================================
    //   SUBMIT
    // ============================================================
    async function submitResult(e) {
      if (STATE.isSubmitting) return;
      STATE.isSubmitting = true;

      const btn = e.currentTarget;
      const original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Mengirim...';

      const quiz = STATE.quiz;
      try {
        const answers = JSON.stringify(
          quiz.answers.map(a => ({
            qid: a.questionId,
            selected: a.selectedOption,
            correct: a.isCorrect,
          }))
        );
        const res = await submitPretest(quiz.nama, quiz.nohp, quiz.alamat, answers, quiz.score);

        if (res && res.success) {
          showToast('✅ Pretest berhasil dikirim!', 'success');
          clearState();
          setTimeout(() => location.reload(), 1200);
        } else {
          throw new Error((res && res.error) || 'Gagal mengirim');
        }
      } catch (err) {
        showToast('❌ Gagal mengirim: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = original;
      } finally {
        STATE.isSubmitting = false;
      }
    }

    // ============================================================
    //   SKELETON
    // ============================================================
    function renderSkeleton() {
      const c = document.getElementById('pretestContainer');
      if (!c) return;
      c.innerHTML = `
        <div class="glass-card" style="background:#f8fafc;padding:1.5rem;">
          <div class="skeleton-box" style="height:24px;width:60%;margin-bottom:16px;"></div>
          <div class="skeleton-box" style="height:16px;width:80%;margin-bottom:10px;"></div>
          <div class="skeleton-box" style="height:16px;width:50%;margin-bottom:24px;"></div>
          <div class="skeleton-box" style="height:48px;width:100%;border-radius:50px;margin-bottom:12px;"></div>
          <div class="skeleton-box" style="height:48px;width:100%;border-radius:50px;"></div>
        </div>
      `;
    }

    // ============================================================
    //   BOOT — INSTANT LOAD + AUTO UPDATE
    // ============================================================
    (async function boot() {
      if (STATE.isMounted) return;
      STATE.isMounted = true;

      const canAccess = await guardPublicAccess();
      if (!canAccess) return;

      try { updateNavbarMenu(); } catch (e) { /* silent */ }

      // Skeleton awal (instant)
      renderSkeleton();

      // ⚡ CREATE PUBLIC CACHE
      STATE.cacheInstance = createPublicCache({
        cacheKey: 'pretest_questions_public_v1',
        action: 'getPretestQuestions',
        params: {},
        ttlMs: 5 * 60 * 1000,
        verbose: false,
        render: (data, meta) => {
          const normalized = Array.isArray(data) ? data : (data?.data || []);
          const questions = normalized.slice().sort((a, b) =>
            (parseInt(a.urutan) || 0) - (parseInt(b.urutan) || 0)
          );

          const changed = JSON.stringify(questions.map(q => q.id).slice(0, 3)) !==
                          JSON.stringify(STATE.questions.map(q => q.id).slice(0, 3));

          STATE.questions = questions;

          // Kalau quiz sudah mulai, jangan render ulang form
          if (STATE.quiz && STATE.quiz.started && !STATE.quiz.isFinished) {
            if (changed) {
              console.warn('[Pretest] Questions updated mid-quiz — will apply on next restart');
              showToast('Soal diperbarui. Restart untuk menerapkan soal baru.', 'info');
            }
            return;
          }

          renderFormDataDiri();
        },
        onChange: (data, meta) => {
          if (meta.source === 'network' && meta.changed) {
            setCacheIndicator('updated', '✓ Diperbarui');
          } else if (meta.source === 'cache') {
            setCacheIndicator('instant', '⚡ Instan');
          }
        },
        onError: (err) => {
          console.warn('[Pretest] Cache error:', err.message);
        },
      });

      if (!STATE.cacheInstance) {
        console.error('[Pretest] Failed to create cache instance');
        setCacheIndicator('', 'Error');
        return;
      }

      await STATE.cacheInstance.boot();

      const stats = STATE.cacheInstance.getStats();
      if (stats.hasCache) {
        setCacheIndicator('instant', '⚡ Instan');
      } else {
        setCacheIndicator('instant', 'Baru dimuat');
      }

      console.log('[Pretest] ✅ Boot complete');
    })();

    // ============================================================
    //   CLEANUP
    // ============================================================
    window.addEventListener('beforeunload', () => {
      stopTimer();
      if (STATE.cacheInstance) {
        try { STATE.cacheInstance.destroy(); }
        catch (e) { /* silent */ }
        STATE.cacheInstance = null;
      }
      if (STATE.cacheIndicatorTimer) {
        clearTimeout(STATE.cacheIndicatorTimer);
        STATE.cacheIndicatorTimer = null;
      }
    });

    // ============================================================
    //   DEBUG API
    // ============================================================
    window.__pretestDebug = {
      getQuestions: () => STATE.questions,
      getQuiz: () => STATE.quiz,
      getCacheStats: () => STATE.cacheInstance?.getStats() || null,
      forceRefresh: () => STATE.cacheInstance?.forceRefresh(),
      clearCache: () => STATE.cacheInstance?.clearCache(),
      resetQuizState: () => clearState(),
    };

    console.log(
      '%c pretest.html v28.4.0 — Instant Load + Auto-Update ',
      'background:#16a34a;color:#fff;padding:4px 8px;border-radius:4px;font-weight:600;'
    );
  </script>
</body>
</html>
